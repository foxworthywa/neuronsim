# Build the single-file bundle and publish it to GitHub Pages.
# Site URL: https://foxworthywa.github.io/neuronsim/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/neuron-signaling-sim-sm3b30]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run biology tests
        run: npm test
      - name: Build single-file bundle
        run: node build.js
      - name: Enable Pages (no-op once enabled)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
