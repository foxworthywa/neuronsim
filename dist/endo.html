<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EndoSim — Hormones and feedback</title>
<style>
/* Shared base styles for the models (layout: stage + side panel + trace strip). See docs/VISUAL_STYLE.md. */
:root {
  --bg: #f6f5f0;
  --panel: #ffffff;
  --ink: #1f2430;
  --muted: #5f6675;
  --line: #d9d6cc;
  --accent: #2f6fd6;
  --accent-ink: #ffffff;
  --good: #2f9e5b;
  --bad: #d24b3f;
  --warn: #c98a1b;
  --na: #e8772e;
  --k: #8e5cf0;
  --cl: #3cae6c;
  --ca: #2d8fd5;
  --anion: #8f97a6;
  --nt: #d63c8a;
  --membrane: #2a2f3a;
  --outside: #f2f5fb;
  --inside: #fbf3e6;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
}
header {
  display: flex; align-items: center; gap: 14px; padding: 8px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
header .sub { color: var(--muted); font-size: 13px; }
header .spacer { flex: 1; }
header button, .panel button, .actions button, .lab button {
  font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer;
}
header button:hover, .panel button:hover, .actions button:hover, .lab button:hover { border-color: #b8b4a6; background: #faf9f5; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.primary:hover { background: #2a62bd; }
button:disabled { opacity: .45; cursor: not-allowed; }
header select { font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
#progress { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
#progress button {
  width: 26px; height: 26px; padding: 0; border-radius: 50%; font-size: 12px; color: var(--muted);
  border: 1px solid var(--line); background: #fff;
}
#progress button.done { background: #e2ecfb; border-color: #b9cdf0; color: #2f4f86; }
#progress button.current { background: var(--accent); color: #fff; border-color: var(--accent); }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; padding: 10px 16px 14px; }
#stage-wrap { grid-column: 1; grid-row: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; position: relative; overflow: hidden; min-height: 420px; display: flex; flex-direction: column; }
#stage-top { display: flex; align-items: center; gap: 10px; padding: 6px 12px 4px; }
#stage { flex: 1; min-height: 0; width: 100%; display: block; background: var(--bg); }
#stage svg { width: 100%; height: 100%; display: block; }
#stage-caption { flex: 1; font-size: 13px; color: var(--muted); }
#vm-badge { font-size: 13px; font-variant-numeric: tabular-nums; background: #fff; border: 1px solid var(--line); padding: 3px 10px; border-radius: 8px; white-space: nowrap; }
#vm-badge b { font-size: 16px; }
#narrator { margin: 4px 10px 10px; font-size: 14px; line-height: 1.35; background: #fbfaf6; border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: 7px 12px; border-radius: 8px; min-height: 44px; color: var(--ink); }
#narrator:empty { visibility: hidden; }
#narrator b { font-weight: 650; }
#narrator .dir { font-weight: 700; letter-spacing: .3px; }
#paused-badge { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); font-size: 12px; background: #fff3d6; border: 1px solid #ecd9a6; color: #7a5a10; padding: 3px 10px; border-radius: 999px; display: none; }

#panel { grid-column: 2; grid-row: 1 / span 2; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
#panel h2 { margin: 0; font-size: 16px; }
#panel .scene-label { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
#panel .text p { margin: 0 0 8px; }
#panel .text p:last-child { margin-bottom: 0; }
.question { border: 1px solid #cfdcf3; background: #f3f7fe; border-radius: 10px; padding: 10px 12px; }
.question .prompt { font-weight: 600; margin-bottom: 8px; }
.question .options { display: flex; flex-direction: column; gap: 6px; }
.question .options button { text-align: left; }
.question .options button.correct { border-color: var(--good); background: #eaf7ee; }
.question .options button.wrong { border-color: var(--bad); background: #fdeeec; }
.feedback { margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: 14px; }
.feedback.good { background: #eaf7ee; border: 1px solid #bfe3ca; }
.feedback.bad { background: #fdeeec; border: 1px solid #f0c3bd; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.actions button.na { border-color: var(--na); color: #a04d12; }
.actions button.k { border-color: var(--k); color: #5b39a8; }
.actions button.cl { border-color: var(--cl); color: #23724a; }
.actions button.ca { border-color: var(--ca); color: #1c5f92; }
.actions button.held { background: #fff1e6; }
.status { font-size: 13px; color: var(--muted); }
.status.ok { color: var(--good); }
.nav { margin-top: auto; display: flex; gap: 8px; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid var(--line); }
.hint { font-size: 13px; color: var(--muted); }
.ion { display: inline-block; padding: 0 5px; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 600; }
.ion.na { background: var(--na); } .ion.k { background: var(--k); } .ion.cl { background: var(--cl); } .ion.ca { background: var(--ca); } .ion.nt { background: var(--nt); }
kbd.part { background: #eef0f4; border: 1px solid #d6dae2; border-radius: 4px; padding: 0 5px; font: inherit; font-size: 13px; }

#trace-wrap { grid-column: 1; grid-row: 2; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px 6px; }
#trace-head { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
#trace-head label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
#trace { width: 100%; height: 200px; display: block; }
#trace.with-g { height: 250px; }
.legend { display: inline-flex; gap: 10px; align-items: center; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }

.lab { display: grid; grid-template-columns: 1fr; gap: 8px; }
.lab .row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.lab .row label { flex: 1; }
.lab .row input[type=range] { flex: 2; }
.lab .row .val { width: 62px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.lab h3 { margin: 6px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }

.loop-diagram { display: flex; flex-direction: column; gap: 4px; align-items: stretch; font-size: 13px; }
.loop-diagram .node { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: #fafaf7; text-align: center; transition: background .2s, border-color .2s; }
.loop-diagram .node.hot { background: #fff1e6; border-color: var(--na); font-weight: 600; }
.loop-diagram .arrow { text-align: center; color: var(--muted); line-height: 1; }

@media (max-height: 640px) {
  body { height: auto; min-height: 100vh; overflow: auto; }
  main { display: flex; flex-direction: column; }
  #stage-wrap { min-height: 420px; }
}
@media (max-width: 980px) {
  body { height: auto; min-height: 100vh; overflow: auto; }
  main { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
  #stage-wrap { grid-column: 1; grid-row: 1; min-height: 340px; }
  #trace-wrap { grid-column: 1; grid-row: 2; }
  #panel { grid-column: 1; grid-row: 3; }
}

/* --- additions used by the shared lesson runner (lib/lesson.js) ---------------------------- */
:focus-visible { outline: 3px solid #f0b429; outline-offset: 2px; }
/* answered questions stay readable: only the chosen answer keeps its colour */
.question .options button:disabled { opacity: 1; color: var(--muted); background: #f7f7f4; }
.question .options button.correct:disabled { color: var(--ink); background: #eaf7ee; border-color: var(--good); }
.numrow { display: flex; gap: 6px; align-items: center; }
.numrow input { font: inherit; width: 110px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; }
.numrow .unit { color: var(--muted); }
.actions button.blood { border-color: #c23b33; color: #8f2620; }
.actions button.blood.held { background: #fdecea; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
header a.home { color: var(--muted); font-size: 13px; text-decoration: none; }
header a.home:hover { text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 700px) {
  header { flex-wrap: wrap; gap: 6px 10px; padding: 8px 12px; }
  header .spacer { display: none; }
  #progress { order: 3; width: 100%; }
  main { padding: 8px 10px 12px; }
  #stage-wrap { min-height: 300px; }
}

</style>
<style>
  :root {
    --rh: #12877f;        /* releasing hormones (TRH, CRH) */
    --tropic: #7b3f99;    /* pituitary hormones (TSH, ACTH) */
    --target: #c77d0a;    /* gland hormones (T4/T3, cortisol) */
    --drug: #3d6fb6;
    --gland: #c98b7c;
  }
  #trace { height: 250px; }
  #meters { position: absolute; right: 12px; bottom: 74px; justify-content: flex-end; display: none; gap: 8px; flex-wrap: wrap; max-width: 60%; }
  #meters.on { display: flex; }
  #meters .m { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; font-size: 12px; color: var(--muted); }
  #meters .m b { display: block; font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; }
  #meters .m.hot { border-color: var(--bad); background: #fff5f4; }
  #meters .m.good { border-color: var(--good); background: #f1faf4; }
  #vm-badge { min-width: 150px; text-align: center; }
  .record textarea { width: 100%; height: 190px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; }
  .record input[type=text] { font: inherit; width: 100%; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; }
  .record label { font-size: 13px; color: var(--muted); display: block; margin: 4px 0 2px; }
  .record .row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .record .code { margin-top: 6px; font-size: 15px; }
  .record .warn { color: #8a4b0f; background: #fff3d6; border-radius: 8px; padding: 6px 10px; margin: 8px 0 0; font-size: 14px; }
  .dialog { position: fixed; inset: 0; background: rgba(31, 36, 48, .45); display: none; align-items: center; justify-content: center; z-index: 10; }
  .dialog.on { display: flex; }
  .dialog .box { background: #fff; border-radius: 12px; padding: 16px 18px; width: min(640px, 92vw); max-height: 90vh; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
  .dialog input { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; }
  .dialog .result { font-weight: 600; }
  .dialog p { margin: 0 0 6px; }
  .case { border-left: 4px solid #7b3f99; background: #f8f3fb; border-radius: 8px; padding: 8px 12px; margin: 6px 0; font-size: 14px; }
  .case p { margin: 0 0 6px; }
  .case p:last-child { margin-bottom: 0; }
  .case-h { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #5d2c76; font-weight: 700; margin-bottom: 4px; }
  /* lab report */
  .labrep { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 13px; }
  .labrep .lh { background: #f1efe8; padding: 4px 8px; font-weight: 650; display: flex; justify-content: space-between; gap: 8px; }
  .labrep table { width: 100%; border-collapse: collapse; }
  .labrep td, .labrep th { padding: 3px 8px; border-top: 1px solid #eceae3; text-align: left; font-variant-numeric: tabular-nums; }
  .labrep th { font-weight: 600; color: var(--muted); font-size: 12px; }
  .labrep td.v { text-align: right; font-weight: 650; }
  .labrep td.f { width: 26px; font-weight: 700; }
  .labrep tr.H td.f, .labrep tr.H td.v { color: #b0352b; }
  .labrep tr.L td.f, .labrep tr.L td.v { color: #2457a6; }
  .labrep td.r { color: var(--muted); font-size: 12px; }
  /* prediction / observation table */
  .ptable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ptable th, .ptable td { border: 1px solid var(--line); padding: 3px 6px; text-align: center; }
  .ptable th { background: #f1efe8; font-weight: 600; }
  .ptable td.l { text-align: left; }
  .ptable .up { color: #b0352b; font-weight: 700; } .ptable .down { color: #2457a6; font-weight: 700; } .ptable .same { color: var(--muted); }
  .dial { display: flex; flex-direction: column; gap: 6px; border: 1px solid #e3d2ee; background: #faf6fc; border-radius: 10px; padding: 8px 10px; }
  .dial input[type=range] { width: 100%; accent-color: var(--tropic); }
  .dial .big { font-size: 20px; font-weight: 700; color: var(--tropic); font-variant-numeric: tabular-nums; }
  .meterbar { height: 10px; background: #eceae3; border-radius: 6px; overflow: hidden; }
  .meterbar i { display: block; height: 100%; background: var(--good); }
  .actions button.hormone { border-color: var(--tropic); color: #5d2c76; }
  .actions button.drug { border-color: var(--drug); color: #23497f; }
  #stage [tabindex]:focus { outline: none; }
  #trace-head { flex-wrap: wrap; row-gap: 2px; }
  #trace-head .legend { flex-wrap: wrap; font-size: 12px; gap: 8px; }
</style>

<header>
  <div>
    <h1>EndoSim</h1>
    <div class="sub">Part A · Hormones and feedback</div>
  </div>
  <nav id="progress" aria-label="Scenes"></nav>
  <div class="spacer"></div>
  <button id="btn-case" type="button" title="Reopen the patient case">Maria's case</button>
  <label class="sub">Speed
    <select id="speed" title="How much simulated time passes per second of real time">
      <option value="10">10 minutes per second</option>
      <option value="60">1 hour per second</option>
      <option value="120">2 hours per second</option>
      <option value="360">6 hours per second</option>
      <option value="720">½ day per second</option>
      <option value="1440" selected>1 day per second</option>
      <option value="10080">1 week per second</option>
      <option value="20160">2 weeks per second</option>
      <option value="43200">1 month per second</option>
    </select>
  </label>
  <button id="btn-pause" type="button" title="Pause / resume the simulation clock (P)">Pause</button>
</header>
<main>
  <div id="stage-wrap">
    <div id="stage-top">
      <div id="stage-caption"></div>
      <div id="vm-badge" aria-live="off"><span id="badge-label">Clock</span> <b id="badge-value">—</b></div>
    </div>
    <div id="stage"></div>
    <div id="meters" aria-live="off"></div>
    <div id="paused-badge">Paused</div>
    <div id="narrator" aria-live="off"></div>
    <div id="sr-live" class="sr-only" aria-live="polite"></div>
  </div>
  <aside id="panel" aria-label="Lesson"></aside>
  <div id="trace-wrap">
    <div id="trace-head">
      <span id="trace-title">Hormone levels</span>
      <span class="legend" id="trace-legend"></span>
      <span style="flex:1"></span>
      <span id="sim-clock" style="font-variant-numeric: tabular-nums">day 0</span>
    </div>
    <canvas id="trace" role="img" aria-label="Hormone levels over time, with the reference range shaded"></canvas>
  </div>
</main>
<div id="verify" class="dialog" role="dialog" aria-modal="true" aria-labelledby="verify-title">
  <div class="box">
    <h2 id="verify-title" style="margin:0;font-size:16px">Check a completion code (instructor)</h2>
    <p style="margin:0;font-size:14px;color:var(--muted)">Type the group's names as they entered them and the code from their worksheet. The order of the names, capitals and extra spaces do not matter.</p>
    <label class="sub" for="verify-name">Names</label><input type="text" id="verify-name">
    <label class="sub" for="verify-code">Completion code</label><input type="text" id="verify-code" placeholder="EA-XXXXX-XXXXX">
    <div class="result" id="verify-result" role="status"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" id="verify-close">Close</button><button type="button" class="primary" id="verify-check">Check</button></div>
  </div>
</div>
<div id="case" class="dialog" role="dialog" aria-modal="true" aria-labelledby="case-title">
  <div class="box">
    <h2 id="case-title" style="margin:0;font-size:16px">Maria's case</h2>
    <div id="case-body" style="font-size:15px"></div>
    <div style="display:flex;justify-content:flex-end"><button type="button" class="primary" id="case-close">Close</button></div>
  </div>
</div>
<script>
/*
 * Lesson runner shared by the models (see docs/PEDAGOGY.md).
 *
 * A lesson is a list of scenes; each scene a list of steps. A step can show text, ask a question
 * (multiple choice with targeted feedback, or a number read off the model), offer actions
 * (click or hold), and wait for an activity to be done in the simulation. Continue is enabled only
 * when the question is answered correctly and the activity is done.
 *
 * The runner also keeps a record of what the student did: their first answer to every question
 * (their prediction), how many tries it took, and values they measured. Models turn that into a
 * lab record for the LMS.
 *
 * Stage, traces and simulation belong to each model; the model passes a `host` with
 * applyStep(), which the runner calls whenever a step is entered.
 */
(function (root) {
  'use strict';

  function htmlEl(tag, attrs, html) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (attrs[k] == null) continue;
      if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]);
    }
    if (html != null) e.innerHTML = html;
    return e;
  }

  // A button that acts while held: pointer, or Space/Enter on the keyboard.
  function makeHoldButton(b, down, up) {
    let held = false;
    const start = (e) => { if (held) return; held = true; if (e) e.preventDefault(); b.classList.add('held'); down(); };
    const stop = () => { if (!held) return; held = false; b.classList.remove('held'); up(); };
    b.addEventListener('pointerdown', start);
    b.addEventListener('pointerup', stop); b.addEventListener('pointerleave', stop); b.addEventListener('pointercancel', stop);
    b.addEventListener('keydown', (e) => { if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) start(e); });
    b.addEventListener('keyup', (e) => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); stop(); } });
    b.addEventListener('blur', stop);
    b.addEventListener('click', (e) => e.preventDefault());
  }

  function createRunner(opts) {
    const { lesson, panel, progress, host } = opts;
    const inheritKeys = opts.inheritKeys || ['view', 'viewOpts', 'speed'];
    const runner = {
      scene: 0, step: 0, state: null, freeMode: false,
      record: { started: new Date(), answers: {}, values: {}, notes: [], visited: new Set(), completed: new Set() },
    };

    const ctx = Object.assign({
      complete() { if (runner.state && !runner.state.done) { runner.state.done = true; markCompleted(); refreshNav(); } },
      status(msg, ok) { const s = panel.querySelector('.status'); if (s) { s.innerHTML = msg; s.classList.toggle('ok', !!ok); } },
      next() { goto(runner.scene, runner.step + 1); },
      refresh() { renderPanel(); },
      stepState: () => runner.state,
      recordValue(key, value) { runner.record.values[key] = value; },
      note(text) { runner.record.notes.push(text); },
      record: runner.record,
    }, host.ctx || {});

    function currentStep() { return lesson[runner.scene].steps[runner.step]; }
    function markCompleted() { runner.record.completed.add(stepKey(runner.scene, runner.step)); }
    function stepKey(si, ki) { return `${lesson[si].id}.${ki}`; }

    function goto(si, ki) {
      if (si >= lesson.length) si = lesson.length - 1;
      if (ki >= lesson[si].steps.length) { if (si + 1 < lesson.length) { si++; ki = 0; } else ki = lesson[si].steps.length - 1; }
      if (ki < 0) { if (si > 0) { si--; ki = lesson[si].steps.length - 1; } else ki = 0; }
      runner.freeMode = false;
      const sceneChanged = si !== runner.scene || runner.state == null;
      runner.scene = si; runner.step = ki;
      runner.record.visited.add(stepKey(si, ki));
      const scene = lesson[si], step = scene.steps[ki];
      // A step finished once stays finished: going Back must never trap a student in an activity
      // whose moment has passed (e.g. a valve event that already happened).
      runner.state = { done: !step.waitFor || runner.record.completed.has(stepKey(si, ki)), answered: !step.question, attempts: 0, data: {} };
      // Steps inherit view settings from earlier steps of the same scene, so jumping into the
      // middle of a scene (or stepping back into it) shows the right picture.
      const eff = {};
      for (let j = 0; j <= ki; j++) for (const k of inheritKeys) if (scene.steps[j][k] != null) eff[k] = scene.steps[j][k];
      if (eff.speed == null && scene.speed != null) eff.speed = scene.speed;
      host.applyStep({ scene, step, eff, sceneChanged, si, ki });
      if (step.enter) step.enter(ctx);
      renderPanel();
      renderProgress();
    }

    function renderProgress() {
      if (!progress) return;
      progress.innerHTML = '';
      lesson.forEach((s, i) => {
        const b = htmlEl('button', { title: s.title, 'aria-label': `Scene ${i + 1}: ${s.title}` }, String(i + 1));
        b.className = runner.freeMode ? '' : (i < runner.scene ? 'done' : i === runner.scene ? 'current' : '');
        if (i === runner.scene && !runner.freeMode) b.setAttribute('aria-current', 'step');

    function renderPanel() {
      const scene = lesson[runner.scene], step = currentStep(), st = runner.state;
      panel.innerHTML = '';

      panel.appendChild(htmlEl('h2', {}, step.title || scene.title));
      const text = typeof step.text === 'function' ? step.text(ctx) : step.text;
      if (text) panel.appendChild(htmlEl('div', { class: 'text' }, text));
      if (step.question) panel.appendChild(renderQuestion(step.question, st));
      if (step.actions && step.actions.length) {
        const a = htmlEl('div', { class: 'actions' });
        for (const act of step.actions) {
          const b = htmlEl('button', { class: act.cls || '', type: 'button' }, act.label);
          if (act.hold) makeHoldButton(b, () => act.down(ctx), () => act.up(ctx));
          else b.addEventListener('click', () => { act.run(ctx); });
          if (act.disabled && act.disabled(ctx)) b.disabled = true;
          a.appendChild(b);
        }
        panel.appendChild(a);
      }
      panel.appendChild(htmlEl('div', { class: 'status', role: 'status' }, step.status ? (typeof step.status === 'function' ? step.status(ctx) : step.status) : ''));
      if (step.extra) { const ex = htmlEl('div', { class: 'extra' }); step.extra(ex, ctx); panel.appendChild(ex); }
      const nav = htmlEl('div', { class: 'nav' });
      const back = htmlEl('button', { type: 'button' }, '← Back');
      back.addEventListener('click', () => goto(runner.scene, runner.step - 1));
      if (runner.scene === 0 && runner.step === 0) back.disabled = true;
      const hint = htmlEl('span', { class: 'hint' }, '');
      const last = runner.scene === lesson.length - 1 && runner.step === scene.steps.length - 1;
      const cont = htmlEl('button', { class: 'primary', id: 'btn-continue', type: 'button' }, step.continueLabel || 'Continue →');
      cont.addEventListener('click', () => {
        if (step.onContinue) step.onContinue(ctx);
        if (step.continueTo) step.continueTo(ctx); else if (!last) goto(runner.scene, runner.step + 1);
      });
      if (last && !step.continueTo) cont.style.display = 'none';
      nav.appendChild(back); nav.appendChild(hint); nav.appendChild(cont);
      panel.appendChild(nav);

    }

    function refreshNav() {
      const st = runner.state, step = currentStep(), b = panel.querySelector('#btn-continue'), hint = panel.querySelector('.nav .hint');
      if (!b || !st) return;
      const ok = st.answered && st.done;
      b.disabled = !ok;
      if (hint) hint.textContent = ok ? '' : (!st.answered ? 'Answer the question to continue' : (step.waitHint || 'Complete the activity to continue'));
    }

    // Records the student's first answer (their prediction) and how many tries it took.
    function noteAnswer(q, given, correct) {
      const key = stepKey(runner.scene, runner.step);
      let r = runner.record.answers[key];
      if (!r) r = runner.record.answers[key] = { scene: runner.scene + 1, prompt: stripHtml(q.prompt), first: given, firstCorrect: correct, attempts: 0, done: false };
      if (!r.done) { r.attempts++; if (correct) { r.done = true; r.final = given; } }
    }

    function renderQuestion(q, st) {
      const box = htmlEl('div', { class: 'question' });
      const promptId = 'q-' + Math.random().toString(36).slice(2, 8);
      box.appendChild(htmlEl('div', { class: 'prompt', id: promptId }, q.prompt));
      const fb = htmlEl('div', { class: 'feedback', style: 'display:none', role: 'status' });
      const prior = runner.record.answers[stepKey(runner.scene, runner.step)];
      if (q.type === 'number') {
        const row = htmlEl('div', { class: 'numrow' });
        const inp = htmlEl('input', { type: 'number', inputmode: 'decimal', step: 'any', 'aria-labelledby': promptId });
        const unit = htmlEl('span', { class: 'unit' }, q.unit || '');
        const check = htmlEl('button', { type: 'button' }, 'Check');
        const submit = () => {
          const v = parseFloat(inp.value);
          if (!isFinite(v)) { fb.className = 'feedback bad'; fb.innerHTML = 'Type a number first.'; fb.style.display = 'block'; return; }
          st.attempts++;

            fb.className = 'feedback good'; fb.innerHTML = '<b>Right.</b> ' + (typeof q.explain === 'function' ? q.explain(ctx, v) : (q.explain || ''));
            inp.disabled = true; check.disabled = true; st.answered = true;
            if (q.onCorrect) q.onCorrect(ctx, v);
            refreshNav();
          } else {
            fb.className = 'feedback bad'; fb.innerHTML = '<b>Not quite.</b> ' + (q.hint ? q.hint(ctx, v, target) : 'Read the value again from the graph.');
          }
          fb.style.display = 'block';
        };
        check.addEventListener('click', submit);
        inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
        row.appendChild(inp); row.appendChild(unit); row.appendChild(check);
        box.appendChild(row); box.appendChild(fb);
        if (prior && prior.done) { inp.value = parseFloat(prior.final); inp.disabled = true; check.disabled = true; st.answered = true; fb.className = 'feedback good'; fb.innerHTML = '<b>Answered.</b>'; fb.style.display = 'block'; }
        return box;
      }
      const opts = htmlEl('div', { class: 'options', role: 'group', 'aria-labelledby': promptId });
      displayOrder(q).forEach((o) => {
        const b = htmlEl('button', { type: 'button' }, o.t);
        b.addEventListener('click', () => {
          st.attempts++;
          noteAnswer(q, stripHtml(o.t), !!o.ok);
          Array.from(opts.children).forEach(c => c.classList.remove('wrong'));
          if (o.ok) {
            b.classList.add('correct');
            Array.from(opts.children).forEach(c => { c.disabled = true; });
            fb.className = 'feedback good'; fb.innerHTML = '<b>Right.</b> ' + (o.fb || q.explain || '');
            st.answered = true;
            if (q.onCorrect) q.onCorrect(ctx);
            refreshNav();
          } else {
            b.classList.add('wrong');
            fb.className = 'feedback bad'; fb.innerHTML = '<b>Not quite.</b> ' + (o.fb || '');
          }
          fb.style.display = 'block';
        });
        opts.appendChild(b);
      });
      box.appendChild(opts); box.appendChild(fb);
      if (prior && prior.done) {
        st.answered = true;
        Array.from(opts.children).forEach(c => { c.disabled = true; if (stripHtml(c.innerHTML) === prior.final) c.classList.add('correct'); });
        const right = q.options.find(o => o.ok);
        fb.className = 'feedback good'; fb.innerHTML = '<b>Right.</b> ' + ((right && right.fb) || q.explain || ''); fb.style.display = 'block';
      }
      return box;
    }

    // Called every animation frame by the model with the simulation events since the last frame.
    function tick(events, dtSim) {
      if (runner.freeMode || !runner.state) return;
      const step = currentStep();
      if (step.tick) step.tick(ctx, events, dtSim);
      if (step.waitFor && !runner.state.done && step.waitFor(ctx, events)) {
        runner.state.done = true;
        markCompleted();
        if (step.onDone) step.onDone(ctx);
        refreshNav();
      }
      if (typeof step.status === 'function') {
        const s = panel.querySelector('.status');
        if (s) { const html = step.status(ctx); if (s.innerHTML !== html) s.innerHTML = html; }
      }
    }

    function enterFreeMode() { runner.freeMode = true; renderProgress(); }

    return { goto, tick, ctx, runner, currentStep, refreshNav, renderPanel, renderProgress, enterFreeMode };
  }

  // Answer options in a shuffled order that is the same every time a question is shown (seeded
  // by its prompt), so the right answer is not always in the same place. q.fixedOrder keeps the
  // authored order (e.g. options that form a scale).
  function displayOrder(q) {
    const opts = q.options.slice();
    if (q.fixedOrder) return opts;
    let h = 2166136261;
    for (const ch of q.prompt) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0;
    for (let i = opts.length - 1; i > 0; i--) {

      const j = h % (i + 1); [opts[i], opts[j]] = [opts[j], opts[i]];

  function stripHtml(s) { return String(s).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim(); }

  // Short check code over the text of a lab record (FNV-1a). It deters casual editing of a pasted
  // record; it is not security.
  function checkCode(text, salt) {
    let h1 = 0x811c9dc5, h2 = 0x01000193 ^ 0x5bd1e995;
    const s = (salt || '') + '|' + text.replace(/\r\n/g, '\n').trim();
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
      h2 = Math.imul(h2 ^ c, 0x5bd1e995) >>> 0;
    }
    const a = h1.toString(36).toUpperCase().padStart(7, '0').slice(-5), b = h2.toString(36).toUpperCase().padStart(7, '0').slice(-5);
    return `${a}-${b}`;
  }

  root.Lesson = { createRunner, htmlEl, makeHoldButton, stripHtml, checkCode };

<script>
/*
 * EndoSim engine: hormone feedback axes (see docs/ENDO_MODULE.md, "The models").
 *
 * Two three-level axes built on the same pattern:
 *   hypothalamus (releasing hormone) → pituitary (tropic hormone) → gland (target hormone),
 * with the target hormone feeding back on both upper levels, and with the gland's size following
 * the hormone that stimulates it (the trophic effect).
 *
 *   Thyroid: TRH → TSH → T4 (and T3, made mostly from T4 in the tissues).
 *   Adrenal: CRH → ACTH → cortisol, with a 24-hour rhythm and a stress input.
 *
 * Units: time in minutes; TSH mIU/L, free T4 ng/dL, free T3 pg/mL; ACTH pg/mL, cortisol µg/dL;
 * gland sizes in grams. TRH and CRH are not measured clinically, so they are reported relative to
 * normal (1 = normal). Each hormone pool is cleared at a rate set by its half-life; each step uses
 * the exact solution for a constant input over the step, so any step size is stable.
 * Works in the browser (window.EndoSim) and in Node (require).
 */
(function (root) {
  'use strict';

  // =========================================================================
  // Thyroid axis
  // =========================================================================
  function thyroidParams() {
    return {
      FT4ref: 1.3, TSHref: 1.5, FT3ref: 3.0,
      T4poolRef: 900,          // µg of T4 outside the thyroid at normal free T4
      halfTSH: 60, halfT4: 7 * DAY, halfT3: 1 * DAY,
      tauMass: 28 * DAY,       // gland growth / shrinkage
      capExp: 0.6, tauCap: 30 * DAY,   // TSH cells multiply under long stimulation and dwindle under long suppression
      massRef: 18,             // g, a normal adult thyroid
      KsTSH: 3,                // mIU/L: TSH effect on the thyroid saturates above this
      // feedback of free T4 on the hypothalamus (TRH) and pituitary (TSH)
      Kh: 1.3, nh: 2, Kp: 0.65, np: 4,
      // lesions and conditions (1 = normal)
      hypothalamus: 1, pituitary: 1, thyroid: 1, iodine: 1,
      removed: false,          // thyroid surgically removed
      TSI: 0,                  // TSH-receptor-stimulating antibody (Graves'), in TSH-equivalent mIU/L
      nodule: 0,               // µg T4/day from an autonomous nodule (ignores TSH)
      levothyroxine: 0,        // µg/day by mouth
      absorbed: 0.8,           // fraction of an oral T4 dose that is absorbed
      clearance: 1,            // multiplier on T4 breakdown (e.g., a drug that speeds it)
      manualTSH: null,         // when set, the student is the pituitary (scene 2)

  class Thyroid {
    constructor(params) {

    }
    reset() {
      const p = this.p;
      this.t = 0;
      this.TSH = p.TSHref; this.T4 = p.T4poolRef; this.T3 = 1; this.mass = 1; this.capP = 1;
      this.injected = 0;         // extra TSH given as a pulse (scene 1), mIU/L, decays like TSH
      this.events = [];

    }
    get FT4() { return this.T4 * this.p.FT4ref / this.p.T4poolRef; }
    get FT3() { return this.T3 * this.p.FT3ref; }
    get TSHeff() { return this.TSH + this.injected + this.p.TSI; }
    get size() { return this.p.removed ? 0 : this.mass * this.p.massRef + (this.p.nodule > 0 ? 4 + this.p.nodule / 25 : 0); }
    // How well iodine supply lets the gland make hormone (1 with a normal diet).

        // weeks of suppression shrink it. This is why TSH lags weeks behind a change in T4.
        const capTarget = clamp(Math.pow(this.pitStim, p.capExp), 0.2, 4);

        if (!p.removed) {
          const target = clamp(Math.sqrt(this.TSHeff / p.TSHref), 0.25, 4) * Math.min(1, p.thyroid + 0.15);
          this.mass = relax(this.mass, target / p.tauMass, 1 / p.tauMass, h);

        this.t += h;
      }

    }
    takeEvents() { const e = this.events; this.events = []; return e; }
    injectTSH(mIU) { this.injected += mIU; }
    removeThyroid() { this.p.removed = true; this.mass = 0; }
    // 24-h radioactive iodine uptake (%): how hard the gland is trapping iodine.
    get RAIU() {
      const p = this.p;
      if (p.removed) return 1;
      const trap = this.mass * p.thyroid * sat(this.TSHeff, p.KsTSH) / sat(p.TSHref, p.KsTSH) / Math.pow(Math.max(0.1, p.iodine), 0.15);
      return 100 * (1 - Math.exp(-0.2877 * trap)) + (p.nodule > 0 ? 3 : 0);
    }
    get TRAb() { return this.p.TSI > 0 ? 2 + 0.8 * this.p.TSI : 0.6; }
    // Lab results with reference ranges and H/L flags, as on a lab report.
    lab(tests) {
      const all = {
        TSH: ['TSH', this.TSHeff - this.p.TSI, 'mIU/L', 0.4, 4.0, 2],
        freeT4: ['Free T4', this.FT4, 'ng/dL', 0.8, 1.8, 2],
        freeT3: ['Free T3', this.FT3, 'pg/mL', 2.3, 4.2, 1],
        TRAb: ['TSH-receptor antibody', this.TRAb, 'IU/L', 0, 1.75, 1],
        size: ['Thyroid size (ultrasound)', this.size, 'g', 10, 25, 0],
        RAIU: ['Radioactive iodine uptake (24 h)', this.RAIU, '%', 10, 30, 0],
      };
      return (tests || Object.keys(all)).map(k => { const [name, v, unit, lo, hi, d] = all[k]; return { key: k, name, value: v, unit, lo, hi, digits: d, flag: flag(v, lo, hi) }; });
    }
    snapshot() { return { t: this.t, TRH: this.TRH, TSH: this.TSHeff - this.p.TSI, FT4: this.FT4, FT3: this.FT3, size: this.size, T4in: this.T4in, glandT4: this.glandT4 }; }
  }

  // =========================================================================
  // Adrenal axis
  // =========================================================================
  function adrenalParams() {
    return {
      Cref: 13, Aref: 20,      // reference cortisol (µg/dL) and ACTH (pg/mL) for normalizing
      halfACTH: 10, halfCortisol: 75,
      KaACTH: 70,              // pg/mL: ACTH effect on the adrenal cortex saturates above this
      Kh: 40, nh: 1, Kp: 15, np: 3,   // glucocorticoid feedback on CRH and ACTH
      tauMass: 14 * DAY, massRef: 5,   // g, one adult adrenal gland
      tauCap: 7 * DAY,         // CRH and ACTH cells recover from long suppression over weeks
      wake: 6.5,                 // h, time of waking (the rhythm peaks just after it)
      rhythmLow: 0.08,         // night-time drive, relative to the morning peak of 2
      hypothalamus: 1, pituitary: 1, adrenal: 1,

      pitResist: 1,            // … and × feedback set point (needs more cortisol to hold it back)

  // fades with a biological half-life of about 12 h. Dexamethasone: the cortisol test does not
  // detect it, it is ~7× as potent as prednisone per mg, and it lasts longer.
  const PRED_PER_MG = 3.0, PRED_HALF = 12 * HOUR, DEX_PER_MG = 75, DEX_HALF = 36 * HOUR;

      this.pred = 0; this.dex = 0;                    // glucocorticoid-equivalent drug levels
      this.prednisone = 0;     // mg/day (given at 8 am)
      this.synACTH = 0;        // cosyntropin (synthetic ACTH) in the blood, pg/mL
      this.events = [];

    get day() { return Math.floor(this.t / DAY); }

    circadian(hour) {

        const h = Math.min(2, left, toDose); left -= h;
        this.computeRates();

        this.ACTH = relax(this.ACTH, kA * this.ACTHin, kA, h);

        this.cortisol = relax(this.cortisol, kC * this.adrenalOut, kC, h);
        this.pred = relax(this.pred, 0, LN2 / PRED_HALF, h);
        this.dex = relax(this.dex, 0, LN2 / DEX_HALF, h);

  function narrateThyroid() {
    const a = app.axis, p = a.p, F = a.FT4, st = status(F, 0.8, 1.8);
    if (p.manualTSH != null) {
      const trend = app.history.length > 3 ? F - app.history[Math.max(0, app.history.length - 4)].FT4 : 0;

    }
    let s;
    if (p.removed) s = `With no thyroid, nothing makes T4: free T4 is <b>${fT4(F)}</b>. With almost no T4 holding them back, TRH is × ${a.TRH.toFixed(1)} and TSH has climbed to <b>${fv(a.TSH)} mIU/L</b>, but there is no gland to respond.`;
    else if (p.pituitary < 0.1) s = `The pituitary is blocked, so TSH is <b>${fv(a.TSH)}</b> however hard the hypothalamus pushes (TRH × ${a.TRH.toFixed(1)}). Without TSH the thyroid slows down: free T4 <b>${fT4(F)}</b>.`;
    else if (st === 'low') s = `Free T4 is <b>low (${fT4(F)} ng/dL)</b>, so it holds back the hypothalamus and pituitary less: TRH × ${a.TRH.toFixed(1)}, and TSH is <b>${fv(a.TSH)} mIU/L</b>.`;
    else if (st === 'high') s = `Free T4 is <b>high (${fT4(F)} ng/dL)</b>, so it holds back the hypothalamus and pituitary more: TRH × ${a.TRH.toFixed(1)}, and TSH is down to <b>${fv(a.TSH)} mIU/L</b>.`;
    else s = `Free T4 is <b>${fT4(F)} ng/dL</b>, in range. Its feedback keeps TSH at <b>${fv(a.TSH)} mIU/L</b>.`;
    if (p.clearance > 1.2) s += ' <b>The medicine is on:</b> the liver is breaking T4 down twice as fast.';
    if (p.levothyroxine > 0 && a.capP > 1.3) s += ` During the months of low T4, the pituitary built up its TSH-making cells (× ${a.capP.toFixed(1)}); they take weeks to scale back, so TSH falls more slowly than T4 rises.`;
    if (p.levothyroxine > 0) s += ` The tablets supply ${r0(p.levothyroxine * p.absorbed)} µg of T4 a day; the thyroid itself now makes ${r0(a.glandT4)} µg.`;

      c.textAlign = 'left'; c.textBaseline = 'top'; c.fillStyle = P.color; c.font = '600 11px system-ui, sans-serif';
      c.fillText(`${P.label} (${P.unit})${P.log ? ' · log scale' : ''}${cfg.daily ? ' · daily average' : ''}`, padL + 6, y0 + 2);
      if (P.band && P.bandLabel) { c.fillStyle = '#2f7a4f'; c.font = '11px system-ui, sans-serif'; c.fillText(P.bandLabel, padL + 6, Y(P.band[1]) + 1); }
      c.font = '11px system-ui, sans-serif';
      if (P.line != null) { c.strokeStyle = '#b0352b'; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(padL, Y(P.line)); c.lineTo(w - padR, Y(P.line)); c.stroke(); c.setLineDash([]); c.fillStyle = '#b0352b'; c.textAlign = 'right'; c.textBaseline = 'bottom'; c.fillText(P.lineLabel || '', w - padR - 4, Y(P.line) - 1); c.textAlign = 'left'; }

  // One point per whole day of history: the mean of that day's samples.
  function dailyAverages() {
    const out = [], H = app.history;

    const flush = () => { if (acc && n >= 3) { const o = { t: (day + 0.5) * DAY }; for (const k in acc) o[k] = acc[k] / n; out.push(o); } };
    for (const s of H) {
      const d = Math.floor(s.t / DAY);
      if (d !== day) { flush(); day = d; acc = {}; n = 0; }
      for (const k in s) if (k !== 't') acc[k] = (acc[k] || 0) + s[k];
      n++;
    }
    return out;
  }
  function niceTicks(min, max, n) {

    // schedule: [[mg, days], …]; the run lasts their total plus 3 weeks off the drug
    let at = 0; const sch = [];

      // lowest daily glucocorticoid effect from the moment the drug was stopped
      const stopDay = startDay + Math.round(at / DAY);
      let min = Infinity, low = 0;
      for (let dd = stopDay; dd < stopDay + 21; dd++) { const m = dayMean(dd); if (m != null) { min = Math.min(min, m); if (m < 3) low++; } }

            { t: 'No: the stress drive overrides it and cortisol rises well above normal', ok: true, fb: 'Run it and check.' },
            { t: 'Yes: feedback holds cortisol exactly where it was', fb: 'Feedback opposes changes, but how strong is it compared with the stress drive? Run it and check.' },
            { t: 'Cortisol falls, because the body uses it up', fb: 'Run it and check.' },
          ] },
          actions: [{ label: 'Apply 6 hours of stress from 2 pm', run: (c) => {
            const d = c.stepState().data, a = app.axis; if (app.run || c.stepState().done) return;
            let dt = 14 * HOUR - a.t % DAY; if (dt <= 1) dt += DAY;
            const ref = snapshotAdrenal(a); ref.advance(dt + 4 * HOUR); d.ref = ref.cortisol;
            startRun({ duration: dt + 4 * HOUR, speed: 240, schedule: [{ at: dt, fn: () => { a.p.stress = 3; mark('stress begins'); } }, { at: dt + 6 * HOUR, fn: () => { a.p.stress = 1; } }],
              onDone: () => { d.peak = a.cortisol; c.recordValue('stress', { normal: d.ref, stressed: d.peak }); startRun({ duration: 3 * HOUR, speed: 240, schedule: [{ at: 2 * HOUR, fn: () => { a.p.stress = 1; mark('stress ends'); } }], onDone: () => { c.complete(); c.refresh(); } }); c.refresh(); } });
          } }],
          waitFor: () => false, waitHint: 'Apply the stress',
          status: (c) => { const d = c.stepState().data; return d.peak != null ? `<b>Observed at 6 pm:</b> cortisol <b>${fv(d.peak)} µg/dL</b>, against ${fv(d.ref)} µg/dL in the same person without the stress.` : ''; },
        },
      ],
    },
    // ------------------------------------------------------------- 7. the steroid taper
    {
      id: 'taper', title: 'The steroid taper', speed: 10080,
      steps: [
        {
          view: 'axis', viewOpts: { caption: 'The adrenal axis of Maria\'s neighbour, Daniel. Weeks pass in seconds (see Speed at the top).' }, remount: true,
          traces: Object.assign(ADR_TRACES(14 * 7 * DAY, ['ACTH', 'gc', 'asize']), { daily: true }),
          meters: gcMeter,
          enter: (c) => { const ax = new Adrenal(); setAxis(ax); skip(7 * DAY); },
          title: 'Eight weeks of prednisone',
          text: `<div class="case"><div class="case-h">Daniel's case</div>${DANIEL_HTML}</div>
                 <p><b>Reading the graph:</b> purple is ACTH; brown adds Daniel's own cortisol and the prednisone together, because his tissues respond to both the same way; red-brown is the size of one adrenal gland. Each point is one day's average, so the daily rhythm is smoothed out.</p>`,
          question: { prompt: 'Predict: what will 20 mg of prednisone every morning for 8 weeks do to Daniel\'s ACTH and his adrenal glands?', options: [
            { t: 'ACTH falls and the adrenal glands shrink', ok: true, fb: 'Run the 8 weeks and check.' },
            { t: 'ACTH rises, because the adrenals have less work to do', fb: 'Prednisone acts like cortisol on the hypothalamus and pituitary too. What does cortisol do to the red arrows? Run it and check.' },
            { t: 'Nothing: prednisone only acts on the joints', fb: 'Prednisone acts on every cell with cortisol receptors, including the pituitary. Run it and check.' },
          ] },
          actions: [{ label: 'Start prednisone 20 mg/day and run 8 weeks', cls: 'drug', run: (c) => {
            const d = c.stepState().data; if (d.running || c.stepState().done) return; d.running = true;
            const a = app.axis; d.before = { size: a.mass * a.p.massRef };
            a.setPrednisone(20); mark('prednisone 20 mg/day');
            // end at 7:30 am, before that morning's dose, so "stopping today" means no dose today
            startRun({ duration: 56 * DAY + 7.5 * HOUR, speed: 10080, onDone: () => { d.after = { size: a.mass * a.p.massRef, ACTH: a.ACTH, own: a.cortisol }; c.recordValue('pred8', d); taperState.snap = snapshotAdrenal(a); taperState.history = app.history.slice(); taperState.origin = app.origin; taperState.zero = app.zero; taperState.markers = app.markers.slice(); taperState.gc = JSON.parse(JSON.stringify(app.gcDays)); d.running = false; c.complete(); c.refresh(); } });
          } }],
          waitFor: () => false, waitHint: 'Run the 8 weeks',
          status: (c) => { const d = c.stepState().data; return d.after ? `<b>Observed at week 8:</b> adrenal ${fv(d.before.size)} → <b>${fv(d.after.size)} g</b>; morning ACTH ${fv(d.after.ACTH)} pg/mL; his own cortisol only ${fv(d.after.own)} µg/dL. The prednisone is doing cortisol\'s job.` : d.running ? 'Weeks are passing…' : ''; },
        },
        {
          view: 'axis', title: 'Daniel stops all at once',
          enter: () => restoreWeek8(),
          question: { prompt: 'Predict: Daniel stops the prednisone today. What happens to the cortisol effect in his body over the next days?', options: [
            { t: 'It falls far below normal for weeks: his shrunken adrenals and suppressed pituitary cannot make enough yet', ok: true, fb: 'Stop it and check.' },
            { t: 'His adrenals take over within a few hours', fb: 'How big are his adrenals now, and how high is his ACTH? Stop it and check.' },
            { t: 'Nothing: prednisone stays in the body for weeks', fb: 'Its effect lasts about a day. Stop it and check.' },
          ] },
          actions: [{ label: 'Stop prednisone abruptly and run 3 weeks', cls: 'drug', run: (c) => {
            const d = c.stepState().data; if (d.running || c.stepState().done) return; d.running = true;
            predCourse(c, [[0, 0.01]], 'abrupt', (min, low) => { d.min = min; d.low = low; c.recordValue('abrupt', { min, crisisDays: low }); d.running = false; c.complete(); c.refresh(); });
          } }],
          waitFor: () => false, waitHint: 'Stop the prednisone',
          status: (c) => { const d = c.stepState().data; return d.min != null ? `<b>Observed:</b> the day's average cortisol effect fell to <b>${fv(d.min)} µg/dL</b> (normal ≈ 9), with <b>${d.low} day${d.low === 1 ? '' : 's'}</b> in the crisis zone (below 3). This is Daniel\'s adrenal crisis.` : d.running ? 'Days are passing…' : ''; },
        },
        {
          view: 'axis', title: 'A taper',
          enter: () => restoreWeek8(),
          text: `<p>Go back to week 8. This time Daniel's doctor <b>tapers</b> the dose: 15, 10 and 7.5 mg for a week each, then 5 mg and 2.5 mg for two weeks each, then stop.</p>`,
          actions: [{ label: 'Taper over 7 weeks, then stop', cls: 'drug', run: (c) => {
            const d = c.stepState().data; if (d.running || c.stepState().done) return; d.running = true;
            predCourse(c, [[15, 7], [10, 7], [7.5, 7], [5, 14], [2.5, 14]], 'taper', (min, low) => { d.min = min; d.low = low; c.recordValue('taper', { min, crisisDays: low, size: app.axis.mass * app.axis.p.massRef }); d.running = false; c.complete(); c.refresh(); });
          } }],
          waitFor: () => false, waitHint: 'Run the taper',
          status: (c) => { const d = c.stepState().data; return d.min != null ? `<b>Observed:</b> after stopping, the lowest day\'s average cortisol effect was <b>${fv(d.min)} µg/dL</b>, with <b>${d.low}</b> crisis days. His adrenals regrew to ${fv(app.axis.mass * app.axis.p.massRef)} g.` : d.running ? 'Weeks are passing…' : ''; },
        },
        {
          view: 'axis', title: 'Why the taper works',
          question: { prompt: 'Why did the taper prevent the crisis?', options: [
            { t: 'Doses below the body\'s own needs let ACTH come back and the adrenals regrow, while the pills still covered the body', ok: true, fb: 'Below about 5 mg a day, prednisone no longer holds the pituitary down completely. ACTH returns and the adrenals regrow (the trophic effect again), while the remaining dose prevents a crisis. Patients on long courses are warned never to stop suddenly, and may need extra "stress doses" during illness or surgery.' },
            { t: 'The body gets used to the drug, like caffeine', fb: 'Look at ACTH and adrenal size on the traces during the taper. What recovered?' },
            { t: 'It stops the arthritis from flaring', fb: 'That may be true, but it is not why the crisis was avoided. Look at ACTH and adrenal size during the taper.' },
          ] },
        },
      ],
    },
    // ------------------------------------------------------------- 8. tests that push the loop
    {
      id: 'tests', title: 'Tests that push the loop', speed: 360,
      steps: [
        {
          view: 'axis', viewOpts: { caption: 'A healthy adrenal axis.' }, remount: true,
          traces: ADR_TRACES(2 * DAY, ['ACTH', 'cortisol']),
          enter: () => { const ax = new Adrenal(); ax.advanceTo(18); setAxis(ax); },
          title: 'A suppression test',
          text: `<p>To test a loop, push it and see if it pushes back. <b>Dexamethasone</b> (brand name Decadron) is a strong cortisol-like drug that the cortisol blood test does not detect. In the <b>dexamethasone suppression test</b>, the patient takes 1 mg at 11 pm, and cortisol is measured at 8 am.</p>`,
          question: { prompt: 'Predict: in a healthy person, what will the 8 am cortisol be?', options: [
            { t: 'Very low (below 1.8 µg/dL): the dexamethasone feeds back and switches off ACTH', ok: true, fb: 'Run the test and check.' },
            { t: 'Very high: more steroid in the body', fb: 'The test measures the body\'s own cortisol, not the dexamethasone. What does a strong steroid do to ACTH? Run it and check.' },
            { t: 'Normal: the drug does not affect the adrenal axis', fb: 'Run the test and check.' },
          ] },
          actions: [{ label: 'Give 1 mg at 11 pm; draw blood at 8 am', cls: 'drug', run: (c) => { if (!c.stepState().done) dexTest(c, 1, 'dexHealthy', () => c.complete()); } }],
          waitFor: () => false, waitHint: 'Run the test',
          status: (c) => { const v = c.record.values.dexHealthy; return v && c.stepState().done ? `<b>8 am cortisol: ${fv(v.cortisol)} µg/dL</b> (ACTH ${fv(v.ACTH)} pg/mL). The loop pushed back: suppressed.` : ''; },
        },
        {
          view: 'axis', title: 'A stimulation test',
          enter: () => { const ax = new Adrenal(); ax.advanceTo(6); setAxis(ax); },
          text: `<p>The opposite test checks whether the adrenal cortex can respond. In the <b>ACTH stimulation test</b>, the patient is given <b>cosyntropin</b> (synthetic ACTH; brand name Cortrosyn) at 8 am, and cortisol is measured 60 minutes later. A healthy adrenal reaches at least about 18 µg/dL.</p>`,
          actions: [{ label: 'Give cosyntropin at 8 am; measure at 60 min', cls: 'drug', run: (c) => { if (!c.stepState().done) cosynTest(c, 'cosynHealthy', () => c.complete()); } }],
          waitFor: () => false, waitHint: 'Run the test',
          status: (c) => { const v = c.record.values.cosynHealthy; return v && c.stepState().done ? `<b>Cortisol ${fv(v.before)} → ${fv(v.after)} µg/dL</b> in 60 minutes: a normal response.` : ''; },
        },
        {
          view: 'axis', title: 'Patient 1',
          traces: ADR_TRACES(2 * DAY, ['ACTH', 'cortisol']),
          enter: (c) => { setPatient('adrenalTumour'); const a = app.axis; a.advanceTo(8); c.stepState().data.lab = a.lab(['cortisol', 'ACTH']); app.history = []; recordSample(true); },
          text: (c) => `<div class="case"><div class="case-h">Patient 1</div><p><b>Ms. Rivera, 45,</b> has gained weight around her face and trunk, has purple stretch marks on her abdomen, bruises easily, and has high blood glucose and blood pressure: signs of too much cortisol (<b>Cushing's syndrome</b>). She takes no steroid medicines.</p></div>${labTable(c.stepState().data.lab, 'Her 8 am blood test')}`,
          actions: [{ label: 'Run a dexamethasone suppression test (1 mg)', cls: 'drug', run: (c) => { if (!c.stepState().done) dexTest(c, 1, 'dexP1', () => c.complete()); } }],
          waitFor: () => false, waitHint: 'Run the suppression test',
          status: (c) => { const v = c.record.values.dexP1; return v && c.stepState().done ? `<b>8 am cortisol after dexamethasone: ${fv(v.cortisol)} µg/dL</b>: not suppressed.` : ''; },
          question: { prompt: 'Her cortisol is high, her ACTH is low, and dexamethasone did not suppress it. Where is the problem?', options: [
            { t: 'In an adrenal gland: something there makes cortisol without being told to (an adrenal tumour)', ok: true, fb: 'Her pituitary is obeying the feedback: high cortisol has switched ACTH off. The cortisol is coming from the adrenal itself, which ignores ACTH and therefore ignores dexamethasone too. A CT scan would show the tumour.' },
            { t: 'In her pituitary: a tumour making ACTH', fb: 'If the pituitary were making too much ACTH, what would her ACTH level be? Hers is low.' },
            { t: 'She is secretly taking prednisone', fb: 'Prednisone would suppress her own cortisol, so the test would show <i>low</i> cortisol, with low ACTH. Hers is high.' },
          ] },
        },
        {
          view: 'axis', title: 'Patient 2',
          enter: (c) => { setPatient('addison'); const a = app.axis; a.advanceTo(8); c.stepState().data.lab = a.lab(['cortisol', 'ACTH']); app.history = []; recordSample(true); },
          text: (c) => `<div class="case"><div class="case-h">Patient 2</div><p><b>Mr. Tran, 38,</b> has months of tiredness and weight loss, craves salt, feels dizzy when he stands up, and his skin has darkened, especially in the creases of his palms.</p></div>${labTable(c.stepState().data.lab, 'His 8 am blood test')}`,
          actions: [{ label: 'Run an ACTH stimulation test', cls: 'drug', run: (c) => { if (!c.stepState().done) cosynTest(c, 'cosynP2', () => c.complete()); } }],
          waitFor: () => false, waitHint: 'Run the stimulation test',
          status: (c) => { const v = c.record.values.cosynP2; return v && c.stepState().done ? `<b>Cortisol ${fv(v.before)} → ${fv(v.after)} µg/dL</b> after cosyntropin: almost no response.` : ''; },
          question: { prompt: 'His cortisol is low, his ACTH is very high, and cosyntropin barely raised his cortisol. Where is the problem?', options: [
            { t: 'In the adrenal cortex itself (Addison\'s disease)', ok: true, fb: 'His pituitary is shouting (very high ACTH) and the adrenal cannot answer even a huge dose of ACTH. This is <b>primary adrenal insufficiency</b>, usually autoimmune. The darkened skin comes from ACTH itself, which is made from the same precursor as melanocyte-stimulating hormone. He will need cortisol replacement (hydrocortisone) for life.' },
            { t: 'In his pituitary', fb: 'If his pituitary had failed, what would his ACTH level be? His is very high.' },
            { t: 'He stopped a steroid medicine, like Daniel', fb: 'After stopping prednisone, Daniel\'s ACTH was <i>low</i> (his pituitary was suppressed too). Mr. Tran\'s ACTH is very high.' },
          ] },
        },
        {
          view: 'axis', title: 'Part A complete', continueLabel: 'Done',
          text: `<p>Your group now has what it needs to answer Maria's three questions on your worksheet:</p>${CASE_QUESTIONS}
                 <p style="margin-top:8px">Your results from this lab are below. Copy them onto your worksheet. Then type the names of everyone in your group to get your <b>completion code</b>, and put it on the worksheet too.</p>`,
          extra: (el, c) => renderCompletion(el, c),
        },
      ],
    },
  ];
  // scene 7: the state at week 8, so the abrupt stop and the taper start from the same place
  const taperState = { snap: null };
  function restoreWeek8() {
    if (!taperState.snap) { const a = new Adrenal(); a.advance(7 * DAY); a.setPrednisone(20); a.advance(56 * DAY + 7.5 * HOUR); taperState.snap = snapshotAdrenal(a); taperState.history = []; taperState.origin = a.t - 63 * DAY; taperState.zero = a.t - 56 * DAY - 7.5 * HOUR; taperState.markers = []; taperState.gc = {}; }
    setAxis(snapshotAdrenal(taperState.snap));
    app.history = taperState.history.slice(); app.origin = taperState.origin; app.zero = taperState.zero; app.markers = taperState.markers.slice(); app.gcDays = JSON.parse(JSON.stringify(taperState.gc));
    app.axis.setPrednisone(20);
  }

  // =========================================================================
  // Completion: the group's results (for the worksheet) and a completion code
  // =========================================================================
  // The code comes from the group's names (in any order) and is shown only once every question in
  // Part A has been answered. It shows the lab was finished; the worksheet carries the grade. It
  // deters casual sharing but is not security (anyone can read this page's source).
  const CODE_SALT = 'endosim-partA-complete-v1';
  const normNames = (n) => String(n || '').toLowerCase().split(/,|;|&|\n|\band\b/).map(s => s.trim().replace(/\s+/g, ' ')).filter(Boolean).sort().join(', ');
  const completionCode = (names) => 'EA-' + Lesson.checkCode(normNames(names), CODE_SALT);
  function questionsLeft() {
    const r = runner.runner.record, left = [];
    LESSON.forEach((sc, si) => sc.steps.forEach((st, ki) => {
      const a = r.answers[`${sc.id}.${ki}`];
      if (st.question && !(a && a.done)) left.push(si + 1);
    }));
    return [...new Set(left)];
  }
  function resultsLines() {
    const v = runner.runner.record.values, L = [];
    L.push('EndoSim Part A: our results');
    L.push('Scene 3 · You are the pituitary');
    if (v.manualBest != null) L.push(`  Our best time with free T4 in range: ${r0(v.manualBest)} %`);
    if (v.autoRange != null) L.push(`  The automatic pituitary: ${r0(v.autoRange)} %`);
    L.push('Scene 4 · Pull the levers (TRH / TSH / free T4 after 8 weeks)');
    for (const [k, name] of [['remove', 'Thyroid removed'], ['tablets', 'T4 tablets'], ['pituitary', 'Pituitary blocked']]) {
      const r = v['lever_' + k];
      if (r) L.push(`  ${name}: TRH ${ARROW[r.TRH]} (× ${r.after.TRH.toFixed(2)}), TSH ${ARROW[r.TSH]} (${fv(r.after.TSH)} mIU/L), free T4 ${ARROW[r.FT4]} (${fT4(r.after.FT4)} ng/dL)`);
    }
    L.push('Scene 5 · Glands grow on command');
    if (v.iodine) L.push(`  Iodine-poor diet, 6 months: thyroid ${r0(v.iodine.before.size)} → ${r0(v.iodine.after.size)} g; TSH ${fv(v.iodine.after.TSH)} mIU/L; free T4 ${fT4(v.iodine.after.FT4)} ng/dL`);
    if (v.tablets6) L.push(`  T4 tablets, 6 months: thyroid ${r0(v.tablets6.before.size)} → ${r0(v.tablets6.after.size)} g; own T4 output ${r0(v.tablets6.before.glandT4)} → ${r0(v.tablets6.after.glandT4)} µg/day`);
    if (v.maria && v.maria.w6) L.push(`  Maria on levothyroxine 100 µg: TSH ${fv(v.maria.start.TSH)} → week 1 ${fv(v.maria.w1.TSH)} → week 2 ${fv(v.maria.w2.TSH)} → week 6 ${fv(v.maria.w6.TSH)} mIU/L; free T4 ${fT4(v.maria.start.FT4)} → ${fT4(v.maria.w1.FT4)} → ${fT4(v.maria.w2.FT4)} → ${fT4(v.maria.w6.FT4)} ng/dL`);
    L.push('Scene 6 · A daily rhythm');
    if (v.draw_am) L.push(`  Cortisol at ${v.draw_am.time}: ${fv(v.draw_am.cortisol)} µg/dL (ACTH ${fv(v.draw_am.ACTH)} pg/mL)`);
    if (v.draw_mid) L.push(`  Cortisol at ${v.draw_mid.time}: ${fv(v.draw_mid.cortisol)} µg/dL (ACTH ${fv(v.draw_mid.ACTH)} pg/mL)`);
    if (v.stress) L.push(`  Cortisol at 6 pm with stress: ${fv(v.stress.stressed)} µg/dL (without: ${fv(v.stress.normal)})`);
    L.push('Scene 7 · Daniel and prednisone');
    if (v.pred8 && v.pred8.after) L.push(`  After 8 weeks of 20 mg/day: adrenal ${fv(v.pred8.before.size)} → ${fv(v.pred8.after.size)} g; morning ACTH ${fv(v.pred8.after.ACTH)} pg/mL`);
    if (v.abrupt) L.push(`  Stopped abruptly: lowest daily cortisol effect ${fv(v.abrupt.min)} µg/dL; ${v.abrupt.crisisDays} crisis days`);
    if (v.taper) L.push(`  Tapered: lowest daily cortisol effect ${fv(v.taper.min)} µg/dL; ${v.taper.crisisDays} crisis days`);
    L.push('Scene 8 · Tests');
    if (v.dexHealthy) L.push(`  Healthy, dexamethasone 1 mg: 8 am cortisol ${fv(v.dexHealthy.cortisol)} µg/dL`);
    if (v.cosynHealthy) L.push(`  Healthy, cosyntropin: cortisol ${fv(v.cosynHealthy.before)} → ${fv(v.cosynHealthy.after)} µg/dL`);
    if (v.dexP1) L.push(`  Patient 1 (Ms. Rivera), dexamethasone 1 mg: 8 am cortisol ${fv(v.dexP1.cortisol)} µg/dL`);
    if (v.cosynP2) L.push(`  Patient 2 (Mr. Tran), cosyntropin: cortisol ${fv(v.cosynP2.before)} → ${fv(v.cosynP2.after)} µg/dL`);
    return L;
  }
  function renderCompletion(el, c) {
    el.className = 'extra record';
    el.innerHTML = '';
    const ta = htmlEl('textarea', { readonly: 'readonly', 'aria-label': 'Your results' });
    ta.value = resultsLines().join('\n');
    const row = htmlEl('div', { class: 'row' });
    const copy = htmlEl('button', { type: 'button' }, 'Copy our results');
    copy.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(ta.value); c.status('<b>Copied.</b> Paste them into your worksheet.', true); }
      catch (e) { ta.focus(); ta.select(); c.status('Selected: press Ctrl+C (⌘C on a Mac) to copy.', false); }
    });
    row.appendChild(copy);
    el.appendChild(ta); el.appendChild(row);
    const left = questionsLeft();
    if (left.length) {
      el.appendChild(htmlEl('p', { class: 'warn' }, `<b>Not finished yet:</b> answer the remaining questions in scene${left.length > 1 ? 's' : ''} ${left.join(', ')} to get your completion code. (Use the numbered buttons at the top.)`));
      return;
    }
    el.appendChild(htmlEl('label', { for: 'rec-name' }, 'Everyone in your group, as in Canvas (separate the names with commas)'));
    const name = htmlEl('input', { type: 'text', id: 'rec-name', autocomplete: 'off' });
    name.value = c.record.name || '';
    const code = htmlEl('div', { class: 'code', 'aria-live': 'polite' });
    const update = () => { c.record.name = name.value.trim(); code.innerHTML = c.record.name ? `Completion code: <b>${completionCode(c.record.name)}</b>` : 'Type your names to see your completion code.'; };
    name.addEventListener('input', update);
    el.appendChild(name); el.appendChild(code);
    update();
    c.complete();
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.dialog.on').forEach(d => d.classList.remove('on')); });
  function openCase() { $('#case').classList.add('on'); $('#case-close').focus(); }
  $('#case-body').innerHTML = CASE_HTML + '<p style="margin:8px 0 2px"><b>Questions you will answer on your worksheet:</b></p>' + CASE_QUESTIONS;
  $('#btn-case').addEventListener('click', openCase);
  $('#case-close').addEventListener('click', () => $('#case').classList.remove('on'));
  function openVerify() { $('#verify').classList.add('on'); $('#verify-name').focus(); }
  $('#verify-check').addEventListener('click', () => {
    const ok = completionCode($('#verify-name').value) === $('#verify-code').value.trim().toUpperCase();
    $('#verify-result').textContent = ok ? '✓ This code matches these names.' : '✗ This code does not match these names (check the spelling).';
    $('#verify-result').style.color = ok ? 'var(--good)' : 'var(--bad)';
  });
  $('#verify-close').addEventListener('click', () => $('#verify').classList.remove('on'));
  window.__endosim.completionCode = completionCode;
  window.__endosim.LOOP = LOOP;
  window.__endosim.results = () => resultsLines().join('\n');

  // =========================================================================
  // Start
  // =========================================================================
  runner = Lesson.createRunner({
    lesson: LESSON, panel, progress: $('#progress'), host, partLabel: 'Part A',
    inheritKeys: ['view', 'viewOpts', 'speed', 'traces', 'meters', 'clock'],
  });
  if (location.hash === '#verify') openVerify();
  window.addEventListener('hashchange', () => { if (location.hash === '#verify') openVerify(); });
  runner.goto(0, 0);
  requestAnimationFrame(frame);
})();

</script>
</body>
