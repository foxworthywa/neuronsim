      },
    };
  };

  // =========================================================================
  // Voltage trace
  // =========================================================================
  const traceCanvas = $('#trace');
  const TRACE_COLORS = { soma: '#1f2430', hillock: '#b45309', axon6: '#0f766e', terminal: '#7c3aed', next: '#db2777', dendrite: '#4b5563' };
  function recordSample() {
    const s = { t: sim.t, V: {}, gNa: {}, gK: {} };
    for (const c of sim.comps) s.V[c.name] = c.V;
    s.V.next = sim.next.V;
    s.gNa.soma = sim.soma.gNa; s.gK.soma = sim.soma.gK; s.gNa.hillock = sim.hillock.gNa; s.gK.hillock = sim.hillock.gK;
    s.gNa.terminal = sim.term.gNa; s.gK.terminal = sim.term.gK;
    app.history.push(s);
    const tmin = sim.t - 400;
    while (app.history.length && app.history[0].t < tmin) app.history.shift();
  }
  function drawTrace() {
    const dpr = window.devicePixelRatio || 1;
    const w = traceCanvas.clientWidth, h = traceCanvas.clientHeight;
    if (traceCanvas.width !== Math.round(w * dpr) || traceCanvas.height !== Math.round(h * dpr)) { traceCanvas.width = Math.round(w * dpr); traceCanvas.height = Math.round(h * dpr); }
    const ctx = traceCanvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const padL = 74, padR = 14, padT = 8, padB = 20;
    const vmin = -100, vmax = 50;
    const gBand = app.showG ? 62 : 0, plotBottom = h - padB - gBand;
    const W = app.historyWindow, t1 = Math.max(sim.t, W), t0 = t1 - W;
    const X = (t) => padL + (t - t0) / W * (w - padL - padR);
    const Y = (v) => padT + (vmax - v) / (vmax - vmin) * (plotBottom - padT);
    // grid
    ctx.font = '11px system-ui, sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (const [v, lab, color, dash] of [[50, '+50', '#9ca3af', []], [0, '0', '#6b7280', []], [-55, 'threshold', '#d97706', [4, 4]], [-70, 'rest −70', '#2563eb', [2, 4]], [-100, '−100', '#9ca3af', []]]) {
      if (v === -55 && !app.showThreshold) continue;
      ctx.strokeStyle = color; ctx.setLineDash(dash); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(padL, Y(v)); ctx.lineTo(w - padR, Y(v)); ctx.stroke();
      ctx.fillStyle = color; ctx.fillText(lab, padL - 4, Y(v));
    }
    ctx.setLineDash([]);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = '#6b7280';
    for (let t = Math.ceil(t0 / 10) * 10; t <= t1 + 1e-6; t += 10) { ctx.fillText(t.toFixed(0), X(t), h - padB + 4); ctx.strokeStyle = '#eee'; ctx.beginPath(); ctx.moveTo(X(t), padT); ctx.lineTo(X(t), plotBottom); ctx.stroke(); }
    ctx.textAlign = 'left'; ctx.fillText('time (ms)', 4, h - padB + 4);
    // conductance sub-plot: how many Na⁺ / K⁺ channels are open
    if (app.showG) {
      const gc = (app.recordComp === 'soma' || app.recordComp === 'hillock' || app.recordComp === 'terminal') ? app.recordComp : 'hillock';
      const gmax = Math.max(sim.byName[gc].gNaMax, 1e-9);
      const top = plotBottom + 10, bh = gBand - 16, base = top + bh;
      ctx.strokeStyle = '#d1d5db'; ctx.beginPath(); ctx.moveTo(padL, base); ctx.lineTo(w - padR, base); ctx.stroke();
      ctx.fillStyle = '#6b7280'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText('open', padL - 4, top + 4); ctx.fillText('channels', padL - 4, top + 16); ctx.fillText('none', padL - 4, base);
      for (const [key, color] of [['gNa', '#e8772e'], ['gK', '#8e5cf0']]) {
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); let first = true;
        for (const s of app.history) { if (s.t < t0) continue; const y = base - clamp(s[key][gc] / gmax, 0, 1) * bh; if (first) { ctx.moveTo(X(s.t), y); first = false; } else ctx.lineTo(X(s.t), y); }
        ctx.stroke();
      }
    }
    // traces
    const series = [[app.recordComp, TRACE_COLORS[app.recordComp] || '#1f2430', 2.2]].concat(app.extraTraces.map(c => [c, TRACE_COLORS[c] || '#0f766e', 1.6]));
    for (const [comp, color, lw] of series) {
      ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath(); let first = true;
      for (const s of app.history) { if (s.t < t0 || s.V[comp] == null) continue; const x = X(s.t), y = Y(clamp(s.V[comp], vmin, vmax)); if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y); }
      ctx.stroke();
    }
    // markers
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    for (const m of app.markers) { if (m.t < t0) continue; ctx.strokeStyle = '#9ca3af'; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(X(m.t), padT); ctx.lineTo(X(m.t), plotBottom); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = '#374151'; ctx.fillText(m.label, X(m.t) + 3, padT + 2); }
    // legend
    const legend = $('#trace-legend');
    legend.innerHTML = series.map(([comp, color]) => `<span><i style="background:${color}"></i>${comp}</span>`).join('') + (app.showG ? `<span><i style="background:#e8772e"></i>gNa</span><span><i style="background:#8e5cf0"></i>gK</span>` : '');
  }

  // =========================================================================
  // Side panel / lesson runner
  // =========================================================================
  const panel = $('#panel');
  const runner = { scene: 0, step: 0, state: null, ctx: null, labMode: false };

  const ctx = {
    sim, app,
    view: () => app.view,
    complete() { if (runner.state && !runner.state.done) { runner.state.done = true; refreshNav(); } },
    status(msg, ok) { const s = panel.querySelector('.status'); if (s) { s.innerHTML = msg; s.classList.toggle('ok', !!ok); } },

    resume() { setPaused(false); },

  };

  function setPaused(p) {
    app.paused = p;
    $('#btn-pause').textContent = p ? 'Resume' : 'Pause';
    $('#paused-badge').style.display = p ? 'block' : 'none';
  }
  function setSpeed(s) { app.speed = s; const sel = $('#speed'); sel.value = String(s); if (sel.value !== String(s)) { const o = document.createElement('option'); o.value = String(s); o.textContent = `1 s = ${(s * 1000) % 1 === 0 ? (s * 1000).toFixed(0) : (s * 1000).toFixed(1)} ms`; sel.appendChild(o); sel.value = String(s); } }

  function currentStep() { return LESSON[runner.scene].steps[runner.step]; }

  function gotoStep(si, ki) {
    if (si >= LESSON.length) si = LESSON.length - 1;
    if (ki >= LESSON[si].steps.length) { if (si + 1 < LESSON.length) { si++; ki = 0; } else { ki = LESSON[si].steps.length - 1; } }
    if (ki < 0) { if (si > 0) { si--; ki = LESSON[si].steps.length - 1; } else ki = 0; }
    runner.labMode = false;
    const sceneChanged = si !== runner.scene || runner.state == null;
    runner.scene = si; runner.step = ki;
    const scene = LESSON[si], step = scene.steps[ki];
    runner.state = { done: !step.waitFor, answered: !step.question, attempts: 0, data: {} };
    // Steps inherit view configuration from earlier steps of the same scene, so jumping
    // into the middle of a scene (or stepping back into it) shows the right picture.
    const eff = {};
    for (let j = 0; j <= ki; j++) for (const k of ['view', 'viewOpts', 'record', 'electrode', 'labels', 'showG', 'extra', 'speed']) if (scene.steps[j][k] != null) eff[k] = scene.steps[j][k];
    const needView = eff.view && (eff.view !== app.viewName || step.remount || sceneChanged || (step.viewOpts && step.view));
    if (needView) mountView(eff.view, eff.viewOpts || {});

  function renderQuestion(q, st) {
    const box = htmlEl('div', { class: 'question' });

  // =========================================================================
  // Main loop
  // =========================================================================
  function frame(ts) {
    if (app.lastFrame == null) app.lastFrame = ts;
    const dtReal = Math.min(50, ts - app.lastFrame); app.lastFrame = ts;
    let dtSim = 0;
    if (!app.paused) {
      dtSim = dtReal * app.speed;
      let remaining = dtSim;
      while (remaining > 1e-9) { const h = Math.min(0.1, remaining); sim.advance(h); remaining -= h; recordSample(); }
    }
    if (app.stimEnd != null && sim.t >= app.stimEnd) { sim.setStim('soma', 0); app.stimEnd = null; }
    const events = sim.takeEvents();
    if (app.view && app.view.update) app.view.update(dtReal, dtSim, events);
    if (!runner.labMode) {
      const step = currentStep();
      if (step.tick) step.tick(ctx, events, dtSim);
      if (step.waitFor && !runner.state.done && step.waitFor(ctx, events)) { runner.state.done = true; if (step.onDone) step.onDone(ctx); refreshNav(); }
      if (step.status && typeof step.status === 'function') { const s = panel.querySelector('.status'); if (s) { const html = step.status(ctx); if (s.innerHTML !== html) s.innerHTML = html; } }
    }
    for (const e of events) fireEvent(e);
    if (app.view && app.view.narrate) { const html = app.view.narrate(); if (html !== app._lastNarration) { app._lastNarration = html; $('#narrator').innerHTML = html; } }
    else if (app._lastNarration !== '') { app._lastNarration = ''; $('#narrator').innerHTML = ''; }
    drawTrace();
    const rc = app.recordComp === 'next' ? { V: sim.next.V } : sim.byName[app.recordComp];
    $('#vm-value').textContent = fmtV(rc.V);
    $('#vm-label').textContent = 'Vm (' + app.recordComp + ')';
    $('#sim-clock').textContent = `t = ${sim.t.toFixed(1)} ms`;
    requestAnimationFrame(frame);
  }

  // Wiring

  $('#speed').addEventListener('change', (e) => { app.speed = parseFloat(e.target.value); app.userSpeed = app.speed; });
  $('#btn-pause').addEventListener('click', () => setPaused(!app.paused));
  $('#btn-lab').addEventListener('click', enterLab);
  $('#show-g').addEventListener('change', (e) => { app.showG = e.target.checked; traceCanvas.classList.toggle('with-g', app.showG); });
  document.addEventListener('keydown', (e) => { if (e.code === 'Space' && !(e.target instanceof HTMLInputElement) && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); setPaused(!app.paused); } });

  const since = (c) => { const d = c.stepState().data; if (d.t0 == null) d.t0 = sim.t; return app.history.filter(s => s.t >= d.t0); };
  const refire = { label: 'Fire again', cls: 'na', run: (c) => { setPaused(false); stimPulse(c, 0.45, 3); c.stepState().data.armed = true; c.stepState().data.t0 = sim.t; } };

            { t: 'The pump has pumped all the Na⁺ back out', fb: 'The pump is far too slow to act within a millisecond. Only a tiny fraction of the ions crossed anyway; the gradients are essentially unchanged.' },
          ] },
          onContinue: (c) => { setPaused(false); },
        },
        {
          view: 'membrane', title: 'You built the curve',
          text: `<p>Rising (Na⁺ in) → peak (Na⁺ inactivates, K⁺ opens) → falling (K⁺ out) → undershoot (K⁺ still open) → rest. Every phase is a consequence of which channels are open. Fire again as often as you like and watch the ladder.</p>`,
          actions: [refire],
          question: { prompt: 'Right after an action potential the membrane cannot fire again for a moment (the refractory period). Why?', options: [
            { t: 'The Na⁺ channels are inactivated and must return to the closed state before they can open again', ok: true, fb: 'The refractory period also limits how fast a neuron can fire, and, as we will see next, it is why the action potential travels in one direction only.' },
            { t: 'The cell has run out of Na⁺ outside', fb: 'Only a tiny fraction of the ions moved. The gradients are practically unchanged.' },
            { t: 'The K⁺ channels are inactivated', fb: 'The delayed K⁺ channels simply close; it is the Na⁺ channels that have an inactivated state (the plug).' },
          ] },
          waitFor: () => sim.hillock.V > -72 && sim.hillock.h > 0.4, waitHint: 'Wait for the membrane to recover',
        },
      ],
    },
    // ------------------------------------------------------------- 9. propagation
    {
      id: 'propagate', title: 'Down the axon', speed: 0.003,
      steps: [
        {
          view: 'axon', viewOpts: { caption: 'The axon, unrolled: hillock on the left, terminal on the right.' }, reset: true, record: 'hillock', extra: ['axon6', 'terminal'], electrode: true, showG: false, remount: true,
          title: 'The action potential travels',
          text: `<p>Here is the axon laid out as a series of segments, each with its own voltage-gated Na⁺ and K⁺ channels. Three electrodes record from the hillock, the middle of the axon and the terminal.</p>
                 <p>When one segment fires, its inward Na⁺ current spreads as a <b>local current</b> along the inside of the axon and depolarizes the next segment.</p>`,
          actions: [{ label: 'Fire the neuron', cls: 'na', run: (c) => { stimPulse(c, 0.45, 3); } }],
          tick: (c) => stimTick(c),
          waitFor: (c, ev) => spikeIn(ev, 'terminal'), waitHint: 'Fire the neuron and watch the wave travel',
          status: (c) => runner.state.done ? '<b>Observed:</b> the wave reached the terminal. Look at the three traces: the same full-size action potential, delayed at each electrode.' : 'Watch the channels change state from left to right.',
        },
        {
          view: 'axon', title: 'What opens the next segment\'s channels?',
          question: { prompt: 'What triggers the voltage-gated Na⁺ channels in the next segment?', options: [
            { t: 'Depolarization spreading from the active segment as local current', ok: true, fb: 'Each segment re-generates the action potential in full, so the signal never fades however long the axon is.' },
            { t: 'Na⁺ ions travelling down the axon from the hillock', fb: 'The ions themselves barely move along the axon. It is the change in voltage (charge redistributing) that spreads, much faster than any ion diffuses.' },
            { t: 'Neurotransmitter released inside the axon', fb: 'Transmitter is released only at the terminal, onto the next cell.' },
          ] },
        },
        {
          view: 'axon', title: 'Why only forward?',
          text: `<p>Fire it again and watch the channels <b>behind</b> the wave.</p>`,
          actions: [{ label: 'Fire the neuron', cls: 'na', run: (c) => { stimPulse(c, 0.45, 3); } }],
          tick: (c) => stimTick(c),
          question: { prompt: 'The segment that just fired is also depolarized by its neighbour. Why doesn\'t the action potential travel backward?', options: [
            { t: 'Behind the wave, the Na⁺ channels are inactivated (refractory) and cannot reopen', ok: true, fb: 'The inactivated channels (plug in the pore) leave the wave only one way to go. In myelinated axons the same idea applies, but the wave jumps between nodes; a topic for later.' },
            { t: 'The axon has a valve that lets current flow one way', fb: 'There is no valve. Current spreads both ways; what differs is the state of the channels on either side.' },
            { t: 'The membrane behind is already at +40 mV so nothing more can happen', fb: 'By the time the next segment fires, the previous one is already repolarizing. What stops it re-firing is its Na⁺ channels being inactivated.' },
          ] },
        },
      ],
    },
    // ------------------------------------------------------------- 10. terminal
    {
      id: 'terminal', title: 'Passing it on', speed: 0.003,
      steps: [
        {
          view: 'synapse', viewOpts: { input: 'output', caption: 'Our own terminal, facing the next neuron.' }, reset: true, record: 'terminal', extra: ['next'], electrode: true, remount: true,
          title: 'The action potential reaches the terminal',
          text: `<p>We have followed the wave to our own synaptic terminal. Its membrane has depolarized to about +40 mV.</p>`,
          question: { prompt: 'Which kind of channel responds directly to this voltage change and starts transmitter release?', options: [
            { t: 'Voltage-gated Ca²⁺ channels', ok: true, fb: 'Ca²⁺ entering the terminal is the signal for vesicles to fuse. Send an action potential and watch: Ca²⁺ in → vesicle fusion → transmitter → the next neuron\'s receptors open.' },
            { t: 'Ligand-gated receptor channels', fb: 'Those sit on the receiving side and need transmitter to open. We are on the sending side, and nothing has been released yet.' },
            { t: 'K⁺ leak channels', fb: 'Leak channels are always open and do not respond to voltage.' },
          ] },
          actions: [{ label: 'Send an action potential', cls: 'ca', run: (c) => { stimPulse(c, 0.45, 3); } }],
          tick: (c) => stimTick(c),
          waitFor: (c, ev) => ev.some(e => e.type === 'release' && e.input === 'output'), waitHint: 'Send an action potential and watch the terminal',
          status: (c) => runner.state.done ? '<b>Observed:</b> Ca²⁺ entered, vesicles fused, transmitter crossed the cleft and the next neuron produced an EPSP (pink trace).' : `Vm (terminal) = ${fmtV(sim.term.V)} mV`,
        },
        {
          view: 'neuron', viewOpts: { caption: 'The loop closes: our output is the next neuron\'s input.' }, record: 'soma', extra: ['terminal', 'next'], electrode: true, labels: true, remount: true,
          title: 'The loop closes',
          text: `<p>Look at the right edge: the next neuron has just received an EPSP, exactly like the one input A gave us at the start.</p>
                 <p><b>receive → integrate → decide → propagate → transmit → the next neuron receives.</b></p>`,
          actions: [{ label: 'Fire A', cls: 'na', run: () => sim.fireInput('A') }, { label: 'Fire B', cls: 'na', run: () => sim.fireInput('B') }, { label: 'Fire C', cls: 'cl', run: () => sim.fireInput('C') }],
          enter: (c) => { c.view().onInput = (id) => sim.fireInput(id); },
          question: { prompt: 'What will the next neuron do with this EPSP?', options: [
            { t: 'Add it to all its other inputs and fire only if the sum at its hillock crosses threshold', ok: true, fb: 'Every neuron in the brain is running this same computation, billions of times a second. You now have the causal model. Head to the Lab to break it: block Na⁺ channels, raise extracellular K⁺, switch off the pump, and predict what happens before you look.' },
            { t: 'Fire an action potential immediately', fb: 'One EPSP is a few millivolts. Remember how many it took to fire our neuron.' },
            { t: 'Pass the transmitter along its axon', fb: 'Transmitter never enters the receiving cell. It opens channels; what travels on is a change in voltage.' },
          ] },
          continueLabel: 'Open the Lab →', continueTo: () => enterLab(),
        },
      ],
    },
  ];

  // =========================================================================
  // Start
  // =========================================================================
  gotoStep(0, 0);
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
