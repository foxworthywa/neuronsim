<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeuronSim — How a neuron signals</title>
<style>
  :root {
    --bg: #f6f5f0;
    --panel: #ffffff;
    --ink: #1f2430;
    --muted: #5f6675;
    --line: #d9d6cc;
    --accent: #2f6fd6;
    --accent-ink: #ffffff;
    --good: #2f9e5b;
    --bad: #d24b3f;
    --warn: #c98a1b;
    --na: #e8772e;
    --k: #8e5cf0;
    --cl: #3cae6c;
    --ca: #2d8fd5;
    --anion: #8f97a6;
    --nt: #d63c8a;
    --membrane: #2a2f3a;
    --outside: #f2f5fb;
    --inside: #fbf3e6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 8px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  header button, .panel button, .actions button, .lab button {
    font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer;
  }
  header button:hover, .panel button:hover, .actions button:hover, .lab button:hover { border-color: #b8b4a6; background: #faf9f5; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary:hover { background: #2a62bd; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  header select { font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
  #progress { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  #progress button {
    width: 26px; height: 26px; padding: 0; border-radius: 50%; font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); background: #fff;
  }
  #progress button.done { background: #e2ecfb; border-color: #b9cdf0; color: #2f4f86; }
  #progress button.current { background: var(--accent); color: #fff; border-color: var(--accent); }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; padding: 10px 16px 14px; }
  #stage-wrap { grid-column: 1; grid-row: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; position: relative; overflow: hidden; min-height: 420px; display: flex; flex-direction: column; }
  #stage-top { display: flex; align-items: center; gap: 10px; padding: 6px 12px 4px; }
  #stage { flex: 1; min-height: 0; width: 100%; display: block; background: var(--bg); }
  #stage svg { width: 100%; height: 100%; display: block; }
  #stage-caption { flex: 1; font-size: 13px; color: var(--muted); }
  #vm-badge { font-size: 13px; font-variant-numeric: tabular-nums; background: #fff; border: 1px solid var(--line); padding: 3px 10px; border-radius: 8px; white-space: nowrap; }
  #vm-badge b { font-size: 16px; }
  #narrator { margin: 4px 10px 10px; font-size: 14px; line-height: 1.35; background: #fbfaf6; border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: 7px 12px; border-radius: 8px; min-height: 44px; color: var(--ink); }
  #narrator:empty { visibility: hidden; }
  #narrator b { font-weight: 650; }
  #narrator .dir { font-weight: 700; letter-spacing: .3px; }
  #paused-badge { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); font-size: 12px; background: #fff3d6; border: 1px solid #ecd9a6; color: #7a5a10; padding: 3px 10px; border-radius: 999px; display: none; }

  #panel { grid-column: 2; grid-row: 1 / span 2; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  #panel h2 { margin: 0; font-size: 16px; }
  #panel .scene-label { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  #panel .text p { margin: 0 0 8px; }
  #panel .text p:last-child { margin-bottom: 0; }
  .question { border: 1px solid #cfdcf3; background: #f3f7fe; border-radius: 10px; padding: 10px 12px; }
  .question .prompt { font-weight: 600; margin-bottom: 8px; }
  .question .options { display: flex; flex-direction: column; gap: 6px; }
  .question .options button { text-align: left; }
  .question .options button.correct { border-color: var(--good); background: #eaf7ee; }
  .question .options button.wrong { border-color: var(--bad); background: #fdeeec; }
  .feedback { margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: 14px; }
  .feedback.good { background: #eaf7ee; border: 1px solid #bfe3ca; }
  .feedback.bad { background: #fdeeec; border: 1px solid #f0c3bd; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .actions button.na { border-color: var(--na); color: #a04d12; }
  .actions button.k { border-color: var(--k); color: #5b39a8; }
  .actions button.cl { border-color: var(--cl); color: #23724a; }
  .actions button.ca { border-color: var(--ca); color: #1c5f92; }
  .actions button.held { background: #fff1e6; }
  .status { font-size: 13px; color: var(--muted); }
  .status.ok { color: var(--good); }
  .nav { margin-top: auto; display: flex; gap: 8px; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid var(--line); }
  .hint { font-size: 13px; color: var(--muted); }
  .ion { display: inline-block; padding: 0 5px; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 600; }
  .ion.na { background: var(--na); } .ion.k { background: var(--k); } .ion.cl { background: var(--cl); } .ion.ca { background: var(--ca); } .ion.nt { background: var(--nt); }
  kbd.part { background: #eef0f4; border: 1px solid #d6dae2; border-radius: 4px; padding: 0 5px; font: inherit; font-size: 13px; }

  #trace-wrap { grid-column: 1; grid-row: 2; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px 6px; }
  #trace-head { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  #trace-head label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  #trace { width: 100%; height: 200px; display: block; }
  #trace.with-g { height: 250px; }
  .legend { display: inline-flex; gap: 10px; align-items: center; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }

  .lab { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .lab .row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .lab .row label { flex: 1; }
  .lab .row input[type=range] { flex: 2; }
  .lab .row .val { width: 62px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .lab h3 { margin: 6px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }

  .loop-diagram { display: flex; flex-direction: column; gap: 4px; align-items: stretch; font-size: 13px; }
  .loop-diagram .node { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: #fafaf7; text-align: center; transition: background .2s, border-color .2s; }
  .loop-diagram .node.hot { background: #fff1e6; border-color: var(--na); font-weight: 600; }
  .loop-diagram .arrow { text-align: center; color: var(--muted); line-height: 1; }

  @media (max-height: 640px) {
    body { height: auto; min-height: 100vh; overflow: auto; }
    main { display: flex; flex-direction: column; }
    #stage-wrap { min-height: 420px; }
  }
  @media (max-width: 980px) {
    body { height: auto; min-height: 100vh; overflow: auto; }
    main { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
    #stage-wrap { grid-column: 1; grid-row: 1; min-height: 340px; }
    #trace-wrap { grid-column: 1; grid-row: 2; }
    #panel { grid-column: 1; grid-row: 3; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>NeuronSim</h1>
    <div class="sub">How a neuron receives, decides, sends</div>
  </div>
  <div id="progress" title="Scenes"></div>
  <div class="spacer"></div>
  <label class="sub">Speed
    <select id="speed" title="How much simulated time passes per second of real time">
      <option value="0.0015">1 s = 1.5 ms (slowest)</option>
      <option value="0.003">1 s = 3 ms</option>
      <option value="0.005">1 s = 5 ms</option>
      <option value="0.01" selected>1 s = 10 ms</option>
      <option value="0.02">1 s = 20 ms</option>
      <option value="0.05">1 s = 50 ms</option>
    </select>
  </label>
  <button id="btn-pause" title="Pause / resume the simulation clock (space)">Pause</button>
  <button id="btn-lab" title="Free-play lab with all controls">Lab</button>
</header>

<main>
  <div id="stage-wrap">
    <div id="stage-top">
      <div id="stage-caption"></div>
      <div id="vm-badge"><span id="vm-label">Vm</span> <b id="vm-value">−70.0</b> mV</div>
    </div>
    <div id="stage"></div>
    <div id="paused-badge">Paused — predict first, then continue</div>
    <div id="narrator" aria-live="polite"></div>
  </div>
  <aside id="panel"></aside>
  <div id="trace-wrap">
    <div id="trace-head">
      <span id="trace-title">Membrane potential recorded inside the soma</span>
      <span class="legend" id="trace-legend"></span>
      <span style="flex:1"></span>
      <label><input type="checkbox" id="show-g"> show Na⁺/K⁺ conductance</label>
      <span id="sim-clock" style="font-variant-numeric: tabular-nums">t = 0.0 ms</span>
    </div>
    <canvas id="trace"></canvas>
  </div>
</main>

<script>
/*
 * NeuronSim engine — a small conductance-based model of one neuron.
 *
 * Everything the student sees (ions moving, channels opening, the voltage
 * trace, vesicles fusing) is rendered from the state held here. Nothing in the
 * UI sets a voltage directly.
 *
 * Units: mV, ms, µS (conductance), nF (capacitance), nA (current), mM (concentration),
 *        µM for cytosolic Ca²⁺ inside a terminal.
 *
 * Works both as a browser global (window.NeuronSim) and as a CommonJS module so
 * the biology tests in tests/ run against exactly the same code as the page.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.NeuronSim = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const R = 8.314;      // J/(mol·K)
  const F = 96485;      // C/mol

  /** Nernst equilibrium potential in mV for an ion of valence z. */
  function nernst(z, outside, inside, tempC) {
    const T = 273.15 + (tempC == null ? 37 : tempC);
    return (1000 * R * T) / (z * F) * Math.log(outside / inside);
  }

  function expEuler(x, xinf, tau, dt) {
    return xinf + (x - xinf) * Math.exp(-dt / tau);
  }

  // x / (1 - exp(-x/y)) with the removable singularity handled.
  function vtrap(x, y) {
    return Math.abs(x / y) < 1e-6 ? y * (1 - x / y / 2) : x / (1 - Math.exp(-x / y));
  }

  // Hodgkin–Huxley gating kinetics, shifted so the resting potential is ≈ −70 mV.
  const HH_SHIFT = 0;
  function hhRates(V) {
    const v = V + HH_SHIFT;
    const am = 0.1 * vtrap(v + 40, 10), bm = 4 * Math.exp(-(v + 65) / 18);
    const ah = 0.07 * Math.exp(-(v + 65) / 20), bh = 1 / (1 + Math.exp(-(v + 35) / 10));
    const an = 0.01 * vtrap(v + 55, 10), bn = 0.125 * Math.exp(-(v + 65) / 80);
    return {
      minf: am / (am + bm), taum: 1 / (am + bm),
      hinf: ah / (ah + bh), tauh: 1 / (ah + bh),
      ninf: an / (an + bn), taun: 1 / (an + bn),
    };
  }

  // ---------------------------------------------------------------------------
  // Default biology (see docs/BIOLOGY.md)
  // ---------------------------------------------------------------------------
  const DEFAULT_CONC = {
    Na: { out: 145, in: 12 },
    K:  { out: 4,   in: 140 },
    Cl: { out: 110, in: 6 },
    Ca: { out: 2,   in: 0.0001 },
  };

  const N_AXON = 12;

  // Areas in µm², channel densities in mS/cm².
  function defaultCompartmentSpecs() {
    const specs = [
      { name: 'dendrite', kind: 'dendrite', area: 2000, gNa: 0,   gK: 0,   gL: 0.1 },
      { name: 'soma',     kind: 'soma',     area: 1250, gNa: 30,  gK: 4,   gL: 0.1 },
      { name: 'hillock',  kind: 'hillock',  area: 250,  gNa: 300, gK: 70, gL: 0.1 },
    ];
    for (let i = 0; i < N_AXON; i++) {
      specs.push({ name: 'axon' + (i + 1), kind: 'axon', index: i, area: 314, gNa: 120, gK: 36, gL: 0.1 });
    }
    specs.push({ name: 'terminal', kind: 'terminal', area: 300, gNa: 120, gK: 36, gL: 0.1, gCa: 20 });
    return specs;
  }

  // Axial conductances (µS) between compartment i and i+1.
  function defaultAxialConductances(n) {
    const g = [];
    for (let i = 0; i < n - 1; i++) {
      if (i === 0) g.push(0.05);        // dendrite–soma (thick)
      else if (i === 1) g.push(0.03);   // soma–hillock
      else if (i === 2) g.push(0.012);  // hillock–axon1
      else g.push(0.008);               // axon–axon (1 µm diameter, 100 µm segments)
    }
    return g;
  }

  // Stereotyped action-potential waveform used to drive *input* terminals
  // (the presynaptic neurons are not simulated in full).
  function templateAP(tSinceSpike) {
    const t = tSinceSpike;
    if (t < 0) return -70;
    if (t < 0.5) return -70 + (40 + 70) * (t / 0.5);            // rise to +40
    if (t < 1.7) return 40 - (40 + 80) * ((t - 0.5) / 1.2);      // fall to −80
    if (t < 5)   return -80 + 10 * ((t - 1.7) / 3.3);            // recover to −70
    return -70;
  }

  // ---------------------------------------------------------------------------
  // Presynaptic terminal: voltage → Ca²⁺ channel → Ca²⁺ → vesicle fusion → transmitter
  // ---------------------------------------------------------------------------
  class Terminal {
    constructor(opts) {
      opts = opts || {};
      this.name = opts.name || 'terminal';
      this.gCa = opts.gCa != null ? opts.gCa : 0.06;   // µS (fully open)
      this.s = 0;               // Ca channel activation (0..1)
      this.ca = 0.1;            // cytosolic Ca²⁺ near the release site (µM)
      this.ca0 = 0.1;
      this.tauCa = 2;           // ms
      this.kCa = 4;             // µM per (nA·ms)
      this.caHalf = 12;         // µM for half-maximal release
      this.kRelease = 0.8;      // /ms (one AP releases roughly half of the docked pool)
      this.vesicles = 1;        // fraction of docked, release-ready vesicles
      this.tauRefill = 5;       // ms (fast restocking so repeated inputs stay similar in size)
      this.nt = 0;              // transmitter in the cleft (arbitrary units)
      this.tauClear = 0.8;      // ms
      this.releaseRate = 0;
      this.iCa = 0;
      this.V = -70;
      this.eCa = 130;
      this.caBlock = 0;         // 0..1 fraction of Ca channels blocked
      this._releasing = false;
    }
    reset() {
      this.s = 0; this.ca = this.ca0; this.vesicles = 1; this.nt = 0;
      this.releaseRate = 0; this.iCa = 0; this.V = -70; this._releasing = false;
    }
    /** Advance by dt at membrane potential V. Returns true when a release burst begins. */
    step(dt, V) {
      this.V = V;
      const sinf = 1 / (1 + Math.exp(-(V + 20) / 6));
      this.s = expEuler(this.s, sinf, 1.0, dt);
      this.iCa = this.gCa * (1 - this.caBlock) * this.s * (V - this.eCa); // nA (negative = inward)
      this.ca += (-this.iCa * this.kCa - (this.ca - this.ca0) / this.tauCa) * dt;
      if (this.ca < 0) this.ca = 0;
      const c4 = Math.pow(this.ca, 4), h4 = Math.pow(this.caHalf, 4);
      this.releaseRate = this.kRelease * (c4 / (c4 + h4)) * this.vesicles;
      const released = this.releaseRate * dt;
      this.vesicles += (-this.releaseRate + (1 - this.vesicles) / this.tauRefill) * dt;
      if (this.vesicles < 0) this.vesicles = 0;
      this.nt += released - (this.nt / this.tauClear) * dt;
      if (this.nt < 0) this.nt = 0;
      const nowReleasing = this.releaseRate > 0.05;
      const started = nowReleasing && !this._releasing;
      this._releasing = nowReleasing;
      return started;
    }
  }

  // ---------------------------------------------------------------------------
  // Postsynaptic receptor: transmitter binding opens a channel with reversal E.
  // ---------------------------------------------------------------------------
  class Receptor {
    constructor(opts) {
      opts = opts || {};
      this.type = opts.type || 'excitatory';
      this.E = opts.E != null ? opts.E : (this.type === 'excitatory' ? 0 : -75);
      this.gmax = opts.gmax != null ? opts.gmax : 0.0025;   // µS
      this.kon = opts.kon != null ? opts.kon : 0.4;         // /(unit·ms) — one release burst opens ~30% of receptors
      this.koff = opts.koff != null ? opts.koff : (this.type === 'excitatory' ? 1 / 18 : 1 / 20);
      this.r = 0;        // fraction of receptor channels open
      this.g = 0;
      this.i = 0;
      this.block = 0;    // 0..1 fraction of receptors blocked (antagonist)
    }
    reset() { this.r = 0; this.g = 0; this.i = 0; }
    step(dt, nt, V) {
      const dr = this.kon * nt * (1 - this.r) - this.koff * this.r;
      this.r += dr * dt;
      if (this.r < 0) this.r = 0; if (this.r > 1) this.r = 1;
      this.g = this.gmax * (1 - this.block) * this.r;
      this.i = this.g * (V - this.E);
    }
  }

  // ---------------------------------------------------------------------------
  // The neuron
  // ---------------------------------------------------------------------------
  class Neuron {
    constructor(opts) {
      opts = opts || {};
      this.tempC = 37;
      this.conc = JSON.parse(JSON.stringify(DEFAULT_CONC));
      this.dt = opts.dt || 0.02;
      this.t = 0;
      this.events = [];
      this.naBlock = 0;   // TTX-like: fraction of voltage-gated Na⁺ channels blocked
      this.kBlock = 0;    // TEA-like: fraction of voltage-gated K⁺ channels blocked
      this.pumpOn = true;
      this.pumpRundownRate = 0; // mM/ms of gradient loss when the pump is off (teaching, accelerated)
      this.manual = { gNa: 0, gK: 0, gCl: 0 };   // µS of manually opened channels on the soma
      this.stim = {};                              // compartment index → nA injected

      const specs = opts.compartments || defaultCompartmentSpecs();
      this.comps = specs.map((s, i) => ({
        index: i, name: s.name, kind: s.kind, area: s.area,
        C: s.area * 1e-5,                     // nF
        gNaMax: (s.gNa || 0) * s.area * 1e-5, // µS
        gKMax: (s.gK || 0) * s.area * 1e-5,
        gL: (s.gL || 0.1) * s.area * 1e-5,
        EL: -70,
        V: -70, m: 0, h: 1, n: 0,
        gNa: 0, gK: 0, iNa: 0, iK: 0, iL: 0, iSynE: 0, iSynI: 0, iAx: 0,
        dVdt: 0,
      }));
      this.gAxial = opts.gAxial || defaultAxialConductances(this.comps.length);
      this.byName = {};
      this.comps.forEach(c => { this.byName[c.name] = c; });

      // Input synapses from other neurons onto this one.
      this.inputs = [];
      const dend = this.byName.dendrite.index, soma = this.byName.soma.index;
      this.addInput({ id: 'A', label: 'Input A', type: 'excitatory', target: dend, gmax: 0.004 });
      this.addInput({ id: 'B', label: 'Input B', type: 'excitatory', target: dend, gmax: 0.004 });
      this.addInput({ id: 'C', label: 'Input C', type: 'inhibitory', target: soma, gmax: 0.012 });

      // This neuron's own output terminal and the next neuron it talks to.
      const term = this.byName.terminal;
      this.terminal = new Terminal({ name: 'output', gCa: (specs[term.index].gCa || 20) * term.area * 1e-5 });
      this.nextReceptor = new Receptor({ type: 'excitatory', gmax: 0.004 });
      this.next = { V: -70, C: 0.02, gL: 0.006, EL: -70, i: 0 };

      this.calibrateLeak();
      this.reset();
    }

    addInput(spec) {
      const inp = {
        id: spec.id, label: spec.label || spec.id, type: spec.type, target: spec.target,
        terminal: new Terminal({ name: spec.id }),
        receptor: new Receptor({ type: spec.type, gmax: spec.gmax }),
        spikeT: null, V: -70, active: false, autoFire: false, autoInterval: 20, lastAuto: -1e9,
      };
      this.inputs.push(inp);
      return inp;
    }

    get E() {
      const c = this.conc;
      return {
        Na: nernst(1, c.Na.out, c.Na.in, this.tempC),
        K: nernst(1, c.K.out, c.K.in, this.tempC),
        Cl: nernst(-1, c.Cl.out, c.Cl.in, this.tempC),
        Ca: nernst(2, c.Ca.out, c.Ca.in, this.tempC),
      };
    }

    /** Choose EL for each compartment so that the resting potential is exactly −70 mV. */
    calibrateLeak() {
      const E = this.E, V = -70;
      const r = hhRates(V);
      for (const c of this.comps) {
        const gNa = c.gNaMax * Math.pow(r.minf, 3) * r.hinf;
        const gK = c.gKMax * Math.pow(r.ninf, 4);
        const iNa = gNa * (V - E.Na), iK = gK * (V - E.K);
        c.EL = V + (iNa + iK) / c.gL;
      }
    }

    reset() {
      this.t = 0;
      this.events = [];
      const r = hhRates(-70);
      for (const c of this.comps) {
        c.V = -70; c.m = r.minf; c.h = r.hinf; c.n = r.ninf;
        c.gNa = 0; c.gK = 0; c.iNa = 0; c.iK = 0; c.iL = 0; c.iSynE = 0; c.iSynI = 0; c.iAx = 0; c.dVdt = 0;
        c._spiking = false;
      }
      for (const inp of this.inputs) {
        inp.terminal.reset(); inp.receptor.reset(); inp.spikeT = null; inp.V = -70; inp.active = false;
        inp.autoFire = false; inp.lastAuto = -1e9;
      }
      this.terminal.reset(); this.nextReceptor.reset();
      this.next.V = -70; this.next.i = 0;
      this.manual = { gNa: 0, gK: 0, gCl: 0 };
      this.stim = {};
      this.naBlock = 0; this.kBlock = 0; this.pumpOn = true;
      this.conc = JSON.parse(JSON.stringify(DEFAULT_CONC));
      this.calibrateLeak();
    }

    /** Make presynaptic input `id` fire one action potential now. */
    fireInput(id) {
      const inp = this.inputs.find(x => x.id === id);
      if (!inp) throw new Error('no input ' + id);
      inp.spikeT = this.t;
      this.events.push({ t: this.t, type: 'input_spike', input: id });
      return inp;
    }

    /** Inject current (nA) into a compartment by name or index. Pass 0 to stop. */
    setStim(comp, nA) {
      const idx = typeof comp === 'number' ? comp : this.byName[comp].index;
      if (nA) this.stim[idx] = nA; else delete this.stim[idx];
    }

    /** Advance the model by `ms` of simulated time. */
    advance(ms) {
      const steps = Math.max(1, Math.round(ms / this.dt));
      const dt = ms / steps;
      for (let s = 0; s < steps; s++) this._step(dt);
    }

    _step(dt) {
      const E = this.E;
      const comps = this.comps;
      const n = comps.length;

      // Pump off → gradients slowly run down (accelerated for teaching).
      if (!this.pumpOn && this.pumpRundownRate > 0) {
        const c = this.conc, k = this.pumpRundownRate * dt;
        if (c.Na.in < 60) c.Na.in += k * 6;
        if (c.K.in > 60) c.K.in -= k * 6;
        if (c.K.out < 30) c.K.out += k * 1.5;
      }

      // --- input synapses (presynaptic terminals driven by template APs)
      for (const inp of this.inputs) {
        if (inp.autoFire && this.t - inp.lastAuto >= inp.autoInterval) {
          inp.lastAuto = this.t; inp.spikeT = this.t;
          this.events.push({ t: this.t, type: 'input_spike', input: inp.id });
        }
        inp.V = inp.spikeT == null ? -70 : templateAP(this.t - inp.spikeT);
        const started = inp.terminal.step(dt, inp.V);
        if (started) this.events.push({ t: this.t, type: 'release', input: inp.id });
        const target = comps[inp.target];
        if (inp.receptor.type === 'inhibitory') inp.receptor.E = E.Cl;
        inp.receptor.step(dt, inp.terminal.nt, target.V);
        inp.active = inp.receptor.r > 0.02;
      }

      // --- membrane compartments (exponential Euler on V, explicit coupling)
      const Vold = comps.map(c => c.V);
      for (let i = 0; i < n; i++) {
        const c = comps[i];
        const V = c.V;
        const r = hhRates(V);
        c.m = expEuler(c.m, r.minf, r.taum, dt);
        c.h = expEuler(c.h, r.hinf, r.tauh, dt);
        c.n = expEuler(c.n, r.ninf, r.taun, dt);
        c.gNa = c.gNaMax * (1 - this.naBlock) * c.m * c.m * c.m * c.h;
        c.gK = c.gKMax * (1 - this.kBlock) * c.n * c.n * c.n * c.n;

        let gsum = c.gNa + c.gK + c.gL;
        let gE = c.gNa * E.Na + c.gK * E.K + c.gL * c.EL;

        // manual channels live on the soma
        if (c.kind === 'soma') {
          gsum += this.manual.gNa + this.manual.gK + this.manual.gCl;
          gE += this.manual.gNa * E.Na + this.manual.gK * E.K + this.manual.gCl * E.Cl;
        }

        // synaptic input
        let iSynE = 0, iSynI = 0;
        for (const inp of this.inputs) {
          if (inp.target !== i) continue;
          const rc = inp.receptor;
          gsum += rc.g; gE += rc.g * rc.E;
          if (rc.type === 'excitatory') iSynE += rc.g * (V - rc.E); else iSynI += rc.g * (V - rc.E);
        }

        // axial coupling to neighbours
        let iAx = 0;
        if (i > 0) { const g = this.gAxial[i - 1]; gsum += g; gE += g * Vold[i - 1]; iAx += g * (Vold[i - 1] - V); }
        if (i < n - 1) { const g = this.gAxial[i]; gsum += g; gE += g * Vold[i + 1]; iAx += g * (Vold[i + 1] - V); }

        const inj = this.stim[i] || 0;
        const Vinf = (gE + inj) / gsum;
        const Vnew = Vinf + (V - Vinf) * Math.exp(-gsum * dt / c.C);

        c.iNa = c.gNa * (V - E.Na) + (c.kind === 'soma' ? this.manual.gNa * (V - E.Na) : 0);
        c.iK = c.gK * (V - E.K) + (c.kind === 'soma' ? this.manual.gK * (V - E.K) : 0);
        c.iL = c.gL * (V - c.EL);
        c.iCl = c.kind === 'soma' ? this.manual.gCl * (V - E.Cl) : 0;
        c.iSynE = iSynE; c.iSynI = iSynI; c.iAx = iAx;
        c.dVdt = (Vnew - V) / dt;
        c.V = Vnew;

        // spike detection (upward crossing of −10 mV)
        if (!c._spiking && Vnew > -10 && V <= -10) {
          c._spiking = true;
          this.events.push({ t: this.t, type: 'spike', comp: i, name: c.name });
        } else if (c._spiking && Vnew < -30) {
          c._spiking = false;
        }
      }

      // --- this neuron's own terminal and the next neuron
      const term = comps[n - 1];
      const started = this.terminal.step(dt, term.V);
      if (started) this.events.push({ t: this.t, type: 'release', input: 'output' });
      this.nextReceptor.step(dt, this.terminal.nt, this.next.V);
      {
        const nx = this.next;
        const gsum = nx.gL + this.nextReceptor.g;
        const gE = nx.gL * nx.EL + this.nextReceptor.g * this.nextReceptor.E;
        const Vinf = gE / gsum;
        nx.i = this.nextReceptor.g * (nx.V - this.nextReceptor.E);
        nx.V = Vinf + (nx.V - Vinf) * Math.exp(-gsum * dt / nx.C);
      }

      this.t += dt;
    }

    /** Drain accumulated events. */
    takeEvents() { const e = this.events; this.events = []; return e; }

    // --- helpers for the renderer / lesson -------------------------------
    naState(c) {
      if (c.h < 0.25) return c.gNaMax > 0 && c.m > 0.3 ? 'inactivated' : 'inactivated';
      if (c.m * c.m * c.m * c.h > 0.08) return 'open';
      return 'closed';
    }
    kState(c) { return c.n * c.n * c.n * c.n > 0.25 ? 'open' : 'closed'; }
    caState(term) { return term.s > 0.3 ? 'open' : 'closed'; }
    get soma() { return this.byName.soma; }
    get hillock() { return this.byName.hillock; }
    get axon() { return this.comps.filter(c => c.kind === 'axon'); }
    get term() { return this.byName.terminal; }
    input(id) { return this.inputs.find(x => x.id === id); }
  }

  return { Neuron, Terminal, Receptor, nernst, hhRates, templateAP, DEFAULT_CONC, N_AXON };
});

<script>
/* NeuronSim app: renderer + lesson engine. The simulation lives in engine.js. */
(function () {
  'use strict';

  // =========================================================================
  // Utilities
  // =========================================================================
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const $ = (sel) => document.querySelector(sel);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);

  function svgEl(tag, attrs, parent) {
    const e = document.createElementNS(SVG_NS, tag);
    if (attrs) for (const k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    }
    if (parent) parent.appendChild(e);
    return e;
  }
  function setAttrs(e, attrs) { for (const k in attrs) e.setAttribute(k, attrs[k]); }
  function htmlEl(tag, attrs, html) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) { if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    if (html != null) e.innerHTML = html;
    return e;
  }

  const ION_COLOR = { Na: '#e8772e', K: '#8e5cf0', Cl: '#3cae6c', Ca: '#2d8fd5', A: '#8f97a6', NT: '#d63c8a' };
  const ION_LABEL = { Na: 'Na⁺', K: 'K⁺', Cl: 'Cl⁻', Ca: 'Ca²⁺', A: 'A⁻', NT: '' };

  // Voltage → colour (blue = hyperpolarized, slate = rest, orange/red = depolarized)
  const V_STOPS = [[-95, [59, 111, 214]], [-70, [125, 138, 165]], [-55, [190, 165, 110]], [-20, [240, 160, 48]], [45, [229, 72, 46]]];
  function vColor(V) {
    V = clamp(V, -95, 45);
    for (let i = 0; i < V_STOPS.length - 1; i++) {
      const [v0, c0] = V_STOPS[i], [v1, c1] = V_STOPS[i + 1];
      if (V <= v1) {
        const t = (V - v0) / (v1 - v0);
        return `rgb(${Math.round(lerp(c0[0], c1[0], t))},${Math.round(lerp(c0[1], c1[1], t))},${Math.round(lerp(c0[2], c1[2], t))})`;
      }
    }
    return 'rgb(229,72,46)';
  }
  function fmtV(V) { return (V < 0 ? '−' : '+') + Math.abs(V).toFixed(1); }
  // Cytosol fill: cream at rest, warms toward orange when depolarized, cools toward blue when hyperpolarized.
  function insideFill(V) {
    const base = [251, 243, 230];
    let target = base, f = 0;
    if (V > -69) { target = [240, 150, 40]; f = clamp((V + 70) / 100, 0, 0.75); }
    else if (V < -71) { target = [120, 160, 230]; f = clamp((-70 - V) / 30, 0, 0.6); }
    return `rgb(${Math.round(lerp(base[0], target[0], f))},${Math.round(lerp(base[1], target[1], f))},${Math.round(lerp(base[2], target[2], f))})`;
  }

  // =========================================================================
  // Shared state
  // =========================================================================
  const sim = new NeuronSim.Neuron();
  const app = {
    speed: 0.01,          // simulated ms per real ms
    paused: false,
    view: null,           // current view object
    viewName: null,
    recordComp: 'soma',   // compartment shown on the trace
    extraTraces: [],      // additional compartments to plot
    showG: false,
    history: [],          // {t, V, V2..., gNa, gK}
    historyWindow: 60,    // ms visible
    electrode: false,
    labels: true,
    time: 0,
    lastFrame: null,
    markers: [],          // {t, label}
    showThreshold: false, // threshold line appears once the concept is introduced (scene 6)
    userSpeed: null,      // speed chosen by the user via the menu; cleared on scene change
    listeners: [],        // event listeners for sim events
  };
  window.__neuronsim = { sim, app, gotoStep: (s, k) => gotoStep(s, k), runner: () => runner, enterLab: () => enterLab(), mountView: (n, o) => mountView(n, o), lesson: () => LESSON };

  function fireEvent(ev) { for (const l of app.listeners) l(ev); }

  // =========================================================================
  // Whole-neuron drawing (used full-size and as an inset)
  // =========================================================================
  const NEURON = {
    soma: { cx: 300, cy: 260, rx: 58, ry: 50 },
    hillock: { x0: 352, x1: 412, y: 260 },
    axon: { x0: 412, x1: 790, y: 260, w: 9 },
    terminal: { x: 790, y: 260 },
    dendrites: [
      'M250,238 C210,215 190,190 165,150 M190,190 C170,185 150,175 130,165 M165,150 C160,130 158,110 150,90',
      'M244,262 C200,262 165,255 110,250 M165,255 C145,240 130,235 100,225 M140,253 C120,268 100,275 70,285',
      'M252,290 C220,315 195,335 160,370 M195,335 C175,335 160,340 130,340 M160,370 C155,390 150,405 140,430',
      'M300,212 C300,180 285,150 275,110 M285,150 C265,140 250,130 225,120',
      'M296,308 C290,345 280,370 265,410 M280,370 C255,380 240,395 215,420',
    ],
    inputs: {
      A: { x: 150, y: 90, label: 'A' },
      B: { x: 100, y: 225, label: 'B' },

  function drawNeuron(parent, opts) {
    opts = opts || {};
    const g = svgEl('g', { class: 'neuron' }, parent);
    const parts = {};
    // dendrites
    parts.dendrite = svgEl('g', { 'data-part': 'dendrites' }, g);
    for (const d of NEURON.dendrites) {
      svgEl('path', { d, fill: 'none', stroke: '#7d8aa5', 'stroke-width': 9, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, parts.dendrite);
    }

    for (const d of NEURON.dendrites) {
      svgEl('path', { d, fill: 'none', stroke: 'transparent', 'stroke-width': 26, 'stroke-linecap': 'round', 'pointer-events': 'stroke' }, parts.dendrite);
    }
    // soma
    parts.soma = svgEl('ellipse', { 'data-part': 'soma', cx: NEURON.soma.cx, cy: NEURON.soma.cy, rx: NEURON.soma.rx, ry: NEURON.soma.ry, fill: '#7d8aa5', stroke: '#2a2f3a', 'stroke-width': 3 }, g);
    parts.nucleus = svgEl('circle', { cx: NEURON.soma.cx - 8, cy: NEURON.soma.cy - 4, r: 16, fill: 'rgba(255,255,255,.35)', stroke: 'rgba(42,47,58,.5)', 'stroke-width': 1.5, 'pointer-events': 'none' }, g);
    // hillock (tapered)
    const h = NEURON.hillock;
    parts.hillock = svgEl('path', { 'data-part': 'hillock', d: `M${h.x0},${h.y - 22} C${h.x0 + 30},${h.y - 12} ${h.x1 - 10},${h.y - 6} ${h.x1},${h.y - 5} L${h.x1},${h.y + 5} C${h.x1 - 10},${h.y + 6} ${h.x0 + 30},${h.y + 12} ${h.x0},${h.y + 22} Z`, fill: '#7d8aa5', stroke: '#2a2f3a', 'stroke-width': 2.5 }, g);
    // hillock channel density dots
    parts.hillockDots = svgEl('g', { 'pointer-events': 'none' }, g);
    for (let i = 0; i < 26; i++) {
      const t = i / 26, x = lerp(h.x0 + 6, h.x1 - 4, t), spread = lerp(16, 4, t);
      svgEl('circle', { cx: x, cy: h.y + (i % 2 ? spread : -spread), r: 1.8, fill: i % 3 === 0 ? ION_COLOR.K : ION_COLOR.Na }, parts.hillockDots);
    }
    // axon segments
    const a = NEURON.axon, n = sim.axon.length;
    parts.axonSegs = [];
    parts.axon = svgEl('g', { 'data-part': 'axon' }, g);
    for (let i = 0; i < n; i++) {
      const x0 = lerp(a.x0, a.x1, i / n), x1 = lerp(a.x0, a.x1, (i + 1) / n);
      parts.axonSegs.push(svgEl('rect', { x: x0, y: a.y - a.w / 2, width: x1 - x0 + 0.8, height: a.w, fill: '#7d8aa5' }, parts.axon));
    }
    svgEl('rect', { x: a.x0, y: a.y - a.w / 2, width: a.x1 - a.x0, height: a.w, fill: 'none', stroke: '#2a2f3a', 'stroke-width': 2 }, parts.axon);
    // terminals
    const t = NEURON.terminal;
    parts.terminal = svgEl('g', { 'data-part': 'terminal' }, g);
    svgEl('path', { d: `M${t.x},${t.y} C${t.x + 25},${t.y} ${t.x + 30},${t.y - 30} ${t.x + 52},${t.y - 34} M${t.x},${t.y} L${t.x + 55},${t.y} M${t.x},${t.y} C${t.x + 25},${t.y} ${t.x + 30},${t.y + 30} ${t.x + 52},${t.y + 34}`, fill: 'none', stroke: '#2a2f3a', 'stroke-width': 6, 'stroke-linecap': 'round' }, parts.terminal);
    parts.boutons = [];
    for (const [bx, by] of [[t.x + 60, t.y - 36], [t.x + 64, t.y], [t.x + 60, t.y + 36]]) {
      parts.boutons.push(svgEl('circle', { cx: bx, cy: by, r: 11, fill: '#7d8aa5', stroke: '#2a2f3a', 'stroke-width': 2.5 }, parts.terminal));
    }
    // next neuron (dendrite stub) to the right
    parts.next = svgEl('g', { 'data-part': 'next' }, g);
    svgEl('path', { d: `M${t.x + 78},${t.y - 40} C${t.x + 90},${t.y - 10} ${t.x + 90},${t.y + 10} ${t.x + 78},${t.y + 40} L${t.x + 110},${t.y + 60} L${t.x + 110},${t.y - 60} Z`, fill: '#e6e2d6', stroke: '#8b8778', 'stroke-width': 2, 'stroke-dasharray': '4 3' }, parts.next);
    parts.nextFill = parts.next.firstChild;
    svgEl('text', { x: t.x + 96, y: t.y + 78, 'font-size': 11, fill: '#6b6b60', 'text-anchor': 'middle', text: 'next' }, parts.next);
    svgEl('text', { x: t.x + 96, y: t.y + 91, 'font-size': 11, fill: '#6b6b60', 'text-anchor': 'middle', text: 'neuron' }, parts.next);
    // presynaptic input boutons
    parts.inputs = {};
    for (const id in NEURON.inputs) {
      const p = NEURON.inputs[id];
      const ig = svgEl('g', { 'data-input': id, class: 'input', cursor: 'pointer' }, g);
      svgEl('line', { x1: p.x - 22, y1: p.y - 22, x2: p.x - 6, y2: p.y - 6, stroke: '#4a4f5a', 'stroke-width': 4, 'stroke-linecap': 'round' }, ig);
      const bouton = svgEl('circle', { cx: p.x, cy: p.y, r: 12, fill: '#7d8aa5', stroke: '#2a2f3a', 'stroke-width': 2.5 }, ig);
      const ring = svgEl('circle', { cx: p.x, cy: p.y, r: 15, fill: 'none', stroke: id === 'C' ? ION_COLOR.Cl : ION_COLOR.Na, 'stroke-width': 2.5, opacity: 0.85 }, ig);
      const label = svgEl('text', { x: p.x, y: p.y + 4, 'font-size': 12, 'font-weight': 700, fill: '#fff', 'text-anchor': 'middle', 'pointer-events': 'none', text: id }, ig);
      parts.inputs[id] = { g: ig, bouton, ring, label };
    }
    // electrode (hidden until scene 4)
    parts.electrode = svgEl('g', { class: 'electrode', opacity: 0, 'pointer-events': 'none' }, g);
    svgEl('path', { d: `M${NEURON.soma.cx + 16},${NEURON.soma.cy - 8} L${NEURON.soma.cx + 60},${NEURON.soma.cy - 150} L${NEURON.soma.cx + 74},${NEURON.soma.cy - 150} L${NEURON.soma.cx + 20},${NEURON.soma.cy - 6} Z`, fill: '#dfe6f2', stroke: '#2a2f3a', 'stroke-width': 1.5 }, parts.electrode);
    svgEl('rect', { x: NEURON.soma.cx + 56, y: NEURON.soma.cy - 175, width: 22, height: 26, fill: '#4a4f5a' }, parts.electrode);
    svgEl('text', { x: NEURON.soma.cx + 90, y: NEURON.soma.cy - 155, 'font-size': 12, fill: '#4a4f5a', text: 'recording electrode' }, parts.electrode);
    // reference electrode
    svgEl('line', { x1: 700, y1: 120, x2: 700, y2: 60, stroke: '#4a4f5a', 'stroke-width': 3 }, parts.electrode);
    svgEl('rect', { x: 690, y: 40, width: 20, height: 22, fill: '#4a4f5a' }, parts.electrode);
    svgEl('text', { x: 716, y: 58, 'font-size': 12, fill: '#4a4f5a', text: 'reference (outside)' }, parts.electrode);

    // labels
    parts.labels = svgEl('g', { class: 'labels', 'pointer-events': 'none', 'font-size': 13, fill: '#3a3f4a' }, g);
    const L = [
      ['Dendrites', 120, 130], ['Cell body (soma)', 300, 345], ['Axon hillock', 382, 300], ['Axon', 600, 240], ['Synaptic terminals', 815, 198],
    ];
    parts.labelEls = {};
    for (const [txt, x, y] of L) parts.labelEls[txt] = svgEl('text', { x, y, 'text-anchor': 'middle', text: txt }, parts.labels);

    return { g, parts };
  }

  function updateNeuronColors(parts, opts) {
    opts = opts || {};
    const dend = vColor(sim.byName.dendrite.V);
    for (const s of parts.dendriteStrokes) s.setAttribute('stroke', dend);
    parts.soma.setAttribute('fill', vColor(sim.soma.V));
    parts.hillock.setAttribute('fill', vColor(sim.hillock.V));
    sim.axon.forEach((c, i) => parts.axonSegs[i].setAttribute('fill', vColor(c.V)));
    const tc = vColor(sim.term.V);
    for (const b of parts.boutons) b.setAttribute('fill', tc);
    parts.nextFill.setAttribute('fill', sim.next.V > -69 ? vColor(sim.next.V) : '#e6e2d6');
    for (const id in parts.inputs) {
      const inp = sim.input(id), pi = parts.inputs[id];
      pi.bouton.setAttribute('fill', vColor(inp.V));
      pi.ring.setAttribute('stroke-width', inp.active ? 4.5 : 2.5);
      pi.ring.setAttribute('opacity', inp.active ? 1 : 0.85);
    }
    if (app.electrode && !parts._electrodeShown) {
      parts._electrodeShown = true;
      parts.electrode.setAttribute('opacity', 1);
      if (!opts.hideLabels) parts.electrode.animate([{ transform: 'translate(40px,-260px)', opacity: 0 }, { transform: 'translate(0,0)', opacity: 1 }], { duration: 1400, easing: 'cubic-bezier(.2,.7,.2,1)' });
    } else if (!app.electrode && parts._electrodeShown) { parts._electrodeShown = false; parts.electrode.setAttribute('opacity', 0); }
    else if (!app.electrode) parts.electrode.setAttribute('opacity', 0);
    parts.labels.setAttribute('opacity', app.labels && !opts.hideLabels ? 1 : 0);
  }

  // =========================================================================
  // Views
  // =========================================================================
  const stage = $('#stage');
  const views = {};

  function mountView(name, opts) {
    if (app.view && app.view.unmount) app.view.unmount();
    stage.innerHTML = '';
    app.viewName = name;
    app.view = views[name](opts || {});
    app.view.name = name;
    if (app.view.mount) app.view.mount(stage);
    return app.view;
  }

  // ---------------------------------------------------------------- zoom intro
  views.zoom = function () {
    let svg, slides = [], idx = 0, stageEl;
    const captions = [
      'A person. Everything they sense, decide and do runs on cells that signal electrically.',
      'Inside the head, the brain.',
      'The brain is a dense network of neurons — roughly 86 billion of them, each connected to thousands of others.',
      'Zooming in: individual neurons, each one receiving signals from many neighbours and sending signals onward.',
      'One neuron. We will follow a single signal through it: how it is received, integrated, fired, sent down the axon and passed on.',
    ];
    function build() {

  // ---------------------------------------------------------------- whole neuron
  views.neuron = function (opts) {
    let svg, d, halo, onPart = null, onInput = null, ntDots = null;
    return {
      mount(el) {
        svg = svgEl('svg', { viewBox: '0 0 930 520' });

        }
        for (const id in d.parts.inputs) {

        }
        $('#stage-caption').textContent = opts.caption || '';
      },
      update() {
        updateNeuronColors(d.parts, opts);
        // transmitter puffs at our own terminal when it releases
        ntDots.innerHTML = '';
        const rel = sim.terminal.nt;
        if (rel > 0.02) {
          const n = Math.min(14, Math.round(rel * 40));
          for (let i = 0; i < n; i++) svgEl('circle', { cx: NEURON.terminal.x + 72 + rand(-6, 10), cy: NEURON.terminal.y + rand(-45, 45), r: 3, fill: ION_COLOR.NT, opacity: clamp(rel * 3, 0.2, 1) }, ntDots);
        }
      },
      set onPart(fn) { onPart = fn; }, set onInput(fn) { onInput = fn; },
      highlight(part) {
        const pos = { dendrites: [165, 230, 130, 150], soma: [300, 260, 80, 70], hillock: [382, 260, 42, 36], axon: [600, 260, 200, 30], terminal: [850, 260, 60, 60], none: [0, 0, 0, 0] }[part] || [0, 0, 0, 0];
        setAttrs(halo, { cx: pos[0], cy: pos[1], rx: pos[2], ry: pos[3], opacity: part && part !== 'none' ? 1 : 0 });
      },
      flashPart(part, color) {
        const el2 = { dendrites: d.parts.dendrite, soma: d.parts.soma, hillock: d.parts.hillock, axon: d.parts.axon, terminal: d.parts.terminal }[part];
        if (!el2) return;
        el2.animate([{ opacity: 1 }, { opacity: 0.3 }, { opacity: 1 }], { duration: 400 });
      },
      parts: () => d.parts,
      narrate() {
        const h = sim.hillock, so = sim.soma;
        const active = sim.inputs.filter(i => i.active);
        const lead = sim.axon.find(c => c.V > -20 && c.dVdt > 0);
        if (sim.terminal.nt > 0.03) return `<b>Terminal:</b> ${chip('Ca')} entered → transmitter released → the next neuron's receptors open → it gets an EPSP (its dendrite warms up on the right).`;
        if (sim.term.V > -20) return `The action potential has reached the <b>terminal</b>; its voltage-gated Ca²⁺ channels are opening.`;
        if (lead) return `<b>Action potential travelling down the axon</b> (segment ${sim.axon.indexOf(lead) + 1} of ${sim.axon.length}): each segment's Na⁺ channels open as the one before it depolarizes it.`;
        if (h.V > -56 && h.dVdt > 20) return `<b>Threshold reached at the axon hillock</b> → its voltage-gated Na⁺ channels open → action potential!`;
        if (h.V > -30) return `The hillock is firing: Na⁺ in (up), then Na⁺ channels inactivate and K⁺ channels open (down).`;
        if (so.V < -72 && sim.kState(h) === 'open') return `After-hyperpolarization: K⁺ channels are still open, so Vm dips below rest before recovering.`;
        if (active.length) {
          const exc = active.filter(i => i.type === 'excitatory').map(i => i.id), inh = active.filter(i => i.type === 'inhibitory').map(i => i.id);
          const parts = [];
          if (exc.length) parts.push(`EPSP from ${exc.join(' + ')} pushing Vm up`);
          if (inh.length) parts.push(`IPSP from ${inh.join(' + ')} holding Vm near rest`);
          return `<b>Integrating:</b> ${parts.join('; ')}. Soma Vm = ${fmtV(so.V)} mV${app.showThreshold ? ' (threshold ≈ −55)' : ''}. Only the sum at the hillock matters.`;
        }
        if (so.V > -68) return `The EPSPs are fading: transmitter is cleared, receptor channels close, and K⁺ leak pulls Vm back to −70.`;
        return `<b>At rest:</b> −70 mV everywhere. Inputs A and B are excitatory (orange), C is inhibitory (green). Click a bouton to make it fire.`;
      },
    };
  };

  // Ion pools (background) and flux particles.
  function makeIonPool(parent, region, counts, opts) {
    opts = opts || {};
    const ions = [];
    for (const ion in counts) {
      for (let i = 0; i < counts[ion]; i++) {
        const x = rand(region.x0 + 10, region.x1 - 10), y = rand(region.y0 + 10, region.y1 - 10);
        const g = svgEl('g', { transform: `translate(${x},${y})` }, parent);
        svgEl('circle', { r: opts.r || 8, fill: ION_COLOR[ion], opacity: 0.9 }, g);
        svgEl('text', { y: 3, 'font-size': (opts.r || 8) * 1.05, 'text-anchor': 'middle', fill: '#fff', 'font-weight': 700, text: ION_LABEL[ion] }, g);
        ions.push({ g, ion, x, y, vx: 0, vy: 0 });
      }
    }
    return {
      ions,
      update(dtReal) {
        const k = dtReal / 16;
        for (const p of ions) {
          p.vx = p.vx * 0.9 + rand(-0.6, 0.6); p.vy = p.vy * 0.9 + rand(-0.6, 0.6);
          p.x = clamp(p.x + p.vx * k, region.x0 + 8, region.x1 - 8); p.y = clamp(p.y + p.vy * k, region.y0 + 8, region.y1 - 8);
          p.g.setAttribute('transform', `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
        }
      },
    };
  }

  function makeParticles(parent) {
    const list = [];
    return {
      spawn(ion, x0, y0, x1, y1, duration, opts) {
        opts = opts || {};
        const g = svgEl('g', { transform: `translate(${x0},${y0})`, 'pointer-events': 'none' }, parent);
        svgEl('circle', { r: opts.r || 8, fill: ION_COLOR[ion], stroke: '#fff', 'stroke-width': 1.5 }, g);
        if (ION_LABEL[ion]) svgEl('text', { y: 3, 'font-size': 8.5, 'text-anchor': 'middle', fill: '#fff', 'font-weight': 700, text: ION_LABEL[ion] }, g);
        list.push({ g, x0, y0, x1, y1, t: 0, duration: duration || 700, linger: opts.linger != null ? opts.linger : 500, wobble: opts.wobble || 0 });
      },
      update(dtReal) {
        for (let i = list.length - 1; i >= 0; i--) {
          const p = list[i]; p.t += dtReal;
          const u = clamp(p.t / p.duration, 0, 1), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
          const x = lerp(p.x0, p.x1, e) + (p.wobble ? Math.sin(p.t / 60) * p.wobble * (1 - u) : 0), y = lerp(p.y0, p.y1, e);
          p.g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
          if (p.t > p.duration) {
            const f = 1 - (p.t - p.duration) / p.linger;
            p.g.setAttribute('opacity', clamp(f, 0, 1));
            if (f <= 0) { p.g.remove(); list.splice(i, 1); }
          }
        }
      },
      clear() { for (const p of list) p.g.remove(); list.length = 0; },
      get count() { return list.length; },
    };
  }

  // A flux accumulator: turns current (nA) × simulated time into discrete particles.
  function fluxCounter(scale) {
    let acc = 0;
    return (current_nA, dtSim) => {
      acc += Math.abs(current_nA) * dtSim * scale;
      let n = 0;
      while (acc >= 1 && n < 6) { acc -= 1; n++; }
      if (acc > 6) acc = 6;
      return n;
    };
  }

  function drawBilayer(parent, x0, x1, yTop, yBot, holes) {
    // two rows of phospholipid heads with tails; `holes` = list of [xa, xb] to leave empty

    svgEl('rect', { x: x0, y: yTop, width: x1 - x0, height: yBot - yTop, fill: '#f0ead8' }, g);
    const step = 14;
    for (let x = x0 + 7; x < x1; x += step) {
      if (holes.some(([a, b]) => x > a && x < b)) continue;
      for (const [cy, dir] of [[yTop + 7, 1], [yBot - 7, -1]]) {
        svgEl('circle', { cx: x, cy, r: 6, fill: '#c9b98f', stroke: '#8a7a50', 'stroke-width': 1 }, g);

    return g;
  }

  const chip = (k) => `<span class="ion ${k.toLowerCase()}">${ION_LABEL[k]}</span>`;
  const IN = '<span class="dir">IN</span>', OUT = '<span class="dir">OUT</span>';

  // Voltage ladder: where Vm is, and who is pulling it (Na⁺ up toward E_Na, K⁺ down toward E_K).
  function drawLadder(parent, x, y) {
    const g = svgEl('g', { transform: `translate(${x},${y})`, 'font-size': 11, fill: '#3a3f4a' }, parent);
    const H = 170, yOf = (V) => H - (clamp(V, -100, 70) + 100) * (H / 170);
    svgEl('text', { x: 0, y: -10, 'font-weight': 700, 'font-size': 12, text: 'Where is Vm being pulled?' }, g);
    svgEl('rect', { x: 0, y: 0, width: 14, height: H, rx: 4, fill: '#e9e6dc', stroke: '#c9c4b4' }, g);
    const ticks = [];
    const tick = (V, label, color, key) => {
      const t = svgEl('g', { 'data-tick': key || '' }, g);
      svgEl('line', { x1: -4, y1: yOf(V), x2: 18, y2: yOf(V), stroke: color, 'stroke-width': 1.5 }, t);
      svgEl('text', { x: 24, y: yOf(V) + 4, fill: color, text: label }, t);
      ticks.push({ V, t, key });
      return t;
    };
    tick(67, 'E_Na +67  (Na⁺ pulls up)', ION_COLOR.Na, 'ena');
    tick(0, '0 mV', '#6b7280', 'zero');
    const thr = tick(-55, 'threshold −55', '#d97706', 'thr');
    tick(-70, 'rest −70', '#2563eb', 'rest');
    tick(-95, 'E_K −95  (K⁺ pulls down)', ION_COLOR.K, 'ek');
    const naArrow = svgEl('path', { d: '', stroke: ION_COLOR.Na, 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round' }, g);
    const naHead = svgEl('path', { d: '', fill: ION_COLOR.Na }, g);
    const kArrow = svgEl('path', { d: '', stroke: ION_COLOR.K, 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round' }, g);
    const kHead = svgEl('path', { d: '', fill: ION_COLOR.K }, g);
    const pointer = svgEl('path', { d: '', fill: '#1f2430' }, g);
    const pline = svgEl('line', { x1: 0, y1: 0, x2: 14, y2: 0, stroke: '#1f2430', 'stroke-width': 3 }, g);
    const ptext = svgEl('text', { x: -8, y: 0, 'text-anchor': 'end', 'font-weight': 700, 'font-size': 12, fill: '#1f2430', text: '' }, g);
    return {
      update(V, gNaPull, gKPull) {
        const y = yOf(V);
        pline.setAttribute('y1', y); pline.setAttribute('y2', y);
        pointer.setAttribute('d', `M-8,${y} l-7,-5 l0,10 z`);
        ptext.setAttribute('y', y + 4); ptext.textContent = fmtV(V);
        const na = Math.min(y - 8, gNaPull * 90), k = Math.min(H - y - 8, gKPull * 90);
        naArrow.setAttribute('d', na > 3 ? `M7,${y - 2} L7,${y - na}` : '');
        naHead.setAttribute('d', na > 3 ? `M7,${y - na - 7} l-6,8 l12,0 z` : '');
        kArrow.setAttribute('d', k > 3 ? `M7,${y + 2} L7,${y + k}` : '');
        kHead.setAttribute('d', k > 3 ? `M7,${y + k + 7} l-6,-8 l12,0 z` : '');
        thr.setAttribute('opacity', app.showThreshold ? 1 : 0);
      },
    };
  }

  // Compact concentration / Nernst table.
  function drawConcTable(parent, x, y) {
    const lg = svgEl('g', { transform: `translate(${x},${y})`, 'font-size': 11, fill: '#3a3f4a' }, parent);
    svgEl('text', { x: 0, y: 0, 'font-weight': 700, 'font-size': 12, text: 'Concentrations (mM)' }, lg);
    svgEl('text', { x: 62, y: 18, 'font-weight': 700, text: 'out' }, lg); svgEl('text', { x: 106, y: 18, 'font-weight': 700, text: 'in' }, lg); svgEl('text', { x: 152, y: 18, 'font-weight': 700, text: 'E (mV)' }, lg);
    const rows = [['Na', 'Na⁺'], ['K', 'K⁺'], ['Cl', 'Cl⁻'], ['Ca', 'Ca²⁺']].map(([k, lab], i) => {
      const yy = 36 + i * 17;
      svgEl('circle', { cx: 7, cy: yy - 4, r: 6, fill: ION_COLOR[k] }, lg);
      svgEl('text', { x: 18, y: yy, text: lab }, lg);
      return { k, out: svgEl('text', { x: 62, y: yy }, lg), inn: svgEl('text', { x: 106, y: yy }, lg), e: svgEl('text', { x: 152, y: yy }, lg) };
    });
    svgEl('text', { x: 0, y: 112, 'font-size': 10, fill: '#6b7280', text: 'E = the voltage at which that ion stops moving' }, lg);
    svgEl('text', { x: 0, y: 125, 'font-size': 10, fill: '#6b7280', text: '(its equilibrium potential). Drawings not to scale.' }, lg);
    return {
      update() {
        const E = sim.E;
        for (const r of rows) {
          const c = sim.conc[r.k];
          r.out.textContent = c.out < 1 ? String(c.out) : c.out.toFixed(0);
          r.inn.textContent = c.in < 1 ? String(c.in) : c.in.toFixed(0);
          r.e.textContent = fmtV(E[r.k]).replace('.0', '');
        }
      },
    };
  }

  // ---------------------------------------------------------------- membrane strip
  // opts: { comp: 'soma', channels: ['K_leak', ...], inset: 'soma', ions: {outside:{}, inside:{}}, caption }
  views.membrane = function (opts) {
    const X0 = 20, X1 = 600, Y_TOP = 232, Y_BOT = 288;
    let svg, chans = [], pool, particles, chargePlus, chargeMinus, chargeFlipPlus, chargeFlipMinus, insideRect, insetParts, electrodeTip, pumpPhase = 0, ladder, table;
    const counters = [], typeCount = {};
    const comp = () => sim.byName[opts.comp || 'soma'];
    const channelTypes = opts.channels || ['K_leak', 'Na_leak', 'pump'];
    channelTypes.forEach(t => { typeCount[t] = (typeCount[t] || 0) + 1; });
    function layout() {
      const n = channelTypes.length, spanX0 = X0 + 70, spanX1 = X1 - 60;
      return channelTypes.map((t, i) => n === 1 ? (spanX0 + spanX1) / 2 : lerp(spanX0, spanX1, i / (n - 1)));
    }
    // current through one drawn channel of a given type (nA; negative = inward)
    function channelCurrent(t, c, V, E) {
      const share = 1 / typeCount[t];
      if (t === 'K_leak') return 0.75 * c.gL * (V - E.K) * share;
      if (t === 'Na_leak') return 0.06 * c.gL * (V - E.Na) * share;
      if (t === 'Na_v') return c.gNa * (V - E.Na) * share;
      if (t === 'K_v') return c.gK * (V - E.K) * share;
      if (t === 'Na_manual') return sim.manual.gNa * (V - E.Na);
      if (t === 'K_manual') return sim.manual.gK * (V - E.K);
      if (t === 'Cl_manual') return sim.manual.gCl * (V - E.Cl);
      if (t === 'Ca_v') return sim.terminal.iCa;
      return 0;
    }
    function channelState(t, c) {
      if (t === 'K_leak' || t === 'Na_leak') return 'open';
      if (t === 'Na_v') return sim.naState(c);
      if (t === 'K_v') return sim.kState(c);
      if (t === 'Na_manual') return sim.manual.gNa > 0 ? 'open' : 'closed';
      if (t === 'K_manual') return sim.manual.gK > 0 ? 'open' : 'closed';
      if (t === 'Cl_manual') return sim.manual.gCl > 0 ? 'open' : 'closed';
      if (t === 'Ca_v') return sim.caState(sim.terminal);
      return 'closed';
    }
    return {
      mount(el) {
        svg = svgEl('svg', { viewBox: '0 0 900 520' });
        el.appendChild(svg);
        svgEl('rect', { x: 0, y: 0, width: 900, height: 520, fill: '#f6f5f0' }, svg);
        svgEl('rect', { x: X0, y: 20, width: X1 - X0, height: Y_TOP - 20, fill: '#eef2fa', rx: 10 }, svg);
        insideRect = svgEl('rect', { x: X0, y: Y_BOT, width: X1 - X0, height: 500 - Y_BOT, fill: '#fbf3e6', rx: 10 }, svg);
        svgEl('text', { x: X0 + 10, y: 40, 'font-size': 13, fill: '#4a5468', 'font-weight': 600, text: 'OUTSIDE the cell' }, svg);
        svgEl('text', { x: X0 + 10, y: 492, 'font-size': 13, fill: '#6b5a3a', 'font-weight': 600, text: 'INSIDE the cell' }, svg);
        const xs = layout();
        drawBilayer(svg, X0, X1, Y_TOP, Y_BOT, xs.map(x => [x - 28, x + 28]));
        const chLayer = svgEl('g', {}, svg);
        const dense = channelTypes.length > 5;
        chans = channelTypes.map((t, i) => {
          const ch = drawChannel(chLayer, xs[i], Y_TOP, Y_BOT, t);
          const label = dense ? CH[t].label.replace('voltage-gated ', 'V-gated ').replace(' (yours)', '') : CH[t].label;
          svgEl('text', { x: xs[i], y: Y_BOT + 22 + (dense && i % 2 ? 14 : 0), 'font-size': dense ? 10 : 11, 'text-anchor': 'middle', fill: '#4a4f5a', text: label }, chLayer);
          counters.push(fluxCounter(t.endsWith('leak') ? 9 : (t === 'pump' ? 0 : 2.2)));
          return ch;
        });
        chargePlus = drawChargeRow(svg, X0, X1, Y_TOP - 12, '+', '#b45309');
        chargeMinus = drawChargeRow(svg, X0, X1, Y_BOT + 46, '−', '#1d4ed8');
        chargeFlipPlus = drawChargeRow(svg, X0, X1, Y_BOT + 46, '+', '#b45309');
        chargeFlipMinus = drawChargeRow(svg, X0, X1, Y_TOP - 12, '−', '#1d4ed8');
        const ionLayer = svgEl('g', {}, svg);
        const ions = opts.ions || {};
        const out = Object.assign({ Na: 22, K: 3, Cl: 14, Ca: 6 }, ions.outside || {});
        const inn = Object.assign({ K: 22, Na: 3, Cl: 2, A: 14 }, ions.inside || {});
        pool = { outside: makeIonPool(ionLayer, { x0: X0, x1: X1, y0: 50, y1: Y_TOP - 22 }, out), inside: makeIonPool(ionLayer, { x0: X0, x1: X1, y0: Y_BOT + 56, y1: 480 }, inn) };
        particles = makeParticles(svgEl('g', {}, svg));
        electrodeTip = svgEl('g', { opacity: 0 }, svg);
        svgEl('path', { d: `M${X1 - 26},${Y_BOT + 100} L${X1 - 50},24 L${X1 - 38},24 L${X1 - 18},${Y_BOT + 98} Z`, fill: '#dfe6f2', stroke: '#2a2f3a', 'stroke-width': 1.5 }, electrodeTip);
        svgEl('text', { x: X1 - 54, y: 16, 'font-size': 12, fill: '#4a4f5a', 'text-anchor': 'end', text: 'recording electrode' }, electrodeTip);
        insetParts = drawInset(svg, opts.inset || opts.comp || 'soma').parts;
        ladder = drawLadder(svg, 668, 182);
        table = drawConcTable(svg, 640, 388);
        $('#stage-caption').textContent = opts.caption || '';
      },
      update(dtReal, dtSim) {
        const c = comp(), V = c.V, E = sim.E;
        insideRect.setAttribute('fill', insideFill(V));
        const neg = clamp(-V / 70, 0, 1), pos = clamp(V / 35, 0, 1);
        chargePlus.setAttribute('opacity', neg); chargeMinus.setAttribute('opacity', neg);
        chargeFlipPlus.setAttribute('opacity', pos); chargeFlipMinus.setAttribute('opacity', pos);
        chans.forEach((ch, i) => {
          const t = channelTypes[i];
          if (t === 'pump') {
            if (sim.pumpOn && !app.paused) {
              pumpPhase += dtReal / 1400;
              if (pumpPhase >= 1) {
                pumpPhase = 0;
                for (let k = 0; k < 3; k++) particles.spawn('Na', ch.x + rand(-8, 8), Y_BOT + 40 + k * 10, ch.x + rand(-40, 40), Y_TOP - 40 - k * 8, 1100, { linger: 300 });
                for (let k = 0; k < 2; k++) particles.spawn('K', ch.x + rand(-8, 8), Y_TOP - 40 - k * 10, ch.x + rand(-40, 40), Y_BOT + 40 + k * 8, 1100, { linger: 300 });
              }
            }
            return;
          }
          const state = channelState(t, c);
          setChannelState(ch, state);
          if (state === 'open' && !app.paused) {
            const I = channelCurrent(t, c, V, E);
            const n = Math.min(3, counters[i](I, dtSim));
            for (let k = 0; k < n; k++) {
              const ion = ch.spec.ion, jitter = rand(-6, 6), dur = rand(650, 1000);
              if (I < 0) particles.spawn(ion, ch.x + jitter, Y_TOP - 30 - rand(0, 40), ch.x + rand(-80, 80), Y_BOT + 50 + rand(0, 60), dur);
              else particles.spawn(ion, ch.x + jitter, Y_BOT + 30 + rand(0, 40), ch.x + rand(-80, 80), Y_TOP - 50 - rand(0, 60), dur);
            }
          }
        });
        if (!app.paused) { pool.outside.update(dtReal); pool.inside.update(dtReal); }
        particles.update(dtReal);
        // ladder: pulls are conductance shares
        const gNaTot = c.gNa + (c.kind === 'soma' ? sim.manual.gNa : 0) + 0.06 * c.gL;
        const gKTot = c.gK + (c.kind === 'soma' ? sim.manual.gK : 0) + 0.75 * c.gL;
        const gAll = gNaTot + gKTot + 0.19 * c.gL + (c.kind === 'soma' ? sim.manual.gCl : 0) + 1e-9;
        ladder.update(V, gNaTot / gAll, gKTot / gAll);
        table.update();
        electrodeTip.setAttribute('opacity', app.electrode ? 1 : 0);
        updateNeuronColors(insetParts, { hideLabels: true });
      },
      narrate() {
        const c = comp(), V = c.V, d = c.dVdt, na = sim.naState(c), k = sim.kState(c);
        const hasNaV = channelTypes.includes('Na_v');
        if (sim.manual.gNa > 0) return `You opened ${chip('Na')} channels → Na⁺ flows ${IN} (high outside, and the negative inside attracts it) → the inside gains positive charge → <b>Vm rises</b> toward E_Na.`;
        if (sim.manual.gK > 0) return `You opened extra ${chip('K')} channels → K⁺ flows ${OUT} (high inside) → the inside loses positive charge → <b>Vm falls</b> toward E_K.`;
        if (sim.manual.gCl > 0) return `You opened ${chip('Cl')} channels → Cl⁻ flows ${IN} → Vm is pulled toward E_Cl and <b>held near rest</b>.`;
        if (hasNaV && na === 'open' && d > 5 && V < 30) return `Voltage-gated ${chip('Na')} channels <b>OPEN</b> → Na⁺ rushes ${IN} → Vm shoots up toward E_Na (+67). Each bit of depolarization opens more Na⁺ channels.`;
        if (hasNaV && V > 0) return `<b>At the peak (${fmtV(V)} mV):</b> ${chip('Na')} channels are <b>inactivating</b> (plugs swing in) and the slower ${chip('K')} channels are opening. Na⁺ entry stops; K⁺ exit begins. Vm never reaches E_Na.`;
        if (hasNaV && (na === 'inactivated' || k === 'open') && d < -5) return `${chip('Na')} channels <b>INACTIVATED</b> (plugged, no more Na⁺ can enter). ${chip('K')} channels <b>OPEN</b> → K⁺ flows ${OUT} → Vm falls toward E_K (−95).`;
        if (hasNaV && k === 'open' && V < -72) return `<b>Undershoot:</b> ${chip('K')} channels are still open, so Vm sits below rest, close to E_K. ${chip('Na')} channels are recovering from inactivation.`;
        if (hasNaV && na === 'inactivated' && V > -60) return `${chip('Na')} channels are inactivated; ${chip('K')} channels are opening. Na⁺ entry has stopped, K⁺ exit begins.`;
        if (d > 1 && V > -68) return `Positive charge is entering (from the rest of the cell) → <b>depolarizing</b>: Vm = ${fmtV(V)} mV.`;
        if (d < -1 && V < -66) return `Positive charge is leaving → <b>repolarizing</b> toward rest.`;
        if (V < -72) return `Below rest: more ${chip('K')} is leaving than usual; Vm will drift back to −70 as K⁺ channels close.`;
        return `<b>At rest (≈ −70 mV):</b> ${chip('K')} trickles ${OUT} through leak channels (that is what makes the inside negative); a little ${chip('Na')} leaks ${IN}; the pump quietly restores the gradients.`;
      },
      channels: () => chans,
    };
  };

  // ---------------------------------------------------------------- synapse (pre terminal + cleft + post membrane)
  // opts: { input: 'A' | 'C' | 'output', caption }
  views.synapse = function (opts) {
    const PRE_X0 = 300, PRE_X1 = 600, PRE_Y = 178;       // presynaptic membrane bottom edge
    const POST_Y_TOP = 300, POST_Y_BOT = 356;              // postsynaptic bilayer
    const CLEFT_Y0 = PRE_Y + 14, CLEFT_Y1 = POST_Y_TOP;
    let svg, preFill, postFill, caChans = [], recChans = [], vesicleLayer, docked = [], particles, ntParticles, pool, caCounter, recCounter, insetParts, apArrow, stageRows = [];
    const isOutput = opts.input === 'output';
    const inp = () => isOutput ? null : sim.input(opts.input);
    const preTerm = () => isOutput ? sim.terminal : inp().terminal;
    const preV = () => isOutput ? sim.term.V : inp().V;
    const receptor = () => isOutput ? sim.nextReceptor : inp().receptor;
    const postV = () => isOutput ? sim.next.V : sim.comps[inp().target].V;
    const recType = () => receptor().type === 'excitatory' ? 'AMPA' : 'GABA';
    const nt = [];
    const STAGES = [
      { key: 'ap', label: 'action potential arrives', test: () => preV() > -35 },
      { key: 'ca_open', label: 'voltage-gated Ca²⁺ channels open', test: () => preTerm().s > 0.3 },
      { key: 'ca_in', label: 'Ca²⁺ flows in (down a huge gradient)', test: () => preTerm().iCa < -0.4 },
      { key: 'fuse', label: 'Ca²⁺ makes vesicles fuse and empty', test: () => preTerm().releaseRate > 0.05 },
      { key: 'nt', label: 'transmitter crosses the cleft', test: () => preTerm().nt > 0.02 },
      { key: 'bind', label: 'transmitter binds → receptors open', test: () => receptor().r > 0.06 },
      { key: 'ion', label: '', test: () => Math.abs(receptor().i) > 0.02 },
    ];
    const done = STAGES.map(() => false);
    let quietFor = 0;
    return {
      mount(el) {
        svg = svgEl('svg', { viewBox: '0 0 900 520' });
        el.appendChild(svg);
        svgEl('rect', { x: 0, y: 0, width: 900, height: 520, fill: '#f6f5f0' }, svg);
        svgEl('rect', { x: 20, y: 20, width: 600, height: 480, fill: '#eef2fa', rx: 10 }, svg);
        // presynaptic terminal bulb
        preFill = svgEl('path', { d: `M${PRE_X0},20 L${PRE_X1},20 C${PRE_X1},110 ${PRE_X1 - 40},${PRE_Y} ${(PRE_X0 + PRE_X1) / 2},${PRE_Y} C${PRE_X0 + 40},${PRE_Y} ${PRE_X0},110 ${PRE_X0},20 Z`, fill: '#fbf3e6', stroke: '#8a7a50', 'stroke-width': 12 }, svg);
        svgEl('text', { x: (PRE_X0 + PRE_X1) / 2, y: 66, 'font-size': 13, 'font-weight': 600, 'text-anchor': 'middle', fill: '#6b5a3a', text: isOutput ? 'OUR synaptic terminal (presynaptic)' : `Presynaptic terminal of input ${opts.input}` }, svg);
        // arriving action potential indicator (the axon enters from above)
        apArrow = svgEl('g', { opacity: 0 }, svg);
        svgEl('path', { d: `M${(PRE_X0 + PRE_X1) / 2 - 140},24 l0,14 l-8,0 l12,12 l12,-12 l-8,0 l0,-14 z`, fill: '#e5482e' }, apArrow);
        svgEl('text', { x: (PRE_X0 + PRE_X1) / 2 - 118, y: 42, 'font-size': 12, 'font-weight': 700, fill: '#e5482e', text: 'action potential arriving' }, apArrow);
        const chLayer = svgEl('g', {}, svg);
        caChans = [380, 520].map(x => drawChannel(chLayer, x, PRE_Y - 34, PRE_Y + 8, 'Ca_v', 0.9));
        svgEl('text', { x: 450, y: PRE_Y + 30, 'font-size': 11, 'text-anchor': 'middle', fill: '#1c5f92', text: 'voltage-gated Ca²⁺ channels' }, chLayer);
        vesicleLayer = svgEl('g', {}, svg);
        svgEl('text', { x: 30, y: CLEFT_Y1 - 18, 'font-size': 12, fill: '#4a5468', 'font-weight': 600, text: 'synaptic cleft (outside)' }, svg);
        postFill = svgEl('rect', { x: 20, y: POST_Y_BOT, width: 600, height: 500 - POST_Y_BOT, fill: '#fbf3e6', rx: 10 }, svg);
        drawBilayer(svg, 20, 620, POST_Y_TOP, POST_Y_BOT, [[372, 428], [472, 528]]);
        recChans = [400, 500].map(x => drawChannel(chLayer, x, POST_Y_TOP, POST_Y_BOT, recType()));
        svgEl('text', { x: 450, y: POST_Y_BOT + 22, 'font-size': 11, 'text-anchor': 'middle', fill: '#4a4f5a', text: CH[recType()].label }, chLayer);
        svgEl('text', { x: 30, y: 492, 'font-size': 13, 'font-weight': 600, fill: '#6b5a3a', text: isOutput ? 'INSIDE the next neuron (postsynaptic)' : `INSIDE our neuron (postsynaptic ${sim.comps[inp().target].name})` }, svg);
        const ionLayer = svgEl('g', {}, svg);
        pool = {
          cleft: makeIonPool(ionLayer, { x0: 30, x1: 610, y0: CLEFT_Y0 - 4, y1: CLEFT_Y1 - 4 }, recType() === 'GABA' ? { Na: 8, Ca: 8, Cl: 12 } : { Na: 16, Ca: 8, Cl: 4 }, { r: 7 }),
          outsidePre: makeIonPool(ionLayer, { x0: 30, x1: 290, y0: 60, y1: PRE_Y - 30 }, { Na: 8, Ca: 4, Cl: 5 }, { r: 7 }),
          insidePre: makeIonPool(ionLayer, { x0: PRE_X0 + 30, x1: PRE_X1 - 30, y0: 60, y1: 110 }, { K: 8, A: 4 }, { r: 7 }),
          insidePost: makeIonPool(ionLayer, { x0: 30, x1: 610, y0: POST_Y_BOT + 40, y1: 480 }, { K: 16, A: 10, Na: 2 }, { r: 7 }),
        };
        particles = makeParticles(svgEl('g', {}, svg));
        ntParticles = svgEl('g', {}, svg);
        caCounter = fluxCounter(1.2); recCounter = fluxCounter(3);
        // causal checklist
        const cl = svgEl('g', { transform: 'translate(640,170)', 'font-size': 11.5, fill: '#3a3f4a' }, svg);
        svgEl('text', { x: 0, y: 0, 'font-weight': 700, 'font-size': 12, text: 'What has to happen, in order' }, cl);
        STAGES.forEach((st, i) => {
          const y = 22 + i * 21;
          const dot = svgEl('circle', { cx: 7, cy: y - 4, r: 6, fill: '#fff', stroke: '#c9c4b4', 'stroke-width': 1.5 }, cl);
          const tick = svgEl('path', { d: `M3,${y - 4} l3,3 l6,-6`, stroke: '#fff', 'stroke-width': 2, fill: 'none', opacity: 0 }, cl);
          const txt = svgEl('text', { x: 20, y, text: st.label }, cl);
          stageRows.push({ dot, tick, txt });
        });
        const lg = svgEl('g', { transform: 'translate(640,350)', 'font-size': 11, fill: '#3a3f4a' }, svg);
        [['NT', 'neurotransmitter'], ['Ca', 'Ca²⁺ (2 mM out · 0.0001 mM in)'], ['Na', 'Na⁺'], ['K', 'K⁺'], ['Cl', 'Cl⁻']].forEach(([k, lab], i) => {
          const y = 14 + i * 18;
          svgEl('circle', { cx: 7, cy: y - 4, r: 6, fill: ION_COLOR[k] }, lg);
          svgEl('text', { x: 20, y, text: lab }, lg);
        });
        insetParts = drawInset(svg, isOutput ? 'terminal' : 'synapse').parts;
        $('#stage-caption').textContent = opts.caption || '';
        this._buildVesicles();
      },
      _buildVesicles() {
        vesicleLayer.innerHTML = ''; docked = [];
        const reserve = [[362, 112], [420, 100], [480, 102], [538, 114], [400, 134], [500, 136]];
        for (const [x, y] of reserve) {
          const g = svgEl('g', { transform: `translate(${x},${y})` }, vesicleLayer);

        }
        for (const x of [420, 450, 480, 360, 540]) {
          const g = svgEl('g', { transform: `translate(${x},${PRE_Y - 22})` }, vesicleLayer);
          svgEl('circle', { r: 12, fill: '#fff', stroke: '#8a7a50', 'stroke-width': 2 }, g);
          for (let i = 0; i < 4; i++) svgEl('circle', { cx: rand(-5, 5), cy: rand(-5, 5), r: 2.2, fill: ION_COLOR.NT }, g);
          docked.push({ g, x, used: false });
        }
        svgEl('text', { x: 450, y: 82, 'font-size': 11, 'text-anchor': 'middle', fill: '#6b5a3a', text: 'vesicles filled with neurotransmitter' }, vesicleLayer);
      },
      _release() {
        const v = docked.find(d => !d.used);
        if (v) {
          v.used = true;
          v.g.animate([{ transform: `translate(${v.x}px, ${PRE_Y - 22}px) scale(1)` }, { transform: `translate(${v.x}px, ${PRE_Y - 6}px) scale(1.2, 0.5)`, opacity: 0.2 }], { duration: 500, fill: 'forwards' });
          setTimeout(() => { v.g.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, fill: 'forwards' }); v.used = false; }, 2500 / Math.max(app.speed * 100, 0.15));
        }
        const x = v ? v.x : 450;
        for (let i = 0; i < 10; i++) {
          const g = svgEl('circle', { cx: x, cy: PRE_Y + 8, r: 4, fill: ION_COLOR.NT }, ntParticles);
          nt.push({ g, x: x + rand(-4, 4), y: PRE_Y + 8, vx: rand(-1.5, 1.5), vy: rand(0.5, 1.5), t: 0 });
        }
      },
      update(dtReal, dtSim, events) {
        const term = preTerm(), rec = receptor(), Vp = preV(), Vq = postV();
        preFill.setAttribute('fill', insideFill(Vp));
        postFill.setAttribute('fill', insideFill(Vq));
        apArrow.setAttribute('opacity', clamp((Vp + 60) / 60, 0, 1));
        for (const ch of caChans) setChannelState(ch, sim.caState(term));
        for (const ch of recChans) setChannelState(ch, rec.r > 0.06 ? 'open' : 'closed');
        for (const e of events) if (e.type === 'release' && ((isOutput && e.input === 'output') || (!isOutput && e.input === opts.input))) this._release();
        // checklist state
        const quiet = Vp < -65 && term.s < 0.1 && term.nt < 0.01 && rec.r < 0.03;
        quietFor = quiet ? quietFor + dtReal : 0;
        if (STAGES[0].test() && quietFor === 0 && done.slice(1).every(Boolean) === false && done[0] && done[5]) { /* an event still in progress */ }
        if (STAGES[0].test() && this._wasQuiet) { for (let i = 0; i < done.length; i++) done[i] = false; }
        this._wasQuiet = quiet && quietFor > 400;
        STAGES.forEach((st, i) => {
          const active = st.test();
          if (active) done[i] = true;
          const r = stageRows[i];
          const color = active ? '#2f6fd6' : (done[i] ? '#2f9e5b' : '#c9c4b4');
          r.dot.setAttribute('fill', active ? '#2f6fd6' : (done[i] ? '#2f9e5b' : '#fff'));
          r.dot.setAttribute('stroke', color);
          r.tick.setAttribute('opacity', done[i] && !active ? 1 : 0);
          r.txt.setAttribute('font-weight', active ? 700 : 400);
          r.txt.setAttribute('fill', active ? '#1f2430' : (done[i] ? '#2f9e5b' : '#6b7280'));
        });
        stageRows[6].txt.textContent = rec.type === 'excitatory' ? 'Na⁺ flows in → EPSP (Vm rises a few mV)' : 'Cl⁻ flows in → IPSP (Vm held near rest)';
        if (!app.paused) {
          if (term.s > 0.3) {
            const n = Math.min(3, caCounter(term.iCa, dtSim));
            for (let i = 0; i < n; i++) { const ch = caChans[i % 2]; particles.spawn('Ca', ch.x + rand(-6, 6), PRE_Y + 30 + rand(0, 20), ch.x + rand(-40, 40), PRE_Y - 60 - rand(0, 40), rand(650, 900), { r: 7 }); }
          }
          if (rec.r > 0.06) {
            const n = Math.min(3, recCounter(rec.i, dtSim)), ion = rec.type === 'excitatory' ? 'Na' : 'Cl';
            for (let i = 0; i < n; i++) { const ch = recChans[i % 2]; particles.spawn(ion, ch.x + rand(-6, 6), POST_Y_TOP - 30 - rand(0, 40), ch.x + rand(-60, 60), POST_Y_BOT + 50 + rand(0, 60), rand(700, 1000), { r: 7 }); }
          }
          const k = dtReal / 16;
          for (let i = nt.length - 1; i >= 0; i--) {
            const p = nt[i]; p.t += dtReal;
            p.vx += rand(-0.4, 0.4); p.vy += rand(-0.3, 0.4); p.vx *= 0.92; p.vy *= 0.92;
            p.x = clamp(p.x + p.vx * k, 30, 610); p.y += p.vy * k;
            if (p.y > POST_Y_TOP - 12) {
              const near = recChans.find(ch => Math.abs(ch.x - p.x) < 26);
              if (near) { p.g.remove(); nt.splice(i, 1); continue; }
              p.y = POST_Y_TOP - 12; p.vy = -Math.abs(p.vy);
            }
            if (p.y < CLEFT_Y0) { p.y = CLEFT_Y0; p.vy = Math.abs(p.vy); }
            p.g.setAttribute('cx', p.x.toFixed(1)); p.g.setAttribute('cy', p.y.toFixed(1));
            const life = 2600 / Math.max(app.speed * 100, 0.15);
            if (p.t > life) { p.g.setAttribute('opacity', clamp(1 - (p.t - life) / 600, 0, 1)); if (p.t > life + 600) { p.g.remove(); nt.splice(i, 1); } }
          }
          for (const key in pool) pool[key].update(dtReal);
        }
        particles.update(dtReal);
        updateNeuronColors(insetParts, { hideLabels: true });
      },
      narrate() {
        const term = preTerm(), rec = receptor(), Vp = preV();
        const who = isOutput ? 'the next neuron' : 'our neuron';
        if (Math.abs(rec.i) > 0.02 && rec.r > 0.06) return rec.type === 'excitatory'
          ? `Receptor channels open → ${chip('Na')} flows ${IN} to ${who} → <b>EPSP</b>: Vm rises a few millivolts, then fades as the transmitter is cleared.`
          : `Receptor channels open → ${chip('Cl')} flows ${IN} → <b>IPSP</b>: Vm is pulled toward E_Cl and held near rest, so excitation has a harder time reaching threshold.`;
        if (term.nt > 0.02) return `${chip('NT')} <b>Neurotransmitter</b> crosses the cleft and binds receptor channels on the other side.`;
        if (term.releaseRate > 0.05) return `Cytosolic Ca²⁺ is high → <b>vesicles fuse</b> with the membrane and dump transmitter into the cleft.`;
        if (term.s > 0.3) return `Depolarization opened voltage-gated ${chip('Ca')} channels → Ca²⁺ flows ${IN} (2 mM outside vs 0.0001 mM inside).`;
        if (Vp > -35) return `<b>Action potential arrives</b>: the terminal membrane depolarizes to about +40 mV.`;
        if (rec.r > 0.03) return `Receptors are closing as transmitter unbinds and is cleared; Vm drifts back to rest.`;
        return isOutput ? `Quiet. When an action potential reaches this terminal, the chain on the right will run.` : `Quiet synapse. Fire input ${opts.input} to send an action potential into this terminal.`;
      },
    };
  };

  // ---------------------------------------------------------------- axon (propagation)
  views.axon = function (opts) {
    const X0 = 40, X1 = 860, Y_TOP = 200, Y_BOT = 300;
    let svg, segs = [], naChans = [], kChans = [], particles, counters = [], profile, arrows, insetParts;
    const comps = () => [sim.hillock].concat(sim.axon).concat([sim.term]);
    return {
      mount(el) {

          svgEl('text', { x: (x0 + x1) / 2, y: Y_BOT + 28, 'font-size': 10, 'text-anchor': 'middle', fill: '#6b7280', text: cs[i].kind === 'hillock' ? 'hillock' : cs[i].kind === 'terminal' ? 'terminal' : (i) }, svg);
          counters.push(fluxCounter(2.5));
        }
        svgEl('text', { x: X0 + 10, y: Y_BOT - 16, 'font-size': 13, fill: '#6b5a3a', 'font-weight': 600, text: 'INSIDE the axon' }, svg);
        svgEl('rect', { x: X0, y: Y_TOP, width: X1 - X0, height: 8, fill: '#c9b98f', stroke: '#8a7a50', 'stroke-width': 1.5 }, svg);
        svgEl('rect', { x: X0, y: Y_BOT - 8, width: X1 - X0, height: 8, fill: '#c9b98f', stroke: '#8a7a50', 'stroke-width': 1.5 }, svg);
        const chLayer = svgEl('g', {}, svg);

          kChans.push(drawChannel(chLayer, xc + w * 0.22, Y_TOP - 10, Y_TOP + 18, 'K_v', 0.55));
        }
        arrows = svgEl('g', {}, svg);
        particles = makeParticles(svgEl('g', {}, svg));
        const lg = svgEl('g', { transform: 'translate(150,84)', 'font-size': 12, fill: '#3a3f4a' }, svg);
        const mk = (x, y, type, state, label) => { const gg = svgEl('g', { transform: `translate(${x},${y})` }, lg); const c = drawChannel(gg, 0, 0, 26, type, 0.55); setChannelState(c, state); svgEl('text', { x: 16, y: 17, text: label }, gg); };
        mk(0, 0, 'Na_v', 'closed', 'Na⁺ closed'); mk(100, 0, 'Na_v', 'open', 'Na⁺ open'); mk(190, 0, 'Na_v', 'inactivated', 'Na⁺ inactivated (refractory)');
        mk(0, 38, 'K_v', 'closed', 'K⁺ closed'); mk(100, 38, 'K_v', 'open', 'K⁺ open');
        const pg = svgEl('g', {}, svg);
        svgEl('text', { x: X0, y: 368, 'font-size': 12, fill: '#4a4f5a', 'font-weight': 600, text: 'Membrane potential along the axon (snapshot)' }, pg);
        svgEl('line', { x1: X0, y1: 490, x2: X1, y2: 490, stroke: '#9ca3af' }, pg);
        svgEl('line', { x1: X0, y1: 420, x2: X1, y2: 420, stroke: '#d1d5db', 'stroke-dasharray': '4 4' }, pg);
        svgEl('text', { x: X0 - 4, y: 494, 'font-size': 10, 'text-anchor': 'end', fill: '#6b7280', text: '−70' }, pg);
        svgEl('text', { x: X0 - 4, y: 424, 'font-size': 10, 'text-anchor': 'end', fill: '#6b7280', text: '0' }, pg);
        svgEl('text', { x: X0 - 4, y: 384, 'font-size': 10, 'text-anchor': 'end', fill: '#6b7280', text: '+40' }, pg);

      update(dtReal, dtSim) {

          const c = cs[i];

          setChannelState(kChans[i], sim.kState(c));
          if (!app.paused) {
            if (naChans[i].state === 'open') { const m = Math.min(2, counters[i](c.gNa * (c.V - E.Na), dtSim)); for (let j = 0; j < m; j++) particles.spawn('Na', naChans[i].x + rand(-5, 5), Y_TOP - 40 - rand(0, 40), naChans[i].x + rand(-25, 25), Y_TOP + 40 + rand(0, 40), rand(500, 750), { r: 6 }); }
            if (kChans[i].state === 'open') { const m = Math.min(2, counters[i](c.gK * (c.V - E.K) * 0.6, dtSim)); for (let j = 0; j < m; j++) particles.spawn('K', kChans[i].x + rand(-5, 5), Y_TOP + 40 + rand(0, 30), kChans[i].x + rand(-25, 25), Y_TOP - 50 - rand(0, 40), rand(500, 750), { r: 6 }); }
