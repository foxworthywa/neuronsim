    }

    // =======================================================================
    // Free-play lab (generic shell; config.lab(kit) renders the controls)
    // =======================================================================
    function enterLab() {
      runner.labMode = true;
      runner.state = { done: true, answered: true };
      renderProgress();
      sim.reset(); app.history = []; app.markers = [];
      app.showThreshold = true; app.userSpeed = null;
      app.gComp = null; app.bands = []; app.historyMs = 400; app.historyWindow = 60;
      applyTraceLayout();
      config.lab(kit);
      $('#trace-title').textContent = traceTitle(app.recordComp, app.extraTraces);
    }
    // "← Back to lesson" navigation row for the lab panel.
    function labNav() {
      const nav = htmlEl('div', { class: 'nav' });
      const back = htmlEl('button', {}, '← Back to lesson'); back.addEventListener('click', () => gotoStep(runner.scene, runner.step));
      nav.appendChild(back);
      return nav;
    }

    // =======================================================================
    // Lesson helpers exposed through the kit
    // =======================================================================
    // A brief current pulse into the stimulated compartment (model.pulse stops it by itself).
    const stimPulse = (nA, ms) => sim.pulse(profile.stimComp, nA == null ? profile.stimPulse.nA : nA, ms == null ? profile.stimPulse.ms : ms);
    // Samples recorded since this step began (or since the last re-arm).
    const since = (c) => { const d = c.stepState().data; if (d.t0 == null) d.t0 = sim.t; return app.history.filter(s => s.t >= d.t0); };
    const refire = { label: 'Fire again', cls: 'na', run: (c) => { setPaused(false); stimPulse(); c.stepState().data.armed = true; c.stepState().data.t0 = sim.t; } };
    function loopHighlight(c) {
      const h = sim.byName[profile.apComp];
      const set = (k, on) => { const e = panel.querySelector(`[data-loop="${k}"]`); if (e) e.classList.toggle('hot', !!on); };
      set('depol', h.dVdt > 5 && h.V < 0);
      set('open', sim.naState(h) === 'open');
      set('in', h.iNa < -0.5);
      set('more', h.dVdt > 50 && h.V < 20);
    }

    const kit = {
      // state
      sim, app, runner, profile, panel, stage, views, config,
      get lesson() { return LESSON; },
      // control
      setPaused, setSpeed, mountView, gotoStep, enterLab, renderProgress, setCaption, labNav,
      stimPulse, refire, since, spikeIn, anySpike, I, FB_GRADIENT, fmtV, fmtE, chip, IN, OUT, LOOP_HTML, loopHighlight, questionOrder,
      // drawing
      svgEl, setAttrs, htmlEl, $, clamp, lerp, rand, ION_COLOR, ION_LABEL, CH, vColor, insideFill,
      drawChannel, setChannelState, makeIonPool, makeParticles, fluxCounter, drawBilayer, drawChargeRow,
      drawInset, drawLadder, drawConcTable, drawCell,
    };

    // The running commentary under the stage. At the faster speeds several things happen inside a
    // second, and the text used to flick past faster than anyone could read it. Lines are now
    // queued and each is held long enough to read, so a burst is read as a short slideshow while
    // the traces and the animation carry on live. A line whose only change is its live numbers is
    // not a new line: it is updated in place, so the reading time is spent on real beats.
    const NARRATE_HOLD = 1300, NARRATE_QUEUE_MAX = 4;
    const narrateKey = (html) => String(html).replace(/[-+−]?[\d.,]+/g, '#').replace(/\s+/g, ' ');
    function pumpNarration(html, dtReal) {
      const el = $('#narrator');
      app.narrateHeld += dtReal;
      if (html != null) {
        const key = narrateKey(html);
        if (key === app.narrateShownKey) {
          if (html !== app._lastNarration) { app._lastNarration = html; el.innerHTML = html; }
        } else if (key !== app.narrateQueuedKey) {
          app.narrateQueuedKey = key;
          app.narrateQueue.push(html);
          while (app.narrateQueue.length > NARRATE_QUEUE_MAX) app.narrateQueue.shift();
        } else if (app.narrateQueue.length) {
          app.narrateQueue[app.narrateQueue.length - 1] = html;   // same beat, freshest wording
        }
      }
      if (!app.narrateQueue.length) { el.classList.remove('more'); return; }
      if (app.narrateShownKey != null && app.narrateHeld < NARRATE_HOLD) { el.classList.add('more'); return; }
      const next = app.narrateQueue.shift();
      app._lastNarration = next; app.narrateShownKey = narrateKey(next); app.narrateHeld = 0;
      el.innerHTML = next;
      el.classList.toggle('more', app.narrateQueue.length > 0);
      el.classList.remove('fresh'); void el.offsetWidth; el.classList.add('fresh');
    }

    // =======================================================================
    // Main loop
    // =======================================================================
    // A throw anywhere in the frame used to skip requestAnimationFrame, which stopped the clock,
    // the trace and every control until the page was reloaded. Each callback is now isolated: a
    // broken one is reported once and skipped, and the frame is always scheduled again.
    const reportedErrors = new Set();
    function guard(label, fn) {
      try { return fn(); } catch (err) {
        const key = label + ':' + (err && err.message);
        if (!reportedErrors.has(key)) { reportedErrors.add(key); console.error(`[SimApp] ${label} failed (skipping it from now on this frame):`, err); }
        app.lastError = { label, message: String(err && err.message || err) };
        return undefined;
      }
    }
    function frameBody(ts) {
      if (app.lastFrame == null) app.lastFrame = ts;
      const dtReal = Math.min(50, ts - app.lastFrame); app.lastFrame = ts;
      let dtSim = 0;
      if (!app.paused) {
        dtSim = dtReal * app.speed;
        let remaining = dtSim;
        while (remaining > 1e-9) { const h = Math.min(0.1, remaining); sim.advance(h); remaining -= h; recordSample(); }
      }
      const events = sim.takeEvents();
      if (app.view && app.view.update) guard('view.update', () => app.view.update(dtReal, dtSim, events));
      if (!runner.labMode) {
        const step = currentStep();
        if (step.tick) guard('step.tick', () => step.tick(ctx, events, dtSim));
        if (step.waitFor && !runner.state.done && guard('step.waitFor', () => step.waitFor(ctx, events))) { runner.state.done = true; if (step.onDone) guard('step.onDone', () => step.onDone(ctx)); refreshNav(); }
        if (step.status && typeof step.status === 'function') { const s = panel.querySelector('.status'); if (s) { const html = guard('step.status', () => step.status(ctx)); if (html != null && s.innerHTML !== html) s.innerHTML = html; } }
      }
      for (const e of events) fireEvent(e);
      if (app.view && app.view.narrate) pumpNarration(guard('view.narrate', () => app.view.narrate()), dtReal);
      else if (app._lastNarration !== '') { app._lastNarration = ''; app.narrateQueue.length = 0; app.narrateShownKey = null; app.narrateQueuedKey = null; $('#narrator').innerHTML = ''; }
      drawTrace();
      const rc = sim.byName[app.recordComp];
      const V = rc ? rc.V : (profile.probeV ? profile.probeV(sim, app.recordComp) : undefined);
      $('#vm-value').textContent = fmtV(V == null ? REST : V);
      $('#vm-label').textContent = 'Vm (' + app.recordComp + ')';
      $('#sim-clock').textContent = `t = ${sim.t.toFixed(1)} ms`;
    }
    function frame(ts) {
      guard('frame', () => frameBody(ts));
      requestAnimationFrame(frame);
    }

    // =======================================================================
    // Wiring
    // =======================================================================
    $('#speed').addEventListener('change', (e) => { app.speed = parseFloat(e.target.value); app.userSpeed = app.speed; });
    $('#btn-pause').addEventListener('click', () => setPaused(!app.paused));
    $('#btn-lab').addEventListener('click', enterLab);
    $('#show-g').addEventListener('change', (e) => { app.showG = e.target.checked; applyTraceLayout(); });
    document.addEventListener('keydown', (e) => { if (e.code === 'Space' && !(e.target instanceof HTMLInputElement) && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); setPaused(!app.paused); } });
    $('#vm-value').textContent = fmtV(REST);
    $('#vm-label').textContent = 'Vm (' + profile.comp + ')';
    $('#trace-title').textContent = traceTitle(profile.comp);

    // =======================================================================
    // Page content, then start
    // =======================================================================
    if (config.views) Object.assign(views, config.views(kit));
    LESSON = config.lesson(kit);
    const handle = { sim, app, profile, kit, gotoStep: (s, k) => gotoStep(s, k), runner: () => runner, enterLab: () => enterLab(), mountView: (n, o) => mountView(n, o), lesson: () => LESSON };
    window.__simapp = handle;
    gotoStep(0, 0);
    requestAnimationFrame(frame);
    return handle;
  }

  window.SimApp = { init, helpers: { svgEl, setAttrs, htmlEl, $, clamp, lerp, rand, fmtV, fmtE, ION_COLOR, ION_LABEL, CH } };
})();

</script>
<script>
/*
 * SharedScenes: lesson scenes that every excitable cell re-stages (see docs/APP_API.md).
 *
 *   SharedScenes.restingMembrane(profile, kit, opts)    → scene object
 *   SharedScenes.recordingElectrode(profile, kit, opts) → scene object
 *   SharedScenes.actionPotential(profile, kit, opts)    → scene object
 *
 * Each builder returns a scene ({ id, title, speed, steps: [...] }) exactly as a lesson array
 * holds it. Only what differs between cells is parametrized: numbers come from the profile
 * (rest, threshold, the recorded compartment, the manual conductances, the stimulus pulse)
 * and from the model's equilibrium potentials; words come from profile.cellWord and
 * profile.regionWord; `opts` can append steps, replace steps and override any string by key.
 * Called with the neuron profile and no opts, the scenes are the neuron lesson's originals.
 *
 * opts: {
 *   extraSteps:   [step, ...]        appended after the built-in steps
 *   replaceSteps: { index: step }    replaces the built-in step at that index (0-based)
 *   copy:         { key: string }    overrides a string; keys are '<step>.title', '<step>.text',
 *                                    '<step>.prompt', '<step>.opt<i>', '<step>.fb<i>',
 *                                    '<step>.status', '<step>.statusDone', '<step>.caption',
 *                                    '<step>.waitHint' (step keys are listed in each builder)
 *   channelsForRest: [...]           channel types drawn in the first resting-membrane step
 *   insetRegion:  'name'             inset highlight region (default: the recorded compartment)
 * }
 * Classic script (no modules) so the pages open from file://.
 */
(function () {
  'use strict';

  function finish(steps, opts) {
    opts = opts || {};
    if (opts.replaceSteps) for (const i in opts.replaceSteps) steps[i] = opts.replaceSteps[i];
    if (opts.extraSteps) steps.push(...opts.extraSteps);
    return steps;
  }
  const copyOf = (opts) => { const copy = (opts && opts.copy) || {}; return (k, d) => (copy[k] != null ? copy[k] : d); };

  // ------------------------------------------------------------- resting membrane
  // step keys: solutions, pump, kLeak, naOpen, naObserve, kObserve
  function restingMembrane(profile, kit, opts) {
    const { sim, runner, I, FB_GRADIENT, fmtV, fmtE } = kit;
    const c = copyOf(opts);
    const REST = profile.rest, E = sim.E, comp = () => sim.byName[profile.comp];
    const region = (opts && opts.insetRegion) || profile.comp;
    const channels = (opts && opts.channelsForRest) || ['K_leak', 'Na_leak', 'pump'];
    const G = profile.manualG;
    const steps = [
      {
        view: 'membrane', viewOpts: { comp: profile.comp, inset: region, channels, caption: c('solutions.caption', `Zooming into the membrane of the ${profile.regionWord}.`) }, reset: true, record: profile.comp, electrode: false,
        enter: () => { sim.naBlock = 1; }, // voltage-gated Na⁺ channels are not part of the story yet
        title: c('solutions.title', 'Two very different solutions'),
        text: c('solutions.text', `<p>The membrane separates two solutions. <b>Outside</b>: lots of ${I('Na')}, ${I('Cl')} and ${I('Ca')}. <b>Inside</b>: lots of ${I('K')} and large negatively charged molecules (proteins, shown as A⁻) that cannot leave.</p>
                 <p>The inside is about <b>${Math.abs(REST)} mV more negative</b> than the outside: the resting membrane potential, Vm ≈ ${fmtE(REST)} mV. Notice the + and − charges lined up along the membrane.</p>`),
        question: { prompt: c('solutions.prompt', 'At rest, which ion is much more concentrated inside the cell than outside?'), options: [
          { t: c('solutions.opt0', 'K⁺ (potassium)'), ok: true, fb: c('solutions.fb0', 'K⁺ is about 140 mM inside and only 4 mM outside. Everything else in the list is higher outside.') },
          { t: c('solutions.opt1', 'Na⁺ (sodium)'), fb: c('solutions.fb1', 'Na⁺ is about 145 mM outside and only 12 mM inside — the other way round.') },
          { t: c('solutions.opt2', 'Ca²⁺ (calcium)'), fb: c('solutions.fb2', 'Free Ca²⁺ inside is astonishingly low (about 0.0001 mM) versus 2 mM outside: a 20,000-fold gradient.') },
          { t: c('solutions.opt3', 'Cl⁻ (chloride)'), fb: c('solutions.fb3', 'Cl⁻ is higher outside (about 110 mM) than inside (about 6 mM).') },
        ] },
      },
      {
        view: 'membrane', title: c('pump.title', 'Who does what: pump vs. permeability'),
        text: c('pump.text', `<p>The ${'Na⁺/K⁺ pump'} uses ATP to move 3 ${I('Na')} out and 2 ${I('K')} in on each cycle. Watch it work.</p>
                 <p>Two jobs are easy to mix up:</p>
                 <p>• The <b>pump maintains the concentration gradients</b>, working slowly in the background.<br>
                    • The <b>resting potential is set mainly by which ions the membrane lets through</b>. At rest the membrane is far more permeable to K⁺ (through K⁺ leak channels) than to anything else.</p>`),
        question: { prompt: c('pump.prompt', 'Which statement is correct?'), options: [
          { t: c('pump.opt0', `The pump maintains the gradients; the ${fmtE(REST)} mV comes mainly from the membrane being selectively permeable to K⁺.`), ok: true, fb: c('pump.fb0', 'If you switched the pump off, Vm would barely change for a while, because the gradients are still there. (You can try this in the Lab.)') },
          { t: c('pump.opt1', `The pump directly generates the ${fmtE(REST)} mV every moment; without it the voltage would vanish instantly.`), fb: c('pump.fb1', 'The pump does contribute a little charge separation (3 out, 2 in), but the gradients it built are what matter. Vm would fade only slowly as the gradients ran down.') },
          { t: c('pump.opt2', 'Na⁺ leaking in is what makes the inside negative.'), fb: c('pump.fb2', 'Na⁺ carries positive charge in, which makes the inside less negative, not more.') },
        ] },
      },
      {
        view: 'membrane', title: c('kLeak.title', 'Predict: K⁺ leak channels'),
        text: c('kLeak.text', `<p>K⁺ leak channels are open all the time. ${I('K')} is concentrated inside.</p>`),
        question: { prompt: c('kLeak.prompt', 'Which way does K⁺ tend to move through an open K⁺ channel at rest?'), options: [
          { t: c('kLeak.opt0', 'Out of the cell'), ok: true, fb: c('kLeak.fb0', `Down its gradient: from 140 mM inside toward 4 mM outside. Each K⁺ that leaves carries positive charge out, leaving the inside more negative. That is the main source of the resting potential. (It stops short of the K⁺ equilibrium potential of about ${fmtE(E.K)} mV because a little Na⁺ leaks in.)`) },
          { t: c('kLeak.opt1', 'Into the cell'), fb: c('kLeak.fb1', `K⁺ is far more concentrated inside, so the gradient pushes it out. (The negative inside pulls it back — at ${fmtE(E.K)} mV the two would balance exactly.)`) },
          { t: c('kLeak.opt2', 'It does not move'), fb: c('kLeak.fb2', 'The channel is open and there is a steep gradient, so K⁺ definitely moves. Which way?') },
        ] },
      },
      {
        view: 'membrane', viewOpts: { comp: profile.comp, inset: region, channels: ['K_leak', 'Na_leak', 'pump', 'Na_manual'], caption: c('naOpen.caption', 'A Na⁺ channel has been added. Predict first, then open it.') }, remount: true,
        title: c('naOpen.title', 'Predict: a Na⁺ channel opens'),
        text: c('naOpen.text', `<p>Suppose a ${I('Na')} channel in this membrane suddenly opens.</p>`),
        question: { prompt: c('naOpen.prompt', 'Which way will Na⁺ move?'), options: [
          { t: c('naOpen.opt0', 'Into the cell'), ok: true, fb: c('naOpen.fb0', 'Both forces agree: Na⁺ is 145 mM outside vs 12 mM inside, and the inside is negative, which attracts a positive ion.') },
          { t: c('naOpen.opt1', 'Out of the cell'), fb: c('naOpen.fb1', FB_GRADIENT + ' Na⁺ is concentrated outside and the inside is negative.') },
          { t: c('naOpen.opt2', 'Neither'), fb: c('naOpen.fb2', 'An open channel plus a gradient means movement. Na⁺ has both a concentration gradient and an electrical pull in the same direction.') },
        ] },
      },
      {
        view: 'membrane', title: c('naObserve.title', 'Predict, then observe'),
        text: c('naObserve.text', `<p>Positive ${I('Na')} is about to enter the cell.</p>`),
        question: { prompt: c('naObserve.prompt', 'What will happen to the membrane potential?'), options: [
          { t: c('naObserve.opt0', 'It will become more positive (depolarize)'), ok: true, fb: c('naObserve.fb0', 'Now test it: hold the button to open Na⁺ channels and watch the voltage trace.') },
          { t: c('naObserve.opt1', 'It will become more negative'), fb: c('naObserve.fb1', 'Positive charge is entering the inside. Would that make the inside more or less negative?') },
          { t: c('naObserve.opt2', `It will stay at ${fmtE(REST)} mV`), fb: c('naObserve.fb2', 'Adding positive charge to one side of the membrane must change the voltage across it.') },
        ] },
        actions: [{ label: 'Hold to open Na⁺ channels', cls: 'na', hold: true, down: () => { sim.manual.gNa = G.gNa; }, up: () => { sim.manual.gNa = 0; } }],
        waitFor: () => comp().V > REST + 7, waitHint: c('naObserve.waitHint', 'Hold the button and watch Vm rise'),
        status: () => runner.state.done ? c('naObserve.statusDone', `<b>Observed:</b> Na⁺ entered and Vm rose (watch the ladder: Na⁺ pulls Vm up toward ${fmtE(sim.E.Na)}). Let go and it drifts back as K⁺ leaks out again.`) : 'Vm is ' + fmtV(comp().V) + ' mV — hold the button.',
      },
      {
        view: 'membrane', viewOpts: { comp: profile.comp, inset: region, channels: ['K_leak', 'Na_leak', 'pump', 'K_manual'], caption: c('kObserve.caption', 'Now a K⁺ channel. Predict first.') }, remount: true,
        title: c('kObserve.title', 'Predict: extra K⁺ channels open'),
        text: c('kObserve.text', `<p>Now imagine <b>extra</b> ${I('K')} channels open, on top of the leak.</p>`),
        question: { prompt: c('kObserve.prompt', 'What will happen to Vm?'), options: [
          { t: c('kObserve.opt0', 'It becomes more negative (hyperpolarizes)'), ok: true, fb: c('kObserve.fb0', `More K⁺ leaves, taking positive charge out. Vm moves toward the K⁺ equilibrium potential (about ${fmtE(E.K)} mV). Try it.`) },
          { t: c('kObserve.opt1', 'It becomes more positive'), fb: c('kObserve.fb1', 'K⁺ is a positive ion leaving the cell. Which way does that push the inside charge?') },
          { t: c('kObserve.opt2', 'Nothing changes'), fb: c('kObserve.fb2', 'More open channels means more K⁺ crossing, so the balance shifts.') },
        ] },
        actions: [{ label: 'Hold to open K⁺ channels', cls: 'k', hold: true, down: () => { sim.manual.gK = G.gK; }, up: () => { sim.manual.gK = 0; } }],
        waitFor: () => comp().V < REST - 3, waitHint: c('kObserve.waitHint', 'Hold the button and watch Vm fall'),
        status: () => runner.state.done ? c('kObserve.statusDone', '<b>Observed:</b> K⁺ left and Vm became more negative. Remember this: <b>Na⁺ in = up, K⁺ out = down</b>. The whole story of the action potential follows from it.') : 'Vm is ' + fmtV(comp().V) + ' mV',
      },
    ];
    return { id: 'rest', title: c('scene.title', 'The resting membrane'), speed: 0.01, steps: finish(steps, opts) };
  }

  // ------------------------------------------------------------- recording electrode
  // step keys: electrode
  function recordingElectrode(profile, kit, opts) {
    const c = copyOf(opts);
    const REST = profile.rest, { fmtE } = kit;
    const steps = [
      {
        view: profile.defaultView, viewOpts: { caption: c('electrode.caption', `A microelectrode is lowered into the ${profile.regionWord}; a reference electrode sits outside.`) }, reset: true, electrode: true, labels: true, record: profile.comp, remount: true,
        title: c('electrode.title', 'Put in an electrode'),
        text: c('electrode.text', `<p>Watch the fine glass <b>microelectrode</b> slide into the ${profile.regionWord}. Its voltage is compared with a <b>reference electrode</b> in the fluid outside.</p>
                 <p>From now on the graph at the bottom is live: everything you see happen in the ${profile.cellWord} will show up on this trace, and vice versa.</p>`),
        question: { prompt: c('electrode.prompt', `The trace reads about ${fmtE(REST)} mV. What does that mean?`), options: [
          { t: c('electrode.opt0', `The inside of the cell is ${Math.abs(REST)} mV more negative than the outside`), ok: true, fb: c('electrode.fb0', 'Membrane potential is always inside relative to outside. Depolarization means moving up toward 0; hyperpolarization means moving further down.') },
          { t: c('electrode.opt1', `The outside is ${Math.abs(REST)} mV more negative than the inside`), fb: c('electrode.fb1', 'By convention the outside is the reference (0 mV), and the inside measured against it is negative.') },
          { t: c('electrode.opt2', 'The cell is switched off'), fb: c('electrode.fb2', `A resting ${profile.cellWord} is not off; it is charged and ready, like a stretched spring.`) },
        ] },
      },
    ];
    return { id: 'electrode', title: c('scene.title', 'Recording from inside'), speed: 0.01, steps: finish(steps, opts) };
  }

  // ------------------------------------------------------------- building the action potential
  // step keys: rise, rising, peakApproach, peak, fallPredict, falling, undershoot, built
  function actionPotential(profile, kit, opts) {
    const { sim, runner, setPaused, stimPulse, refire, since, I, fmtV, fmtE } = kit;
    const c = copyOf(opts);
    const REST = profile.rest, E = sim.E, AP = profile.apComp, ap = () => sim.byName[AP];
    const region = (opts && opts.insetRegion) || AP;
    const vm = () => `Vm (${AP}) = ${fmtV(ap().V)} mV`;
    const steps = [
      {
        view: 'membrane', viewOpts: { comp: AP, inset: region, channels: ['Na_v', 'K_v'], ions: { outside: { Ca: 0 } }, caption: c('rise.caption', 'Building the action potential curve one phase at a time.') }, reset: true, record: AP, electrode: true, showG: true, remount: true,
        title: c('rise.title', 'Phase 1: rising'),
        text: c('rise.text', `<p>Instead of memorizing the famous curve, we will build it from what the channels do. The lower band of the trace shows the Na⁺ conductance (<span style="color:#e8772e">orange</span>) and K⁺ conductance (<span style="color:#8e5cf0">purple</span>), i.e. how many of each channel are open.</p>
                 <p>Trigger an action potential. The simulation will pause during the rising phase.</p>`),
        actions: [{ label: 'Trigger', cls: 'na', run: (cx) => { setPaused(false); stimPulse(); cx.stepState().data.armed = true; } }],
        tick: (cx) => { const d = cx.stepState().data, V = ap().V; const crossed = d.prevV != null && d.prevV <= -30 && V > -30; d.prevV = V; if (d.armed && !runner.state.done && ((V > -30 && ap().dVdt > 0) || crossed)) { cx.complete(); setPaused(true); cx.mark('rise'); } },
        waitFor: () => false, waitHint: c('rise.waitHint', 'Trigger the action potential'),
        status: () => runner.state.done ? c('rise.statusDone', '<b>Paused mid-rise.</b> gNa is large; K⁺ channels are only starting to open.') : vm(),
      },
      {
        view: 'membrane', title: c('rising.title', 'Rising phase'), pause: true,
        text: c('rising.text', `<p>Paused. The Na⁺ conductance is huge and ${I('Na')} is pouring in.</p>`),
        question: { prompt: c('rising.prompt', 'Where is Vm heading?'), options: [
          { t: c('rising.opt0', `Up toward the Na⁺ equilibrium potential (${fmtE(E.Na)} mV)`), ok: true, fb: c('rising.fb0', 'With Na⁺ channels dominating, Vm is pulled toward ENa. It will not quite get there, because of what happens next. Continue and the simulation will pause again at the peak.') },
          { t: c('rising.opt1', `Back down to ${fmtE(REST)} mV`), fb: c('rising.fb1', 'While Na⁺ is entering, the inside keeps getting more positive.') },
          { t: c('rising.opt2', 'It stays at 0 mV'), fb: c('rising.fb2', 'Nothing special happens at 0 mV. The relevant landmark is the equilibrium potential of the ion that dominates: Na⁺.') },
        ] },
        onContinue: () => { setPaused(false); },
      },
      {
        view: 'membrane', title: c('peakApproach.title', 'Approaching the peak'),
        text: c('peakApproach.text', `<p>Watch the two conductances. The Na⁺ channels begin to <b>inactivate</b> (a plug swings into the pore), and the slower K⁺ channels finally open. The simulation pauses at the peak.</p>`),
        enter: (cx) => { cx.stepState().data.t0 = sim.t; },
        actions: [refire],
        tick: (cx) => {
          if (runner.state.done) return;
          const h = ap();
          if (h.V > 10 && h.dVdt < 0) { cx.complete(); setPaused(true); cx.mark('peak'); return; }
          const hist = since(cx);
          if (hist.some(s => s.V[AP] > 10) && h.V < REST + 10) { cx.complete(); cx.stepState().data.missed = true; }
        },
        waitFor: () => false, waitHint: c('peakApproach.waitHint', 'Wait for the peak (or fire again)'),
        status: (cx) => runner.state.done ? (cx.stepState().data.missed ? c('peakApproach.statusMissed', 'The peak went by. Press <b>Fire again</b> to catch it, or continue.') : `<b>Paused at the peak:</b> ${fmtV(ap().V)} mV. Na⁺ channels are inactivating; K⁺ channels are open.`) : vm(),
      },
      {
        view: 'membrane', title: c('peak.title', 'Phase 2: at the peak'), pause: true,
        text: c('peak.text', `<p>Paused at the peak. Na⁺ channels are inactivated and no longer pass Na⁺. The voltage-gated K⁺ channels are now wide open. ${I('K')} is far more concentrated inside, and the inside is now <b>positive</b>.</p>`),
        question: { prompt: c('peak.prompt', 'Which way does K⁺ move now?'), options: [
          { t: c('peak.opt0', 'Out of the cell'), ok: true, fb: c('peak.fb0', 'Both the concentration gradient and the electrical force (positive inside repelling a positive ion) now push K⁺ out.') },
          { t: c('peak.opt1', 'Into the cell'), fb: c('peak.fb1', 'K⁺ is 140 mM inside, 4 mM outside, and the inside is now positive. Every force points outward.') },
        ] },
      },
      {
        view: 'membrane', title: c('fallPredict.title', 'Predict the falling phase'), pause: true,
        question: { prompt: c('fallPredict.prompt', 'Positive charge is leaving the cell. What happens to Vm?'), options: [
          { t: c('fallPredict.opt0', 'It falls back toward negative values (repolarization)'), ok: true, fb: c('fallPredict.fb0', 'K⁺ out = down. Continue and watch the trace fall; the simulation will pause once more when Vm dips below rest.') },
          { t: c('fallPredict.opt1', 'It keeps rising'), fb: c('fallPredict.fb1', 'Losing positive charge makes the inside less positive.') },
        ] },
        onContinue: () => { setPaused(false); },
      },
      {
        view: 'membrane', title: c('falling.title', 'Phase 3: falling'),
        text: c('falling.text', `<p>K⁺ leaves, Vm falls. Watch where it stops.</p>`),
        enter: (cx) => { cx.stepState().data.t0 = sim.t; },
        actions: [refire],
        tick: (cx) => {
          if (runner.state.done) return;
          const h = ap();
          if (h.V < REST - 6 && Math.abs(h.dVdt) < 30) { cx.complete(); setPaused(true); cx.mark('undershoot'); return; }
          const hist = since(cx);
          if (hist.some(s => s.V[AP] < REST - 4) && h.V > REST - 2) { cx.complete(); cx.stepState().data.missed = true; }
        },
        waitFor: () => false, waitHint: c('falling.waitHint', 'Wait for the trace to fall (or fire again)'),
        status: (cx) => runner.state.done ? (cx.stepState().data.missed ? c('falling.statusMissed', 'The undershoot went by. Press <b>Fire again</b> to see it, or continue.') : `<b>Paused at the undershoot:</b> ${fmtV(ap().V)} mV, below the resting potential.`) : vm(),
      },
      {
        view: 'membrane', title: c('undershoot.title', 'Phase 4: the undershoot'), pause: true,
        text: c('undershoot.text', `<p>Vm has dropped <b>below</b> ${fmtE(REST)} mV.</p>`),
        question: { prompt: c('undershoot.prompt', 'Why does the voltage overshoot below the resting potential?'), options: [
          { t: c('undershoot.opt0', `The voltage-gated K⁺ channels are slow to close, so the membrane is briefly even more K⁺-permeable than at rest and Vm approaches EK (about ${fmtE(E.K)} mV)`), ok: true, fb: c('undershoot.fb0', `As those K⁺ channels close, Vm relaxes back to ${fmtE(REST)} mV. Continue and watch it recover. Note the Na⁺ channels: still inactivated for a while.`) },
          { t: c('undershoot.opt1', 'Na⁺ is still entering'), fb: c('undershoot.fb1', 'Na⁺ entering would make Vm more positive, not more negative. And the Na⁺ channels are inactivated.') },
          { t: c('undershoot.opt2', 'The pump has pumped all the Na⁺ back out'), fb: c('undershoot.fb2', 'The pump is far too slow to act within a millisecond. Only a tiny fraction of the ions crossed anyway; the gradients are essentially unchanged.') },
        ] },
        onContinue: () => { setPaused(false); },
      },
      {
        view: 'membrane', title: c('built.title', 'You built the curve'),
        text: c('built.text', `<p>Rising (Na⁺ in) → peak (Na⁺ inactivates, K⁺ opens) → falling (K⁺ out) → undershoot (K⁺ still open) → rest. Every phase is a consequence of which channels are open. Fire again as often as you like and watch the ladder.</p>`),
        actions: [refire],
        question: { prompt: c('built.prompt', 'Right after an action potential the membrane cannot fire again for a moment (the refractory period). Why?'), options: [
          { t: c('built.opt0', 'The Na⁺ channels are inactivated and must return to the closed state before they can open again'), ok: true, fb: c('built.fb0', `The refractory period also limits how fast a ${profile.cellWord} can fire, and, as we will see next, it is why the action potential travels in one direction only.`) },
          { t: c('built.opt1', 'The cell has run out of Na⁺ outside'), fb: c('built.fb1', 'Only a tiny fraction of the ions moved. The gradients are practically unchanged.') },
          { t: c('built.opt2', 'The K⁺ channels are inactivated'), fb: c('built.fb2', 'The delayed K⁺ channels simply close; it is the Na⁺ channels that have an inactivated state (the plug).') },
        ] },
        waitFor: () => ap().V > REST - 2 && ap().h > 0.4, waitHint: c('built.waitHint', 'Wait for the membrane to recover'),
      },
    ];
    return { id: 'ap', title: c('scene.title', 'Building the action potential'), speed: 0.003, steps: finish(steps, opts) };
  }

  window.SharedScenes = { restingMembrane, recordingElectrode, actionPotential };
})();

</script>
<script>
/*
 * MuscleViews: the SVG views of the skeletal muscle page (see docs/MUSCLE_VIEWS.md).
 *
 *   window.MuscleViews = (kit) => ({ drawCell, views })
 *
 * Every visual is rendered from MuscleFibre state each frame: segment colours from V,
 * channel glyphs from the state helpers, Ca²⁺ dots from the cytosolic concentration, the store
 * level from caSR, cross-bridges from xb, the fibre's length and the gauge from force.
 * Classic script (no modules) so the page opens from file://.
 */
(function () {
  'use strict';

  const FORCE = '#a0442a', TUBULE = '#8a7a50', COVER = '#6b7280', SR_BLUE = '#2d8fd5';

  let sim, app, profile, svgEl, setAttrs, htmlEl, $, clamp, lerp, rand, ION_COLOR, ION_LABEL, CH, vColor, insideFill,
    drawChannel, setChannelState, makeIonPool, makeParticles, fluxCounter, drawBilayer, drawInset, chip, IN, OUT, fmtV, setCaption;
  let boundKit = null;
  function bind(kit) {
    if (boundKit === kit) return;
    boundKit = kit;
    ({ sim, app, profile, svgEl, setAttrs, htmlEl, $, clamp, lerp, rand, ION_COLOR, ION_LABEL, CH, vColor, insideFill,
      drawChannel, setChannelState, makeIonPool, makeParticles, fluxCounter, drawBilayer, drawInset, chip, IN, OUT, fmtV, setCaption } = kit);
    if (!CH.nAChR) CH.nAChR = { color: ION_COLOR.Na, label: 'ACh receptor (Na⁺/K⁺ channel)', ion: 'Na', dir: -1, receptor: true };
  }

  // =========================================================================
  // Small shared pieces
  // =========================================================================
  function forceGauge(parent, x, y, h, label) {
    const g = svgEl('g', { transform: `translate(${x},${y})`, 'font-size': 11, fill: '#3a3f4a' }, parent);
    svgEl('text', { x: 0, y: -8, 'font-weight': 700, 'font-size': 12, text: label || 'Force' }, g);
    svgEl('rect', { x: 0, y: 0, width: 16, height: h, rx: 4, fill: '#eee9dc', stroke: '#c9c4b4' }, g);
    const bar = svgEl('rect', { x: 2, y: h - 2, width: 12, height: 0, rx: 3, fill: FORCE }, g);
    [[0, '0'], [0.25, 'twitch'], [1, 'tetanus']].forEach(([f, t]) => { svgEl('line', { x1: 16, y1: h - f * h, x2: 21, y2: h - f * h, stroke: '#9ca3af' }, g); svgEl('text', { x: 24, y: h - f * h + 4, fill: '#6b7280', text: t }, g); });
    const val = svgEl('text', { x: 0, y: h + 14, 'font-weight': 700, text: '0.00' }, g);
    return { update(F) { const hh = clamp(F, 0, 1.05) * h; bar.setAttribute('y', h - hh); bar.setAttribute('height', hh); val.textContent = F.toFixed(2); } };
  }

  // A causal checklist: rows light while their test is true, tick afterwards, reset when quiet.
  function checklist(parent, x, y, title, rows) {
    const g = svgEl('g', { transform: `translate(${x},${y})`, 'font-size': 11.5, fill: '#3a3f4a' }, parent);
    svgEl('text', { x: 0, y: 0, 'font-weight': 700, 'font-size': 12, text: title }, g);
    const els = rows.map((r, i) => {
      const yy = 22 + i * 18;
      const dot = svgEl('circle', { cx: 7, cy: yy - 4, r: 6, fill: '#fff', stroke: '#c9c4b4', 'stroke-width': 1.5 }, g);
      const tick = svgEl('path', { d: `M3,${yy - 4} l3,3 l6,-6`, stroke: '#fff', 'stroke-width': 2, fill: 'none', opacity: 0 }, g);
      const txt = svgEl('text', { x: 20, y: yy, text: r.label }, g);
      return { dot, tick, txt, done: false };
    });
    let quietFor = 0;
    return {
      update(dtReal) {
        const anyActive = rows.some(r => r.test());
        quietFor = anyActive ? 0 : quietFor + dtReal;
        if (quietFor > 1500) els.forEach(e => { e.done = false; });
        rows.forEach((r, i) => {
          const active = r.test(), e = els[i];
          if (active) e.done = true;
          const color = active ? '#2f6fd6' : (e.done ? '#2f9e5b' : '#c9c4b4');
          e.dot.setAttribute('fill', active ? '#2f6fd6' : (e.done ? '#2f9e5b' : '#fff'));
          e.dot.setAttribute('stroke', color);
          e.tick.setAttribute('opacity', e.done && !active ? 1 : 0);
          e.txt.setAttribute('font-weight', active ? 700 : 400);
          e.txt.setAttribute('fill', active ? '#1f2430' : (e.done ? '#2f9e5b' : '#6b7280'));
        });
      },
      reset() { els.forEach(e => { e.done = false; }); },
    };
  }

  const R3 = () => sim.byName.R3;
  function ecRows() {
    const c = () => R3();
    return [
      { label: 'impulse reaches the T-tubule', test: () => c().V > -40 },
      { label: 'voltage sensor moves', test: () => sim.sensorState(c()) === 'active' },
      { label: 'SR release channel opens', test: () => sim.ryrState(c()) === 'open' },
      { label: 'Ca²⁺ floods the cytosol', test: () => c().ca > 1 && c().ryr > 0.1 },
      { label: 'Ca²⁺ binds troponin', test: () => c().tn > 0.4 && c().ca > 0.6 },
      { label: 'tropomyosin cover moves aside', test: () => c().tn > 0.4 },
      { label: 'cross-bridges cycle (ATP)', test: () => c().xb > 0.1 && sim.atp > 0 && c().tn > 0.3 },
      { label: 'force rises', test: () => sim.force > 0.05 && c().xb > c().force - 0.02 && c().tn > 0.3 },
      { label: 'SERCA pumps Ca²⁺ back (ATP)', test: () => sim.atp > 0 && c().ca > 0.4 && c().ryr < 0.1 },
      { label: 'troponin lets go', test: () => c().tn < 0.4 && c().tn > 0.1 && c().ryr < 0.1 },
      { label: 'force falls', test: () => sim.force > 0.03 && c().force > c().xb + 0.01 },
    ];
  }

  // =========================================================================
  // Whole fibre (full size, zoom slide, and inset)
  // =========================================================================
  // h leaves a 25 px band inside each face for the T-tubules and the terminal cisternae they meet.
  const FIB = { x0: 70, x1: 860, cy: 262, h: 110, epX: 465 };
  const MYO_Y = (k) => FIB.cy - 24 + k * 24;   // three myofibril stripes, centred

  function drawFibre(parent, opts) {
    opts = opts || {};
    const g = svgEl('g', { class: 'fibre' }, parent);
    const parts = {};
    const n = sim.comps.length, W = FIB.x1 - FIB.x0, segW = W / n;
    const yTop = FIB.cy - FIB.h / 2, yBot = FIB.cy + FIB.h / 2;
    // tendons
    parts.tendonL = svgEl('path', { d: `M10,${FIB.cy - 14} L${FIB.x0},${yTop + 10} L${FIB.x0},${yBot - 10} L10,${FIB.cy + 14} Z`, fill: '#e6e2d6', stroke: '#8b8778', 'stroke-width': 2 }, g);
    parts.tendonR = svgEl('path', { d: `M920,${FIB.cy - 14} L${FIB.x1},${yTop + 10} L${FIB.x1},${yBot - 10} L920,${FIB.cy + 14} Z`, fill: '#e6e2d6', stroke: '#8b8778', 'stroke-width': 2 }, g);
    // the fibre body scales about its centre with force
    parts.body = svgEl('g', {}, g);
    const body = parts.body;
    // sarcolemma segments (fill = membrane potential)
    parts.segs = [];
    const segLayer = svgEl('g', { 'data-part': 'sarcolemma' }, body);
    for (let i = 0; i < n; i++) parts.segs.push(svgEl('rect', { x: FIB.x0 + i * segW, y: yTop, width: segW + 0.6, height: FIB.h, fill: '#7d8aa5' }, segLayer));
    // myofibrils: three stripes with striations
    parts.myofibril = svgEl('g', { 'data-part': 'myofibril' }, body);
    parts.striations = [];
    for (let k = 0; k < 3; k++) {
      const y = MYO_Y(k);
      svgEl('rect', { x: FIB.x0 + 4, y: y - 6, width: W - 8, height: 12, rx: 3, fill: 'rgba(255,255,255,.55)', stroke: 'rgba(42,47,58,.35)' }, parts.myofibril);
      const st = svgEl('g', { stroke: 'rgba(42,47,58,.45)', 'stroke-width': 1.2 }, parts.myofibril);
      parts.striations.push(st);
    }
    // membrane outline (clickable sarcolemma; drawn before the tubules so their mouths sit on top of it)
    parts.outline = svgEl('rect', { 'data-part': 'sarcolemma', x: FIB.x0, y: yTop, width: W, height: FIB.h, rx: 6, fill: 'none', stroke: '#2a2f3a', 'stroke-width': 3 }, body);
    // Sarcoplasmic reticulum: a longitudinal sleeve inside each face that swells into a pair of
    // terminal cisternae beside every T-tubule — the calcium store students are asked to find,
    // drawn as something they can actually see and click rather than a faint stripe.
    parts.sr = svgEl('g', { 'data-part': 'sr' }, body);
    parts.cisternae = [];
    const TUBE_IN = 26, CIS_H = 17;                       // how far a tubule dives, cistern height
    const faces = [{ sign: 1, edge: yTop }, { sign: -1, edge: yBot }];
    for (const f of faces) {
      const cy = f.edge + f.sign * (TUBE_IN / 2 + 1);
      svgEl('rect', { x: FIB.x0 + 3, y: cy - 3, width: W - 6, height: 6, rx: 3, fill: SR_BLUE, opacity: 0.35 }, parts.sr);
      for (let i = 0; i < n; i++) {
        const x = FIB.x0 + (i + 0.5) * segW;
        for (const dx of [-13, 4]) parts.cisternae.push(svgEl('rect', { x: x + dx, y: cy - CIS_H / 2, width: 9, height: CIS_H, rx: 4, fill: SR_BLUE, stroke: '#1c6fa8', 'stroke-width': 1 }, parts.sr));
      }
    }
    // T-tubules: inward tunnels of the sarcolemma, on BOTH faces of the fibre (they are folds of
    // the surface, so every face has them), each with an open mouth so the tunnel reads as a tunnel.
    parts.ttubule = svgEl('g', { 'data-part': 'ttubule' }, body);
    parts.tubes = [];
    parts.tubeX = [];
    for (const f of faces) {
      for (let i = 0; i < n; i++) {
        const x = FIB.x0 + (i + 0.5) * segW;
        if (f.sign > 0) parts.tubeX.push(x);
        const d = `M${x},${f.edge - f.sign * 5} l0,${f.sign * (TUBE_IN + 5)}`;
        parts.tubes.push(svgEl('path', { d, stroke: TUBULE, 'stroke-width': 7, 'stroke-linecap': 'round' }, parts.ttubule));
        svgEl('path', { d, stroke: '#f4f1e6', 'stroke-width': 2.6, 'stroke-linecap': 'round' }, parts.ttubule);   // lumen: it is a tunnel, not a peg
        svgEl('ellipse', { cx: x, cy: f.edge, rx: 7, ry: 4, fill: '#f4f1e6', stroke: TUBULE, 'stroke-width': 2 }, parts.ttubule);
      }
    }
    parts.faces = faces; parts.TUBE_IN = TUBE_IN;
    // motor end plate: a nerve ending stub pressed on the middle of the fibre
    parts.endplate = svgEl('g', { 'data-part': 'endplate' }, body);
    svgEl('path', { d: `M${FIB.epX - 60},40 C${FIB.epX - 30},60 ${FIB.epX - 10},90 ${FIB.epX},${yTop - 26}`, fill: 'none', stroke: '#4a4f5a', 'stroke-width': 5, 'stroke-linecap': 'round' }, parts.endplate);
    parts.terminalBulb = svgEl('ellipse', { cx: FIB.epX, cy: yTop - 14, rx: 22, ry: 12, fill: '#7d8aa5', stroke: '#2a2f3a', 'stroke-width': 2.5 }, parts.endplate);
    svgEl('path', { d: `M${FIB.epX - 22},${yTop - 4} l6,6 l6,-6 l6,6 l6,-6 l6,6 l6,-6 l6,6`, fill: 'none', stroke: '#2a2f3a', 'stroke-width': 1.5 }, parts.endplate);
    svgEl('text', { x: FIB.epX - 70, y: 36, 'font-size': 11, fill: '#6b6b60', text: 'from the motor nerve' }, parts.endplate);
    // stimulating electrodes at the end plate
    parts.stimulator = svgEl('g', { opacity: opts.stimulator ? 1 : 0 }, body);
    for (const dx of [-42, 42]) {
      svgEl('line', { x1: FIB.epX + dx, y1: yBot + 6, x2: FIB.epX + dx, y2: yBot + 70, stroke: '#4a4f5a', 'stroke-width': 3 }, parts.stimulator);
      svgEl('rect', { x: FIB.epX + dx - 8, y: yBot + 70, width: 16, height: 16, fill: '#4a4f5a' }, parts.stimulator);
    }
    parts.stimFlash = svgEl('circle', { cx: FIB.epX, cy: yBot + 6, r: 14, fill: ION_COLOR.Na, opacity: 0 }, parts.stimulator);
    svgEl('text', { x: FIB.epX, y: yBot + 100, 'font-size': 11, fill: '#4a4f5a', 'text-anchor': 'middle', text: 'stimulating electrodes' }, parts.stimulator);
    // recording electrode (hidden until the electrode scene)
    const eIdx = sim.byName[opts.electrodeAt || 'R3'].index, ex = FIB.x0 + (eIdx + 0.5) * segW;
    parts.electrode = svgEl('g', { class: 'electrode', opacity: 0, 'pointer-events': 'none' }, g);
    svgEl('path', { d: `M${ex - 4},${yTop + 30} L${ex + 40},${yTop - 130} L${ex + 54},${yTop - 130} L${ex + 2},${yTop + 32} Z`, fill: '#dfe6f2', stroke: '#2a2f3a', 'stroke-width': 1.5 }, parts.electrode);
    svgEl('rect', { x: ex + 36, y: yTop - 155, width: 22, height: 26, fill: '#4a4f5a' }, parts.electrode);
    svgEl('text', { x: ex + 66, y: yTop - 136, 'font-size': 12, fill: '#4a4f5a', text: 'recording electrode' }, parts.electrode);
    svgEl('line', { x1: 800, y1: 120, x2: 800, y2: 60, stroke: '#4a4f5a', 'stroke-width': 3 }, parts.electrode);
    svgEl('rect', { x: 790, y: 40, width: 20, height: 22, fill: '#4a4f5a' }, parts.electrode);
    svgEl('text', { x: 816, y: 58, 'font-size': 12, fill: '#4a4f5a', text: 'reference (outside)' }, parts.electrode);
    // Highlight marks: each structure gets shapes drawn over the structure itself, so "these are
    // the T-tubules" points at the tubules rather than sweeping an ellipse over part of the membrane.
    parts.markLayer = svgEl('g', { class: 'marks', 'pointer-events': 'none' }, g);
    parts.marks = {};
    const MARK = { stroke: '#2f6fd6', fill: 'none', 'stroke-width': 2.5, 'stroke-dasharray': '7 5' };
    const mark = (name, tag, attrs) => {
      const el = svgEl(tag, Object.assign({}, MARK, attrs), parts.markLayer);
      (parts.marks[name] = parts.marks[name] || []).push(el);
      return el;
    };
    mark('sarcolemma', 'rect', { x: FIB.x0 - 5, y: yTop - 5, width: W + 10, height: FIB.h + 10, rx: 9 });
    mark('sarcolemma', 'rect', { x: FIB.x0 + 5, y: yTop + 5, width: W - 10, height: FIB.h - 10, rx: 4, 'stroke-width': 1.5, opacity: 0.6 });
    for (const f of faces) {
      // a tint down each tunnel, and one dashed band round the row of them
      for (const x of parts.tubeX)
        mark('ttubule', 'line', { x1: x, y1: f.edge - f.sign * 8, x2: x, y2: f.edge + f.sign * (TUBE_IN + 5), stroke: '#2f6fd6', 'stroke-width': 13, 'stroke-linecap': 'round', 'stroke-dasharray': 'none', opacity: 0.3 });
      const tTop = Math.min(f.edge - 9, f.edge + f.sign * (TUBE_IN + 6));
      mark('ttubule', 'rect', { x: FIB.x0 - 3, y: tTop, width: W + 6, height: TUBE_IN + 15, rx: 9 });
      const cy = f.edge + f.sign * (TUBE_IN / 2 + 1);
      for (const x of parts.tubeX)
        mark('sr', 'rect', { x: x - 15, y: cy - CIS_H / 2 - 3, width: 30, height: CIS_H + 6, rx: 6, fill: '#2f6fd6', stroke: 'none', 'stroke-dasharray': 'none', opacity: 0.22 });
      mark('sr', 'rect', { x: FIB.x0 - 2, y: cy - CIS_H / 2 - 5, width: W + 4, height: CIS_H + 10, rx: 8 });
    }
    for (let k = 0; k < 3; k++) mark('myofibril', 'rect', { x: FIB.x0 + 1, y: MYO_Y(k) - 9, width: W - 2, height: 18, rx: 6 });
    mark('endplate', 'ellipse', { cx: FIB.epX, cy: yTop - 14, rx: 34, ry: 22 });
    Object.values(parts.marks).forEach(list => list.forEach(el => el.setAttribute('visibility', 'hidden')));
    // labels
    parts.labels = svgEl('g', { class: 'labels', 'pointer-events': 'none', 'font-size': 13, fill: '#3a3f4a' }, g);
    // Each label carries a leader line to the structure it names; the inner structures are small
    // enough that a floating word near the fibre is not enough to identify them.
    [['Sarcolemma (membrane)', 160, yBot + 40, 160, yBot + 2],
     ['T-tubules', 250, yTop - 32, 233, yTop - 9],
     ['Sarcoplasmic reticulum (Ca²⁺ store)', 690, yTop - 32, 703, yTop + 13],
     ['Myofibrils', 700, yBot + 40, 720, MYO_Y(2)],
     ['Motor end plate', FIB.epX - 132, yTop - 58, FIB.epX - 22, yTop - 18]]
      .forEach(([t, x, y, lx, ly]) => {
        const y0 = ly > y ? y + 6 : y - 14;
        for (const w of [{ stroke: '#f6f5f0', 'stroke-width': 3.5 }, { stroke: '#8b8778', 'stroke-width': 1.2 }])
          svgEl('line', Object.assign({ x1: x, y1: y0, x2: lx, y2: ly }, w), parts.labels);
        svgEl('circle', { cx: lx, cy: ly, r: 2.6, fill: '#8b8778' }, parts.labels);
        for (const w of [{ stroke: '#f6f5f0', 'stroke-width': 4, 'stroke-linejoin': 'round' }, { fill: '#3a3f4a' }])
          svgEl('text', Object.assign({ x, y, 'text-anchor': 'middle', text: t }, w), parts.labels);
      });
    // force gauge
    parts.gauge = opts.showForce === false ? null : forceGauge(g, 880, 340, 120, 'Force');
    parts.scale = svgEl('text', { x: FIB.x0, y: 500, 'font-size': 11, fill: '#6b7280', text: 'about 3 cm long, 50 µm thick (not to scale)' }, g);
    return { g, parts };
  }

  function updateFibre(parts, opts) {
    opts = opts || {};
    const n = sim.comps.length;
    for (let i = 0; i < n; i++) parts.segs[i].setAttribute('fill', vColor(sim.comps[i].V));
    parts.terminalBulb.setAttribute('fill', vColor(sim.nerveV));

    const F = clamp(sim.force, 0, 1.05), s = 1 - 0.1 * F;

    parts.body.setAttribute('transform', `translate(${cx},0) scale(${s.toFixed(4)},1) translate(${-cx},0)`);
    const period = 22 - 3 * F;
    if (parts._lastPeriod == null || Math.abs(parts._lastPeriod - period) > 0.4) {
      parts._lastPeriod = period;
      parts.striations.forEach((st, k) => {
        const y = MYO_Y(k);
        let d = '';

        if (!st.firstChild) svgEl('path', { d, fill: 'none' }, st); else st.firstChild.setAttribute('d', d);
      });
    }
    const nc = sim.comps.length;
    parts.tubes.forEach((t, i) => t.setAttribute('stroke', sim.sensorState(sim.comps[i % nc]) === 'active' ? ION_COLOR.Na : TUBULE));
    parts.sr.setAttribute('opacity', (0.3 + 0.7 * sim.srLevel).toFixed(3));

    if (parts.stimFlash) { const st = sim.stim; const on = Object.keys(st).length > 0; parts.stimFlash.setAttribute('opacity', on ? 0.8 : 0); }

    } else if (!app.electrode) { parts._electrodeShown = false; parts.electrode.setAttribute('opacity', 0); }
    parts.labels.setAttribute('opacity', app.labels && !opts.hideLabels ? 1 : 0);
  }

  // ---------------------------------------------------------------- whole fibre
  views.fibre = function (opts) {
    let svg, d, onPart = null, ghost = null, shown = 'none';
    function showMarks(part) {
      shown = part || 'none';
      for (const [name, list] of Object.entries(d.parts.marks))
        list.forEach(el => el.setAttribute('visibility', name === part ? 'visible' : 'hidden'));
    }
    return {
      mount(el) {
        svg = svgEl('svg', { viewBox: '0 0 930 520' });
        el.appendChild(svg);
        svgEl('rect', { x: 0, y: 0, width: 930, height: 520, fill: '#f6f5f0' }, svg);
        d = drawFibre(svg, opts);
        for (const el2 of d.g.querySelectorAll('[data-part]')) {
          el2.style.cursor = 'pointer';
          el2.addEventListener('click', (e) => { e.stopPropagation(); if (onPart) onPart(el2.getAttribute('data-part')); });
        }
        setCaption(opts.caption || '');
      },
      update() { updateFibre(d.parts, opts); },
      set onPart(fn) { onPart = fn; },
      highlight(part) { showMarks(part); },
      // A ghost of the structure: it appears, pulses, and fades again, so a student who cannot find
      // a small structure is shown where it is without the outline sitting over the model afterwards.
      hint(part) {
        if (!d.parts.marks[part]) return;
        showMarks(part);
        if (ghost) clearTimeout(ghost);
        d.parts.marks[part].forEach(el => {
          if (el.animate) el.animate([{ opacity: 0 }, { opacity: 1 }, { opacity: 0.25 }, { opacity: 1 }, { opacity: 0 }],
            { duration: 2600, easing: 'ease-in-out' });
        });
        ghost = setTimeout(() => { if (shown !== 'locked') showMarks('none'); ghost = null; }, 2600);
      },
      parts: () => d.parts,
      narrate() {
        const ep = sim.endplate, r3 = R3(), F = sim.force;
        const lead = sim.comps.find(c => c.V > -20 && c.dVdt > 0);
        if (sim.atp === 0 && F > 0.3) return `<b>Rigor:</b> with no ATP the cross-bridges cannot let go and Ca²⁺ cannot be pumped back, so the fibre stays contracted with no impulses at all.`;
        if (sim.isFused) return `<b>Fused tetanus:</b> impulses arrive faster than Ca²⁺ can be pumped back, troponin stays switched on, force is smooth and maximal (${F.toFixed(2)}).`;
        if (lead) return `<b>Impulse spreading</b> (segment ${lead.name}): Na⁺ entering here depolarizes the next patch of membrane, whose Na⁺ channels open in turn.`;
        if (r3.ca > 0.6 && F < 0.1) return `Ca²⁺ has been released from the store into the cytosol (${sim.ca.toFixed(1)} µM) → it is binding troponin → force is about to rise.`;
        if (F > 0.05 && r3.force <= r3.xb) return `<b>Force rising</b> (${F.toFixed(2)}): cross-bridges are pulling and the fibre shortens. The impulse is already over.`;
        if (F > 0.05) return `<b>Relaxing</b> (${F.toFixed(2)}): SERCA is pumping Ca²⁺ back into the store, troponin lets go, bridges stop forming.`;
        if (Math.abs(sim.receptor.g) > 0.5) return `The end plate is depolarizing: receptor channels at the end plate are open.`;
        if (ep.V > -60 && ep.dVdt > 0 && Object.keys(sim.stim).length) return `A shock is pushing positive charge into the fibre at the end plate.`;
        return `<b>At rest:</b> ${fmtV(r3.V)} mV inside, no force. The fibre is a charged battery waiting for a trigger.`;
      },
    };
  };

        // Acetylcholinesterase in the cleft. Drawn as a body with a notch cut out of the top — the

        const nPlugged = Math.round(recChans.length * clamp(rec.block, 0, 1));
        recChans.forEach((ch, i) => {
          ch.g.setAttribute('opacity', i < nVisible ? 1 : 0.12);

        ache.forEach((g, i) => {
          g.setAttribute('opacity', 0.3 + 0.7 * clamp(acheOn, 0, 1));
          const k = acheBusy ? 1 + 0.16 * Math.sin(acheT / 90 + i * 1.1) : 1;
          g.setAttribute('transform', `translate(${g._x},${g._y}) scale(${k.toFixed(3)})`);
        });

          if (term.s > 0.3) { const n = Math.min(3, caCounter(term.iCa * 40, dtSim)); for (let i = 0; i < n; i++) { const ch = caChans[i % 2]; particles.spawn('Ca', ch.x + rand(-6, 6), PRE_Y + 30 + rand(0, 20), ch.x + rand(-40, 40), PRE_Y - 60 - rand(0, 40), rand(650, 900), { r: 7 }); } }

          const life = (900 + 6000 * (1 - clamp(acheOn, 0, 1))) / Math.max(app.speed * 100, 0.15);

<script>
/*
 * MuscleLesson: everything lesson-side for muscle.html (see docs/MUSCLE_MODULE.md,
 * docs/APP_API.md and docs/MUSCLE_VIEWS.md).
 *
 *   window.MuscleLesson = { profile, drawCell, views, lesson, lab }
 *
 * The profile names the fibre's landmarks and words; drawCell and views delegate to
 * views/muscle.js (window.MuscleViews); lesson assembles the scenes from SharedScenes and the
 * muscle-specific ones; lab renders the free-play controls and the clinical scenario cards.
 * Every "done when" reads model state or model events; nothing is timed or canned.
 * Classic script (no modules) so the page opens from file://.
 */
(function () {
  'use strict';

  // Kit members used below; filled in by bind(kit) before any lesson code runs.
  let sim, app, runner, panel, htmlEl, $, clamp, ION_COLOR, CH, chip, I, fmtV, fmtE, spikeIn, questionOrder,
    setPaused, setSpeed, mountView, enterLab, refire, since, LOOP_HTML, loopHighlight, labNav;
  let boundKit = null;
  function bind(kit) {
    if (boundKit === kit) return;
    boundKit = kit;
    ({ sim, app, runner, panel, htmlEl, $, clamp, ION_COLOR, CH, chip, I, fmtV, fmtE, spikeIn, questionOrder,
      setPaused, setSpeed, mountView, enterLab, refire, since, LOOP_HTML, loopHighlight, labNav } = kit);
    app.listeners.push(onModelEvent);
  }

  // Colours shared with the views (docs/MUSCLE_VIEWS.md).
  const FORCE_COLOR = '#a0442a', CA_COLOR = '#2d8fd5';
  const BANDS = [
    { key: 'ca', label: 'Ca²⁺\n(µM)', color: CA_COLOR, max: 8 },
    { key: 'force', label: 'force', color: FORCE_COLOR, max: 1.05 },
  ];
  const FORCE_BAND = [BANDS[1]];

  const profile = {
    id: 'muscle',
    cellWord: 'muscle fibre',
    regionWord: 'muscle fibre',
    rest: -85,
    threshold: -60,
    comp: 'endplate',            // manual channels and the default recording site (scenes 3–4)
    apComp: 'R3',                // scenes 5–6 record 5 mm from the stimulator (no stimulus artefact)
    stimComp: 'endplate',
    // The shared scenes' trigger: 1.5 × the model's reference shock, read from the model at
    // run time (the profile object is built before the model exists).
    get stimPulse() { return { nA: sim ? 1.5 * sim.refShockNA : 580, ms: 0.5 }; },
    manualG: { gNa: 0.9, gK: 6, gCl: 6 },      // µS (a fibre segment is ~200× a soma)
    fluxScale: 0.006,            // ion-traffic particles per nA in the membrane view (a segment carries ~150× a soma's leak current)
    defaultView: 'fibre',
    traceColors: { endplate: '#1f2430', R3: '#b45309', R8: '#0f766e', L8: '#7c3aed', mid: '#0f766e', nerve: '#d63c8a' },
    // Where each recording site is, in words a student can read off the legend. Segment names
    // (R3, R8) mean nothing to them, and a second unexplained curve looks like a second event.
    traceLabel: (c) => ({ endplate: 'at the end plate', R3: '5 mm along', mid: 'half way along', R8: 'far end, 2.5 cm', L8: 'other end, 2.5 cm', nerve: 'motor terminal' }[c] || c),
    traceTitle: (comp, extras) => {
      const where = { endplate: 'the end plate', R3: '5 mm from the end plate', mid: 'half way along', R8: 'the far end, 2.5 cm away', L8: 'the other end, 2.5 cm away', nerve: 'the motor terminal' };
      const at = [comp].concat(extras || []).filter(c => c !== 'nerve' || comp === 'nerve').map(c => where[c] || c);
      if (at.length < 2) return `Membrane potential recorded inside the fibre (${(at[0] || comp).replace(/^the /, '')})`;
      const last = at.pop();
      return `Membrane potential recorded inside the fibre at two electrodes: ${at.join(', ')} and ${last}`;
    },
    probeV: (s, name) => name === 'nerve' ? s.nerveV : undefined,
    extraVoltages: (s) => ({ nerve: s.nerveV }),
    // Dashed highlight on the whole-fibre inset (930 × 520, fibre horizontal, end plate centred;
    // ≈ 50 px per segment). Refine against views/muscle.js at integration.
    insetRegions: {
      endplate: [465, 260, 70, 70], R3: [617, 260, 55, 60], R8: [860, 260, 55, 60], L8: [70, 260, 55, 60],
      fibre: [465, 260, 430, 80], triad: [617, 260, 60, 60], sarcomere: [617, 260, 60, 60], nmj: [465, 260, 70, 70],
      default: [465, 260, 200, 60],
    },
  };

  // ---------------------------------------------------------------- views (views/muscle.js)
  let mv = null;
  function MV(kit) {
    if (!mv || mv.kit !== kit) mv = { kit, v: window.MuscleViews(kit) };
    return mv.v;
  }
  function drawCell(parent, opts, kit) { bind(kit); return MV(kit).drawCell(parent, opts || {}, kit); }
  function views(kit) { bind(kit); return MV(kit).views; }

  // ---------------------------------------------------------------- live references measured from the model
  // ref.twitch: the force peak of the last single twitch in normal conditions (one shock or
  // command, nothing else within 300 ms, normal bath, ATP on, receptors intact). Scenes 8, 12
  // and 13 compare against it; it is measured, never asserted.
  const ref = { twitch: null, thr: null };
  let lastStimT = -1e9, prevStimT = -1e9, lastMarkT = -1e9;
  function onModelEvent(e) {
    if (e.type === 'shock' || e.type === 'command' || e.type === 'spontaneous_command') {
      if (e.t < lastStimT) { lastStimT = -1e9; prevStimT = -1e9; lastMarkT = -1e9; }   // the model clock was reset
      prevStimT = lastStimT; lastStimT = e.t;
      // stimulus marks on the trace (the first of a burst carries the label)
      const burst = e.t - lastMarkT < 40;
      app.markers.push({ t: e.t, label: burst ? '' : (e.type === 'shock' ? 'shock' : 'command') });
      lastMarkT = e.t;
      if (app.markers.length > 400) app.markers.splice(0, app.markers.length - 400);
    }
    if (e.type === 'twitch_peak') {
      const normal = sim.conc.Ca.out === 2 && sim.conc.Mg.out === 1 && sim.atp === 1 && sim.ryrLeak === 0 && sim.receptor.block === 0 && sim.receptorDensity === 1 && sim.conc.K.out === 4;
