<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuscleSim — From a shock to a twitch</title>
<style>
/* NeuronSim / MuscleSim page styles (shared by index.html and muscle.html). */
:root {
  --bg: #f6f5f0;
  --panel: #ffffff;
  --ink: #1f2430;
  --muted: #5f6675;
  --line: #d9d6cc;
  --accent: #2f6fd6;
  --accent-ink: #ffffff;
  --good: #2f9e5b;
  --bad: #d24b3f;
  --warn: #c98a1b;
  --na: #e8772e;
  --k: #8e5cf0;
  --cl: #3cae6c;
  --ca: #2d8fd5;
  --anion: #8f97a6;
  --nt: #d63c8a;
  --membrane: #2a2f3a;
  --outside: #f2f5fb;
  --inside: #fbf3e6;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  /* Scrolls rather than clipping if the layout is ever taller than the window. */
  display: flex; flex-direction: column; height: 100vh; overflow: auto;
}
header {
  display: flex; align-items: center; gap: 14px; padding: 8px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
header .sub { color: var(--muted); font-size: 13px; }
header .spacer { flex: 1; }
header button, .panel button, .actions button, .lab button {
  font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer;
}
header button:hover, .panel button:hover, .actions button:hover, .lab button:hover { border-color: #b8b4a6; background: #faf9f5; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.primary:hover { background: #2a62bd; }
button:disabled { opacity: .45; cursor: not-allowed; }
header select { font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
#progress { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
#progress button {
  width: 26px; height: 26px; padding: 0; border-radius: 50%; font-size: 12px; color: var(--muted);
  border: 1px solid var(--line); background: #fff;
}
#progress button.done { background: #e2ecfb; border-color: #b9cdf0; color: #2f4f86; }
#progress button.current { background: var(--accent); color: #fff; border-color: var(--accent); }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; padding: 10px 16px 14px; }
#stage-wrap { grid-column: 1; grid-row: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; position: relative; overflow: hidden; min-height: 0; display: flex; flex-direction: column; }
#stage-top { display: flex; align-items: center; gap: 10px; padding: 6px 12px 4px; }
#stage { flex: 1; min-height: 0; width: 100%; display: block; background: var(--bg); }
#stage svg { width: 100%; height: 100%; display: block; }
#stage-caption { flex: 1; font-size: 13px; color: var(--muted); }
#vm-badge { font-size: 13px; font-variant-numeric: tabular-nums; background: #fff; border: 1px solid var(--line); padding: 3px 10px; border-radius: 8px; white-space: nowrap; }
#vm-badge b { font-size: 16px; }
#narrator { margin: 4px 10px 10px; font-size: 14px; line-height: 1.35; background: #fbfaf6; border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: 7px 12px; border-radius: 8px; min-height: 44px; color: var(--ink); }
#narrator:empty { visibility: hidden; }
#narrator b { font-weight: 650; }
/* Each line of commentary is held long enough to read; this marks the moment it changes, and
   shows a caret while further lines are still queued behind it (see pumpNarration in app.js). */
#narrator.fresh { animation: narrator-in .5s ease-out; }
@keyframes narrator-in { from { background: #fff2d4; border-left-color: var(--warn); } to { background: #fbfaf6; border-left-color: var(--accent); } }
#narrator.more::after { content: ' ▾'; color: var(--muted); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { #narrator.fresh { animation: none; } }
#narrator .dir { font-weight: 700; letter-spacing: .3px; }
#paused-badge { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); font-size: 12px; background: #fff3d6; border: 1px solid #ecd9a6; color: #7a5a10; padding: 3px 10px; border-radius: 999px; display: none; }

#panel { grid-column: 2; grid-row: 1 / span 2; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
#panel h2 { margin: 0; font-size: 16px; }
#panel .scene-label { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
#panel .text p { margin: 0 0 8px; }
#panel .text p:last-child { margin-bottom: 0; }
.question { border: 1px solid #cfdcf3; background: #f3f7fe; border-radius: 10px; padding: 10px 12px; }
.question .prompt { font-weight: 600; margin-bottom: 8px; }
.question .options { display: flex; flex-direction: column; gap: 6px; }
.question .options button { text-align: left; }
.question .options button.correct { border-color: var(--good); background: #eaf7ee; }
.question .options button.wrong { border-color: var(--bad); background: #fdeeec; }
.feedback { margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: 14px; }
.feedback.good { background: #eaf7ee; border: 1px solid #bfe3ca; }
.feedback.bad { background: #fdeeec; border: 1px solid #f0c3bd; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.actions button.na { border-color: var(--na); color: #a04d12; }
.actions button.k { border-color: var(--k); color: #5b39a8; }
.actions button.cl { border-color: var(--cl); color: #23724a; }
.actions button.ca { border-color: var(--ca); color: #1c5f92; }
.actions button.held { background: #fff1e6; }
.status { font-size: 13px; color: var(--muted); }
.status.ok { color: var(--good); }
.nav { margin-top: auto; display: flex; gap: 8px; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid var(--line); }
.hint { font-size: 13px; color: var(--muted); }
.ion { display: inline-block; padding: 0 5px; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 600; }
.ion.na { background: var(--na); } .ion.k { background: var(--k); } .ion.cl { background: var(--cl); } .ion.ca { background: var(--ca); } .ion.nt { background: var(--nt); }
/* the phase-by-phase walk through a fast sequence (lessons/muscle.js phaseWalk) */
.status ol.phases { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.status ol.phases li { color: var(--muted); }
.status ol.phases li:last-child { color: var(--ink); }
.status ol.phases li.now { color: var(--ink); background: #fff6e2; border-radius: 5px; padding: 2px 5px; margin-left: -5px; }
kbd.part { background: #eef0f4; border: 1px solid #d6dae2; border-radius: 4px; padding: 0 5px; font: inherit; font-size: 13px; }

#trace-wrap { grid-column: 1; grid-row: 2; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px 6px; }
/* Wraps onto extra lines instead of squeezing the heading into an unreadable sliver. */
#trace-head { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
#trace-title { flex: 1 1 260px; font-weight: 600; color: var(--ink); }
#trace-head label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
#trace { width: 100%; height: 200px; display: block; }
#trace.with-g { height: 250px; }
#trace.with-bands { height: calc(200px + var(--bands, 1) * 50px); }
#trace.with-g.with-bands { height: calc(250px + var(--bands, 1) * 50px); }
.legend { display: inline-flex; gap: 10px; align-items: center; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }

.lab { display: grid; grid-template-columns: 1fr; gap: 8px; }
.lab .row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.lab .row label { flex: 1; }
.lab .row input[type=range] { flex: 2; }
.lab .row .val { width: 62px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.lab h3 { margin: 6px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }

.loop-diagram { display: flex; flex-direction: column; gap: 4px; align-items: stretch; font-size: 13px; }
.loop-diagram .node { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: #fafaf7; text-align: center; transition: background .2s, border-color .2s; }
.loop-diagram .node.hot { background: #fff1e6; border-color: var(--na); font-weight: 600; }
.loop-diagram .arrow { text-align: center; color: var(--muted); line-height: 1; }

@media (max-height: 860px) {
  #trace { height: 170px; }
  #trace.with-g { height: 212px; }
  #trace.with-bands { height: calc(170px + var(--bands, 1) * 42px); }
  #trace.with-g.with-bands { height: calc(212px + var(--bands, 1) * 42px); }
}
@media (max-height: 640px) {
  body { height: auto; min-height: 100vh; }
  main { display: flex; flex-direction: column; }
  #stage-wrap { min-height: 420px; }
}
@media (max-width: 980px) {
  body { height: auto; min-height: 100vh; }
  main { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
  #stage-wrap { grid-column: 1; grid-row: 1; min-height: 340px; }
  #trace-wrap { grid-column: 1; grid-row: 2; }
  #panel { grid-column: 1; grid-row: 3; }
}

/* lab scenario cards (muscle page) */
.card { border: 1px solid var(--line); border-radius: 10px; background: #fafaf7; }
.card .card-head { width: 100%; text-align: left; border: none; background: transparent; padding: 8px 10px; font-size: 14px; cursor: pointer; border-radius: 10px; }
.card .card-head .gate { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-right: 6px; }
.card .card-body { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.card .card-body .feedback.good { font-size: 13px; }
header .sub a { color: var(--accent); text-decoration: none; }
header .sub a:hover { text-decoration: underline; }

</style>
</head>
<body>
<header>
  <div>
    <h1>MuscleSim</h1>
    <div class="sub">From a shock to a twitch · <a href="index.html">Neuron module →</a></div>
  </div>
  <div id="progress" title="Scenes"></div>
  <div class="spacer"></div>
  <label class="sub">Speed
    <select id="speed" title="How much simulated time passes per second of real time">
      <option value="0.0015">1 s = 1.5 ms (slowest)</option>
      <option value="0.003">1 s = 3 ms</option>
      <option value="0.005">1 s = 5 ms</option>
      <option value="0.01" selected>1 s = 10 ms</option>
      <option value="0.02">1 s = 20 ms</option>
      <option value="0.03">1 s = 30 ms</option>
      <option value="0.05">1 s = 50 ms</option>
      <option value="0.1">1 s = 100 ms</option>
      <option value="0.15">1 s = 150 ms</option>
      <option value="0.2">1 s = 200 ms (fastest)</option>
    </select>
  </label>
  <button id="btn-pause" title="Pause / resume the simulation clock (space)">Pause</button>
  <button id="btn-lab" title="Free-play lab with all controls">Lab</button>
</header>

<main>
  <div id="stage-wrap">
    <div id="stage-top">
      <div id="stage-caption"></div>
      <div id="vm-badge"><span id="vm-label">Vm</span> <b id="vm-value">−85.0</b> mV</div>
    </div>
    <div id="stage"></div>
    <div id="paused-badge">Paused — predict first, then continue</div>
    <div id="narrator" aria-live="polite"></div>
  </div>
  <aside id="panel"></aside>
  <div id="trace-wrap">
    <div id="trace-head">
      <span id="trace-title">Membrane potential recorded inside the fibre (end plate)</span>
      <span class="legend" id="trace-legend"></span>
      <span style="flex:1"></span>
      <label><input type="checkbox" id="show-g"> show Na⁺/K⁺ conductance</label>
      <span id="sim-clock" style="font-variant-numeric: tabular-nums">t = 0.0 ms</span>
    </div>
    <canvas id="trace"></canvas>
  </div>
</main>

<script>
/*
 * NeuronSim engine — a small conductance-based model of one neuron.
 *
 * Everything the student sees (ions moving, channels opening, the voltage
 * trace, vesicles fusing) is rendered from the state held here. Nothing in the
 * UI sets a voltage directly.
 *
 * Units: mV, ms, µS (conductance), nF (capacitance), nA (current), mM (concentration),
 *        µM for cytosolic Ca²⁺ inside a terminal.
 *
 * Works both as a browser global (window.NeuronSim) and as a CommonJS module so
 * the biology tests in tests/ run against exactly the same code as the page.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.NeuronSim = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const R = 8.314;      // J/(mol·K)
  const F = 96485;      // C/mol

  /** Nernst equilibrium potential in mV for an ion of valence z. */
  function nernst(z, outside, inside, tempC) {
    const T = 273.15 + (tempC == null ? 37 : tempC);
    return (1000 * R * T) / (z * F) * Math.log(outside / inside);
  }

  function expEuler(x, xinf, tau, dt) {
    return xinf + (x - xinf) * Math.exp(-dt / tau);
  }

  // x / (1 - exp(-x/y)) with the removable singularity handled.
  function vtrap(x, y) {
    return Math.abs(x / y) < 1e-6 ? y * (1 - x / y / 2) : x / (1 - Math.exp(-x / y));
  }

  // Hodgkin–Huxley gating kinetics, shifted so the resting potential is ≈ −70 mV.
  const HH_SHIFT = 0;
  // opts.hShift shifts the inactivation (h) curve only, in mV (negative = inactivates at more
  // negative voltages, as mammalian muscle Na⁺ channels do); opts.phi divides all three time
  // constants (a temperature correction: the squid rates are for 6 °C). Both default to the
  // classic behaviour so the neuron is unchanged.
  function hhRates(V, opts) {
    const v = V + HH_SHIFT;
    const hs = opts && opts.hShift ? opts.hShift : 0;
    const phi = opts && opts.phi ? opts.phi : 1;
    const vh = v - hs;
    const am = 0.1 * vtrap(v + 40, 10), bm = 4 * Math.exp(-(v + 65) / 18);
    const ah = 0.07 * Math.exp(-(vh + 65) / 20), bh = 1 / (1 + Math.exp(-(vh + 35) / 10));
    const an = 0.01 * vtrap(v + 55, 10), bn = 0.125 * Math.exp(-(v + 65) / 80);
    return {
      minf: am / (am + bm), taum: 1 / ((am + bm) * phi),
      hinf: ah / (ah + bh), tauh: 1 / ((ah + bh) * phi),
      ninf: an / (an + bn), taun: 1 / ((an + bn) * phi),
    };
  }

  // Pump off → gradients slowly run down (accelerated for teaching). Shared by both models.
  function pumpRundown(conc, k) {
    if (conc.Na.in < 60) conc.Na.in += k * 6;
    if (conc.K.in > 60) conc.K.in -= k * 6;
    if (conc.K.out < 30) conc.K.out += k * 1.5;
  }

  // ---------------------------------------------------------------------------
  // Default biology (see docs/BIOLOGY.md)
  // ---------------------------------------------------------------------------
  const DEFAULT_CONC = {
    Na: { out: 145, in: 12 },
    K:  { out: 4,   in: 140 },
    Cl: { out: 110, in: 6 },
    Ca: { out: 2,   in: 0.0001 },
  };

  const N_AXON = 12;

  // Areas in µm², channel densities in mS/cm².
  function defaultCompartmentSpecs() {
    const specs = [
      { name: 'dendrite', kind: 'dendrite', area: 2000, gNa: 0,   gK: 0,   gL: 0.1 },
      { name: 'soma',     kind: 'soma',     area: 1250, gNa: 30,  gK: 4,   gL: 0.1 },
      { name: 'hillock',  kind: 'hillock',  area: 250,  gNa: 300, gK: 70, gL: 0.1 },
    ];
    for (let i = 0; i < N_AXON; i++) {
      specs.push({ name: 'axon' + (i + 1), kind: 'axon', index: i, area: 314, gNa: 120, gK: 36, gL: 0.1 });
    }
    specs.push({ name: 'terminal', kind: 'terminal', area: 300, gNa: 120, gK: 36, gL: 0.1, gCa: 20 });
    return specs;
  }

  // Axial conductances (µS) between compartment i and i+1.
  function defaultAxialConductances(n) {
    const g = [];
    for (let i = 0; i < n - 1; i++) {
      if (i === 0) g.push(0.05);        // dendrite–soma (thick)
      else if (i === 1) g.push(0.03);   // soma–hillock
      else if (i === 2) g.push(0.012);  // hillock–axon1
      else g.push(0.008);               // axon–axon (1 µm diameter, 100 µm segments)
    }
    return g;
  }

  // Stereotyped action-potential waveform used to drive *input* terminals
  // (the presynaptic neurons are not simulated in full).
  function templateAP(tSinceSpike) {
    const t = tSinceSpike;
    if (t < 0) return -70;
    if (t < 0.5) return -70 + (40 + 70) * (t / 0.5);            // rise to +40
    if (t < 1.7) return 40 - (40 + 80) * ((t - 0.5) / 1.2);      // fall to −80
    if (t < 5)   return -80 + 10 * ((t - 1.7) / 3.3);            // recover to −70
    return -70;
  }

  // ---------------------------------------------------------------------------
  // Presynaptic terminal: voltage → Ca²⁺ channel → Ca²⁺ → vesicle fusion → transmitter
  // ---------------------------------------------------------------------------
  class Terminal {
    constructor(opts) {
      opts = opts || {};
      this.name = opts.name || 'terminal';
      this.gCa = opts.gCa != null ? opts.gCa : 0.06;   // µS (fully open)
      this.s = 0;               // Ca channel activation (0..1)
      this.ca = 0.1;            // cytosolic Ca²⁺ near the release site (µM)
      this.ca0 = 0.1;
      this.tauCa = 2;           // ms
      this.kCa = 4;             // µM per (nA·ms)
      this.caHalf = 12;         // µM for half-maximal release
      this.kRelease = 0.8;      // /ms (one AP releases roughly half of the docked pool)
      this.vesicles = 1;        // fraction of docked, release-ready vesicles
      this.tauRefill = 5;       // ms (fast restocking so repeated inputs stay similar in size)
      this.nt = 0;              // transmitter in the cleft (arbitrary units)
      this.tauClear = 0.8;      // ms
      this.releaseRate = 0;
      this.iCa = 0;
      this.V = -70;
      this.eCa = 130;
      this.caBlock = 0;         // 0..1 fraction of Ca channels blocked
      this._releasing = false;
    }
    reset() {
      this.s = 0; this.ca = this.ca0; this.vesicles = 1; this.nt = 0;
      this.releaseRate = 0; this.iCa = 0; this.V = -70; this._releasing = false;
    }
    /** Advance by dt at membrane potential V. Returns true when a release burst begins. */
    step(dt, V) {
      this.V = V;
      const sinf = 1 / (1 + Math.exp(-(V + 20) / 6));
      this.s = expEuler(this.s, sinf, 1.0, dt);
      this.iCa = this.gCa * (1 - this.caBlock) * this.s * (V - this.eCa); // nA (negative = inward)
      this.ca += (-this.iCa * this.kCa - (this.ca - this.ca0) / this.tauCa) * dt;
      if (this.ca < 0) this.ca = 0;
      const c4 = Math.pow(this.ca, 4), h4 = Math.pow(this.caHalf, 4);
      this.releaseRate = this.kRelease * (c4 / (c4 + h4)) * this.vesicles;
      const released = this.releaseRate * dt;
      this.vesicles += (-this.releaseRate + (1 - this.vesicles) / this.tauRefill) * dt;
      if (this.vesicles < 0) this.vesicles = 0;
      this.nt += released - (this.nt / this.tauClear) * dt;
      if (this.nt < 0) this.nt = 0;
      const nowReleasing = this.releaseRate > 0.05;
      const started = nowReleasing && !this._releasing;
      this._releasing = nowReleasing;
      return started;
    }
  }

  // ---------------------------------------------------------------------------
  // Postsynaptic receptor: transmitter binding opens a channel with reversal E.
  // ---------------------------------------------------------------------------
  class Receptor {
    constructor(opts) {
      opts = opts || {};
      this.type = opts.type || 'excitatory';
      this.E = opts.E != null ? opts.E : (this.type === 'excitatory' ? 0 : -75);
      this.gmax = opts.gmax != null ? opts.gmax : 0.0025;   // µS
      this.kon = opts.kon != null ? opts.kon : 0.4;         // /(unit·ms) — one release burst opens ~30% of receptors
      this.koff = opts.koff != null ? opts.koff : (this.type === 'excitatory' ? 1 / 18 : 1 / 20);
      this.r = 0;        // fraction of receptor channels open
      this.g = 0;
      this.i = 0;
      this.block = 0;    // 0..1 fraction of receptors blocked (antagonist)
    }
    reset() { this.r = 0; this.g = 0; this.i = 0; }
    step(dt, nt, V) {
      const dr = this.kon * nt * (1 - this.r) - this.koff * this.r;
      this.r += dr * dt;
      if (this.r < 0) this.r = 0; if (this.r > 1) this.r = 1;
      this.g = this.gmax * (1 - this.block) * this.r;
      this.i = this.g * (V - this.E);
    }
  }

  // ---------------------------------------------------------------------------
  // The neuron
  // ---------------------------------------------------------------------------
  class Neuron {
    constructor(opts) {
      opts = opts || {};
      this.tempC = 37;
      this.conc = JSON.parse(JSON.stringify(DEFAULT_CONC));
      this.dt = opts.dt || 0.02;
      this.t = 0;
      this.events = [];
      this.naBlock = 0;   // TTX-like: fraction of voltage-gated Na⁺ channels blocked
      this.kBlock = 0;    // TEA-like: fraction of voltage-gated K⁺ channels blocked
      this.pumpOn = true;
      this.pumpRundownRate = 0; // mM/ms of gradient loss when the pump is off (teaching, accelerated)
      this.manual = { gNa: 0, gK: 0, gCl: 0 };   // µS of manually opened channels on the soma
      this.stim = {};                              // compartment index → nA injected

      const specs = opts.compartments || defaultCompartmentSpecs();
      this.comps = specs.map((s, i) => ({
        index: i, name: s.name, kind: s.kind, area: s.area,
        C: s.area * 1e-5,                     // nF
        gNaMax: (s.gNa || 0) * s.area * 1e-5, // µS
        gKMax: (s.gK || 0) * s.area * 1e-5,

        c.gNa = 0; c.gK = 0; c.iNa = 0; c.iK = 0; c.iL = 0; c.iCl = 0; c.iSyn = 0; c.iAx = 0; c.dVdt = 0;
        c.d = 0; c.dPeak = 0; c.ryr = 0; c.caSR = 1; c.ca = p.caRest; c.tn = 0; c.xb = 0; c.cocked = p.cocked0; c.force = 0;
        c.vPeak = p.rest; c.ryrPeak = 0; c.caPeak = p.caRest; c.tnPeak = 0; c.forcePeak = 0;
        c._spiking = false; c._caHigh = false;
      }
    }

    _rates(V) {
      const p = this.p;
      const shift = this.gatingShift;
      const rNa = hhRates(V - shift, { hShift: p.hShift, phi: p.phi });
      const rK = shift === 0 ? rNa : hhRates(V, { hShift: p.hShift, phi: p.phi });
      return { minf: rNa.minf, taum: rNa.taum, hinf: rNa.hinf, tauh: rNa.tauh, ninf: rK.ninf, taun: rK.taun };
    }

    // ----------------------------------------------------------------- stimulation
    /** Inject `nA` into a segment for `ms`, then stop. */
    pulse(comp, nA, ms) {
      const idx = typeof comp === 'number' ? comp : this.byName[comp].index;
      this.setStim(idx, nA);
      this._pulseComp = idx; this._pulseEnd = this.t + ms;
      this.events.push({ t: this.t, type: 'shock', comp: idx, name: this.comps[idx].name, nA, strength: nA / this.refShockNA });
    }
    setStim(comp, nA) {
      const idx = typeof comp === 'number' ? comp : this.byName[comp].index;
      if (nA) this.stim[idx] = nA; else delete this.stim[idx];
    }
    /** A brief shock of `strength` × the reference threshold current. */
    shock(strength, ms, segment) {
      this.pulse(segment || 'endplate', (strength == null ? 1.5 : strength) * this.refShockNA, ms || 0.5);
    }
    /** Two shocks `intervalMs` apart. */
    pair(intervalMs, strength, segment) {
      this.shock(strength, 0.5, segment);
      this.schedule.push({ t: this.t + intervalMs, kind: 'shock', strength, segment });
    }
    /** `n` shocks at `rateHz`, the first one now. */
    train(rateHz, n, strength, segment) {
      const dtms = 1000 / rateHz;
      for (let i = 0; i < n; i++) this.schedule.push({ t: this.t + i * dtms, kind: 'shock', strength, segment });
    }
    /** Fire the motor nerve once (one action potential into the terminal). */
    command(spontaneous) {
      this.commandT = this.t;
      this.events.push({ t: this.t, type: spontaneous ? 'spontaneous_command' : 'command' });
    }
    commandTrain(rateHz, n) {
      const dtms = 1000 / rateHz;
      for (let i = 0; i < n; i++) this.schedule.push({ t: this.t + i * dtms, kind: 'command' });
    }
    cancelScheduled() { this.schedule = []; }
    /** Clear the per-segment peak records so a lesson step can ask "did this happen since I asked?"
     *  — "did every tubule activate after this shock?", "did the release channels open at all?" —
     *  without its answer depending on which instants the animation happened to sample. */
    resetPeaks() {
      const rest = this.p.rest, caRest = this.p.caRest;
      for (const c of this.comps) { c.dPeak = 0; c.vPeak = rest; c.ryrPeak = 0; c.caPeak = caRest; c.tnPeak = 0; c.forcePeak = 0; }
    }
    /** The classic Ca²⁺-free bath: Ca²⁺ replaced by enough Mg²⁺ to leave Na⁺ channel gating unchanged. */
    setCaFreeBath(on) {
      const p = this.p;
      if (on) { this.conc.Ca.out = 0; this.conc.Mg.out = 1 + DEFAULT_CONC.Ca.out / p.alphaMg; }
      else { this.conc.Ca.out = DEFAULT_CONC.Ca.out; this.conc.Mg.out = 1; }
    }

    /** Shock strength (× reference) that just fires the fibre in its current state. */
    thresholdStrength(segment) {
      const nA = this._findThreshold(0.5, segment);
      return nA / this.refShockNA;
    }
    // Bracketing search on the live object; state is saved and restored around it.
    _findThreshold(ms, segment) {
      const saved = this._snapshot();
      const idx = segment ? this.byName[segment].index : this.p.nSide;
      const fires = (nA) => {
        this._restore(saved);
        this.events = []; this.schedule = []; this.stim = {}; this._pulseEnd = null;
        this.pulse(idx, nA, ms);
        let spiked = false;
        const probe = this.comps[Math.min(this.comps.length - 1, idx + 3)];   // a propagated spike, not the stimulus artefact
        for (let k = 0; k < 10 / this.dt && !spiked; k++) { this._step(this.dt); if (probe.V > -10) spiked = true; }
        return spiked;
      };
      let lo = 0, hi = this.refShockNA > 0 ? this.refShockNA * 4 : 400;
      let tries = 0;
      while (!fires(hi) && tries++ < 6) hi *= 2;              // expand until something fires
      if (tries > 6) { this._restore(saved); return Infinity; }
      for (let i = 0; i < 14; i++) { const mid = (lo + hi) / 2; if (fires(mid)) hi = mid; else lo = mid; }
      this._restore(saved);
      return hi;
    }
    _snapshot() {
      return {
        t: this.t, comps: this.comps.map(c => Object.assign({}, c)), stim: Object.assign({}, this.stim), schedule: this.schedule.slice(),
        events: this.events.slice(), pulseEnd: this._pulseEnd, pulseComp: this._pulseComp,
        term: Object.assign({}, this.terminal), rec: Object.assign({}, this.receptor), nerveV: this.nerveV, commandT: this.commandT,
        conc: JSON.parse(JSON.stringify(this.conc)), force: this.force, heat: this.heat,
        eppMax: this._eppMax, eppArmed: this._eppArmed, forceHist: this._forceHist.slice(), forcePeakArmed: this._forcePeakArmed, forceMax: this._forceMax, fused: this._fused,
      };
    }
    _restore(s) {
      this.t = s.t; this.comps.forEach((c, i) => Object.assign(c, s.comps[i])); this.stim = Object.assign({}, s.stim); this.schedule = s.schedule.slice();
      this.events = s.events.slice(); this._pulseEnd = s.pulseEnd; this._pulseComp = s.pulseComp;
      Object.assign(this.terminal, s.term); Object.assign(this.receptor, s.rec); this.nerveV = s.nerveV; this.commandT = s.commandT;
      this.conc = JSON.parse(JSON.stringify(s.conc)); this.force = s.force; this.heat = s.heat;
      this._eppMax = s.eppMax; this._eppArmed = s.eppArmed; this._forceHist = s.forceHist.slice(); this._forcePeakArmed = s.forcePeakArmed; this._forceMax = s.forceMax; this._fused = s.fused;
    }

    // ----------------------------------------------------------------- time stepping
    advance(ms) {
      const steps = Math.max(1, Math.round(ms / this.dt));
      const dt = ms / steps;
      for (let s = 0; s < steps; s++) this._step(dt);
    }

    _step(dt) {
      const p = this.p, E = this.E, comps = this.comps, n = comps.length;

      // --- housekeeping: pump rundown, timed pulse end, scheduled shocks/commands
      if (!this.pumpOn && this.pumpRundownRate > 0) pumpRundown(this.conc, this.pumpRundownRate * dt);
      if (this._pulseEnd != null && this.t >= this._pulseEnd) { this.setStim(this._pulseComp, 0); this._pulseEnd = null; }
      if (this.schedule.length) {
        const due = this.schedule.filter(s => s.t <= this.t + 1e-9);
        if (due.length) {
          this.schedule = this.schedule.filter(s => s.t > this.t + 1e-9);
          for (const s of due) { if (s.kind === 'shock') this.shock(s.strength, 0.5, s.segment); else this.command(); }
        }
      }
      // the black-box nerve fires on its own when extracellular Ca²⁺/Mg²⁺ is low
      if (this.nerveEnabled) {
        const rate = this.spontaneousRate;
        if (rate > 0 && Math.random() < rate * dt / 1000) this.command(true);
      }
      // succinylcholine lets K⁺ out of the fibres (accelerated, capped)
      this._agonistNow = expEuler(this._agonistNow, this.agonist, p.tauAgonist, dt);
      if (this._agonistNow > 0.05 && this.conc.K.out < 5.5) this.conc.K.out += 0.0008 * dt;
      if (this.atpDecline > 0 && this.atp > 0) this.atp = Math.max(0, this.atp - this.atpDecline * dt);

      // --- neuromuscular junction
      this.nerveV = this.commandT == null ? p.rest : templateAP(this.t - this.commandT);
      this.terminal.gCa = this._gCa0 * this.terminalCaFactor * (1 - this.caEntryBlock);
      this.terminal.tauClear = 1 / (this.acheActivity / p.tauAChE + 1 / p.tauDiff);
      this.terminal.kRelease = p.kRelease * (1 - this.releaseBlock);
      const started = this.terminal.step(dt, this.nerveV);
      if (started) this.events.push({ t: this.t, type: 'release' });
      const ep = comps[p.nSide];
      this.receptor.gmax = p.receptorGmax * this.receptorDensity;
      this.receptor.step(dt, this.terminal.nt + this._agonistNow, ep.V);

      // --- membrane (exponential Euler, explicit axial coupling)
      const Vold = comps.map(c => c.V);
      for (let i = 0; i < n; i++) {
        const c = comps[i], V = c.V;
        const r = this._rates(V);
        c.m = expEuler(c.m, r.minf, r.taum, dt);
        c.h = expEuler(c.h, r.hinf, r.tauh, dt);
        c.n = expEuler(c.n, r.ninf, r.taun, dt);
        c.gNa = c.gNaMax * (1 - this.naBlock) * c.m * c.m * c.m * c.h;
        c.gK = c.gKMax * (1 - this.kBlock) * c.n * c.n * c.n * c.n;
        let gsum = c.gNa + c.gK + c.gKLeak + c.gNaLeak;
        let gE = c.gNa * E.Na + c.gK * E.K + c.gKLeak * E.K + c.gNaLeak * E.Na;
        let iSyn = 0;
        if (c.kind === 'endplate') {
          gsum += this.manual.gNa + this.manual.gK + this.manual.gCl;
          gE += this.manual.gNa * E.Na + this.manual.gK * E.K + this.manual.gCl * E.Cl;
          gsum += this.receptor.g; gE += this.receptor.g * this.receptor.E;
          iSyn = this.receptor.g * (V - this.receptor.E);
        }
        let iAx = 0;
        if (i > 0) { const g = this.gAxial[i - 1]; gsum += g; gE += g * Vold[i - 1]; iAx += g * (Vold[i - 1] - V); }
        if (i < n - 1) { const g = this.gAxial[i]; gsum += g; gE += g * Vold[i + 1]; iAx += g * (Vold[i + 1] - V); }
        const inj = this.stim[i] || 0;
        const Vinf = (gE + inj) / gsum;
        const Vnew = Vinf + (V - Vinf) * Math.exp(-gsum * dt / c.C);
        const man = c.kind === 'endplate' ? this.manual : null;
        c.iNa = (c.gNa + c.gNaLeak + (man ? man.gNa : 0)) * (V - E.Na);
        c.iK = (c.gK + c.gKLeak + (man ? man.gK : 0)) * (V - E.K);
        c.iL = c.gKLeak * (V - E.K) + c.gNaLeak * (V - E.Na);
        c.iCl = man ? man.gCl * (V - E.Cl) : 0;
        c.iSyn = iSyn; c.iAx = iAx;
        c.dVdt = (Vnew - V) / dt;
        c.V = Vnew;
        if (!c._spiking && Vnew > -10 && V <= -10) { c._spiking = true; this.events.push({ t: this.t, type: 'spike', comp: i, name: c.name }); }
        else if (c._spiking && Vnew < -30) c._spiking = false;

        // --- excitation–contraction coupling
        const dinf = 1 / (1 + Math.exp(-(Vnew - p.dHalf) / p.dSlope));
        c.d = expEuler(c.d, dinf, p.tauD, dt);
        if (c.d > c.dPeak) c.dPeak = c.d;               // frame-independent record for the lesson (see resetPeaks)
        if (c.V > c.vPeak) c.vPeak = c.V;
        c.ryr = clamp(c.d * (1 - 0.7 * this.dantrolene) + this.ryrLeak * (1 - this.dantrolene), 0, 1);
        if (c.ryr > c.ryrPeak) c.ryrPeak = c.ryr;
        const rel = p.kRel * c.ryr * c.caSR;                 // store units / ms
        const uptake = p.vSerca * c.ca * c.ca / (c.ca * c.ca + p.kSerca * p.kSerca) * this.atp;   // µM/ms
        c.caSR += (-rel + uptake / p.sigma) * dt;
        c.caSR = clamp(c.caSR, 0, 1);
        c.ca += (p.sigma * rel - uptake) * dt;
        if (c.ca < p.caRest) c.ca += (p.caRest - c.ca) * (1 - Math.exp(-dt / 5));   // resting leak keeps the floor
        if (c.ca > c.caPeak) c.caPeak = c.ca;
        if (!c._caHigh && c.ca > 1) { c._caHigh = true; this.events.push({ t: this.t, type: 'ca_release', comp: i, name: c.name }); }
        else if (c._caHigh && c.ca < 0.5) c._caHigh = false;
        c.tn += (p.tnKon * c.ca * (1 - c.tn) - p.tnKoff * c.tn) * dt;
        c.tn = clamp(c.tn, 0, 1);
        if (c.tn > c.tnPeak) c.tnPeak = c.tn;
        const attach = p.xbKon * c.tn * c.tn * c.cocked * (1 - c.xb);
        const detach = p.xbKoff * this.atp * c.xb;
        c.xb += (attach - detach) * dt;
        c.cocked += ((p.cocked0 - c.cocked) / p.tauCock * this.atp - attach) * dt;
        c.cocked = clamp(c.cocked, 0, 1); c.xb = clamp(c.xb, 0, 1);
        c.force = expEuler(c.force, c.xb, p.tauForce, dt);
        if (c.force > c.forcePeak) c.forcePeak = c.force;
      }

      // --- whole-fibre readouts and events
      // normalize: subtract the resting floor, scale so a fused tetanus reads ≈ 1; rigor locks just above it
      const xbMax = p.xbKon * p.cocked0 / (p.xbKon * p.cocked0 + p.xbKoff);
      const tnRest = p.tnKon * p.caRest / (p.tnKon * p.caRest + p.tnKoff);
      const xbFloor = p.xbKon * tnRest * tnRest * p.cocked0 / (p.xbKon * tnRest * tnRest * p.cocked0 + p.xbKoff);
      let fsum = 0; for (const c of comps) fsum += c.force;
      this.force = clamp((fsum / n - xbFloor) / (xbMax - xbFloor) / p.forceNorm, 0, 1.05);
      this.heat += (this.force * 0.02 - this.heat * 0.002) * dt;
      // end-plate potential peak: the end plate's voltage passing its maximum while the receptors are open
      const g = this.receptor.g;
      if (g > 0.05 * this.receptor.gmax) { if (!this._eppArmed) { this._eppArmed = true; this._eppMax = ep.V; } }
      if (this._eppArmed) {
        if (ep.V > this._eppMax) this._eppMax = ep.V;
        else if (ep.V < this._eppMax - 0.3) { this._eppArmed = false; this.events.push({ t: this.t, type: 'epp_peak', V: this._eppMax }); }
        if (g < 0.01 * this.receptor.gmax) this._eppArmed = false;
      }
      // twitch peak / relaxed
      const F = this.force;
      if (F > this._forceMax) { this._forceMax = F; if (F > 0.05) this._forcePeakArmed = true; }
      else if (this._forcePeakArmed && F < this._forceMax * 0.97) { this._forcePeakArmed = false; this.events.push({ t: this.t, type: 'twitch_peak', force: this._forceMax }); this._wasContracting = true; }
      if (F < 0.02) { if (this._wasContracting) { this._wasContracting = false; this.events.push({ t: this.t, type: 'relaxed' }); } this._forceMax = 0; }
      if (this._forceMax > 0 && F < this._forceMax * 0.9) this._forceMax = F > 0.02 ? Math.max(F, 0) : 0; // re-arm after a partial relaxation
      // fused tetanus: force high and steady over the last 60 ms
      this._forceHist.push({ t: this.t, F });
      while (this._forceHist.length && this._forceHist[0].t < this.t - 60) this._forceHist.shift();
      if (this._forceHist.length > 10) {
        let mn = Infinity, mx = -Infinity; for (const s of this._forceHist) { if (s.F < mn) mn = s.F; if (s.F > mx) mx = s.F; }
        const fused = mx > 0.6 && mn > 0.9 * mx;
        if (fused && !this._fused) this.events.push({ t: this.t, type: 'tetanus_fused', force: mx });
        this._fused = fused;
      }
      this.t += dt;
    }

    takeEvents() { const e = this.events; this.events = []; return e; }

    // ----------------------------------------------------------------- helpers for the renderer / lesson
    naState(c) {
      if (c.h < 0.25) return 'inactivated';
      if (c.m * c.m * c.m * c.h > 0.08) return 'open';
      return 'closed';
    }
    kState(c) { return c.n * c.n * c.n * c.n > 0.25 ? 'open' : 'closed'; }
    caState(term) { return term.s > 0.3 ? 'open' : 'closed'; }
    sensorState(c) { return c.d > 0.3 ? 'active' : 'resting'; }
    ryrState(c) { return c.ryr > 0.3 ? 'open' : 'closed'; }
    troponinState(c) { return c.tn > 0.4 ? 'bound' : 'free'; }
    bridgeState(c) { return c.xb > 0.15 ? 'attached' : 'detached'; }
    receptorState() { return this.receptor.r > 0.06 ? 'open' : 'closed'; }
    get endplate() { return this.byName.endplate; }
    get end() { return this.byName.end; }
    get srLevel() { let s = 0; for (const c of this.comps) s += c.caSR; return s / this.comps.length; }
    get ca() { let s = 0; for (const c of this.comps) s += c.ca; return s / this.comps.length; }
    get isFused() { return this._fused; }
    /** Scalar series for the trace bands. */
    sampleExtras() { return { ca: this.ca, force: this.force, sr: this.srLevel, nerve: this.nerveV, epp: this.receptor.g }; }
  }

  return { MuscleFibre, DEFAULTS };
});

</script>
<script>
/*
 * SimApp: page-agnostic renderer + lesson engine (see docs/APP_API.md).
 *
 * Nothing here knows which cell it is drawing. A page supplies a model (the simulation), a
 * profile (landmarks and words), a whole-cell drawing, extra views, the lesson and the lab:
 *
 *   window.__neuronsim = SimApp.init({ model, profile, drawCell, views, lesson, lab });
 *
 * The generic parts kept here: utilities and drawing helpers, the membrane view, the trace,
 * the step runner (questions, activities, navigation), the lab shell and the frame loop.
 * Classic script (no modules) so the pages open from file://.
 */
(function () {
  'use strict';

  // =========================================================================
  // Utilities
  // =========================================================================
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const $ = (sel) => document.querySelector(sel);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);

  function svgEl(tag, attrs, parent) {
    const e = document.createElementNS(SVG_NS, tag);
    if (attrs) for (const k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    }
    if (parent) parent.appendChild(e);
    return e;
  }
  function setAttrs(e, attrs) { for (const k in attrs) e.setAttribute(k, attrs[k]); }
  function htmlEl(tag, attrs, html) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) { if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    if (html != null) e.innerHTML = html;
    return e;
  }

  const ION_COLOR = { Na: '#e8772e', K: '#8e5cf0', Cl: '#3cae6c', Ca: '#2d8fd5', A: '#8f97a6', NT: '#d63c8a' };
  const ION_LABEL = { Na: 'Na⁺', K: 'K⁺', Cl: 'Cl⁻', Ca: 'Ca²⁺', A: 'A⁻', NT: '' };

  function fmtV(V) { return (V < 0 ? '−' : '+') + Math.abs(V).toFixed(1); }
  // A landmark voltage as a signed integer ("+67", "−70") for labels and copy.
  function fmtE(V) { return (V < 0 ? '−' : '+') + Math.abs(Math.round(V)); }

  // Channel catalogue for drawChannel / the membrane view. A page may add entries
  // (Object.assign(kit.CH, {...})); an entry may carry current(c, V, E, sim) and state(c, sim)
  // so the membrane view can animate channel types this file does not know about.
  const CH = {
    Na_leak: { color: ION_COLOR.Na, label: 'Na⁺ leak', ion: 'Na', dir: -1 },
    K_leak: { color: ION_COLOR.K, label: 'K⁺ leak', ion: 'K', dir: 1 },
    Na_v: { color: ION_COLOR.Na, label: 'voltage-gated Na⁺', ion: 'Na', dir: -1, gated: true },
    K_v: { color: ION_COLOR.K, label: 'voltage-gated K⁺', ion: 'K', dir: 1, gated: true },
    Ca_v: { color: ION_COLOR.Ca, label: 'voltage-gated Ca²⁺', ion: 'Ca', dir: -1, gated: true },
    Na_manual: { color: ION_COLOR.Na, label: 'Na⁺ channel (yours)', ion: 'Na', dir: -1 },
    K_manual: { color: ION_COLOR.K, label: 'K⁺ channel (yours)', ion: 'K', dir: 1 },
    Cl_manual: { color: ION_COLOR.Cl, label: 'Cl⁻ channel (yours)', ion: 'Cl', dir: -1 },
    AMPA: { color: ION_COLOR.Na, label: 'excitatory receptor (cation channel)', ion: 'Na', dir: -1, receptor: true },
    GABA: { color: ION_COLOR.Cl, label: 'inhibitory receptor (Cl⁻ channel)', ion: 'Cl', dir: -1, receptor: true },
    pump: { color: '#6b7280', label: 'Na⁺/K⁺ pump (ATP)' },
  };

  function drawChannel(parent, x, yTop, yBot, type, scale) {
    scale = scale || 1;
    const spec = CH[type];
    const g = svgEl('g', { transform: `translate(${x},0)` }, parent);
    const w = 16 * scale, gap = 6 * scale, h = yBot - yTop, ymid = (yTop + yBot) / 2;
    if (type === 'pump') {
      svgEl('rect', { x: -26 * scale, y: yTop - 2, width: 52 * scale, height: h + 4, rx: 8 * scale, fill: '#e5e7eb', stroke: '#374151', 'stroke-width': 2 }, g);
      svgEl('text', { x: 0, y: ymid + 4 * scale, 'font-size': 11 * scale, 'font-weight': 700, 'text-anchor': 'middle', fill: '#374151', text: 'ATP' }, g);
      const na = svgEl('g', {}, g), k = svgEl('g', {}, g);
      return { g, spec, pumpNa: na, pumpK: k, x, yTop, yBot };
    }
    const left = svgEl('rect', { x: -gap - w, y: yTop - 2, width: w, height: h + 4, rx: 5 * scale, fill: '#fff', stroke: spec.color, 'stroke-width': 2.5 }, g);
    const right = svgEl('rect', { x: gap, y: yTop - 2, width: w, height: h + 4, rx: 5 * scale, fill: '#fff', stroke: spec.color, 'stroke-width': 2.5 }, g);
    const gate = svgEl('rect', { x: -gap - 1, y: ymid - 7 * scale, width: 2 * gap + 2, height: 14 * scale, fill: spec.color, opacity: 0.9 }, g);
    const ball = svgEl('circle', { cx: 0, cy: yBot - 6 * scale, r: 7 * scale, fill: '#374151', opacity: 0 }, g);
    if (spec.gated) svgEl('text', { x: 0, y: yTop - 6 * scale, 'font-size': 9 * scale, 'text-anchor': 'middle', fill: spec.color, 'font-weight': 700, text: 'V' }, g);
    if (spec.receptor) {
      // binding site cups on the outside face
      svgEl('path', { d: `M${-gap - w},${yTop - 2} l-4,-8 M${gap + w},${yTop - 2} l4,-8`, stroke: spec.color, 'stroke-width': 2.5, fill: 'none' }, g);
    }
    return { g, spec, left, right, gate, ball, x, yTop, yBot, state: 'closed' };
  }
  function setChannelState(ch, state) {
    if (ch.state === state || !ch.gate) return;
    ch.state = state;
    if (state === 'open') { ch.gate.setAttribute('opacity', 0); ch.ball.setAttribute('opacity', 0); ch.left.setAttribute('fill', '#fff'); }
    else if (state === 'inactivated') { ch.gate.setAttribute('opacity', 0); ch.ball.setAttribute('opacity', 1); ch.left.setAttribute('fill', '#fff'); }
    else { ch.gate.setAttribute('opacity', 0.9); ch.ball.setAttribute('opacity', 0); }
  }

  // Ion pools (background) and flux particles.
  function makeIonPool(parent, region, counts, opts) {
    opts = opts || {};
    const ions = [];
    for (const ion in counts) {
      for (let i = 0; i < counts[ion]; i++) {
        const x = rand(region.x0 + 10, region.x1 - 10), y = rand(region.y0 + 10, region.y1 - 10);
        const g = svgEl('g', { transform: `translate(${x},${y})` }, parent);
        svgEl('circle', { r: opts.r || 8, fill: ION_COLOR[ion], opacity: 0.9 }, g);
        svgEl('text', { y: 3, 'font-size': (opts.r || 8) * 1.05, 'text-anchor': 'middle', fill: '#fff', 'font-weight': 700, text: ION_LABEL[ion] }, g);
        ions.push({ g, ion, x, y, vx: 0, vy: 0 });
      }
    }
    return {
      ions,
      update(dtReal) {
        const k = dtReal / 16;
        for (const p of ions) {
          p.vx = p.vx * 0.9 + rand(-0.6, 0.6); p.vy = p.vy * 0.9 + rand(-0.6, 0.6);
          p.x = clamp(p.x + p.vx * k, region.x0 + 8, region.x1 - 8); p.y = clamp(p.y + p.vy * k, region.y0 + 8, region.y1 - 8);
          p.g.setAttribute('transform', `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
        }
      },
    };
  }

  function makeParticles(parent) {
    const list = [];
    return {
      spawn(ion, x0, y0, x1, y1, duration, opts) {
        opts = opts || {};
        const g = svgEl('g', { transform: `translate(${x0},${y0})`, 'pointer-events': 'none' }, parent);
        svgEl('circle', { r: opts.r || 8, fill: ION_COLOR[ion], stroke: '#fff', 'stroke-width': 1.5 }, g);
        if (ION_LABEL[ion]) svgEl('text', { y: 3, 'font-size': 8.5, 'text-anchor': 'middle', fill: '#fff', 'font-weight': 700, text: ION_LABEL[ion] }, g);
        list.push({ g, x0, y0, x1, y1, t: 0, duration: duration || 700, linger: opts.linger != null ? opts.linger : 500, wobble: opts.wobble || 0 });
      },
      update(dtReal) {
        for (let i = list.length - 1; i >= 0; i--) {
          const p = list[i]; p.t += dtReal;
          const u = clamp(p.t / p.duration, 0, 1), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
          const x = lerp(p.x0, p.x1, e) + (p.wobble ? Math.sin(p.t / 60) * p.wobble * (1 - u) : 0), y = lerp(p.y0, p.y1, e);
          p.g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
          if (p.t > p.duration) {
            const f = 1 - (p.t - p.duration) / p.linger;
            p.g.setAttribute('opacity', clamp(f, 0, 1));
            if (f <= 0) { p.g.remove(); list.splice(i, 1); }
          }
        }
      },
      clear() { for (const p of list) p.g.remove(); list.length = 0; },
      get count() { return list.length; },
    };
  }

  // A flux accumulator: turns current (nA) × simulated time into discrete particles.
  function fluxCounter(scale) {
    let acc = 0;
    return (current_nA, dtSim) => {
      acc += Math.abs(current_nA) * dtSim * scale;
      let n = 0;
      while (acc >= 1 && n < 6) { acc -= 1; n++; }
      if (acc > 6) acc = 6;
      return n;
    };
  }

  // Option order for a multiple-choice question. Lessons are written with the correct answer
  // first, which is easy to author and impossible to miss as a student, so the order is permuted
  // here instead. The permutation is derived from the question's own text: it is unpredictable
  // but the same every time that question appears, so going back to a question (or discussing it
  // with the class) does not reshuffle it. Set `keepOrder: true` on a question whose options read
  // as a sequence.
  function questionOrder(q) {
    if (q._order) return q._order;
    const n = q.options.length;
    const idx = q.options.map((_, i) => i);
    if (!q.keepOrder && n > 1) {
      let h = 2166136261;
      const seed = String(q.prompt || '') + q.options.map(o => o.t).join('|');
      for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
      const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; h |= 0; return (h >>> 0) / 4294967296; };
      for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
    }
    q._order = idx;
    return idx;
  }

  function drawBilayer(parent, x0, x1, yTop, yBot, holes, scale) {
    // two rows of phospholipid heads with tails; `holes` = list of [xa, xb] to leave empty
    scale = scale || 1;
    const g = svgEl('g', {}, parent);
    svgEl('rect', { x: x0, y: yTop, width: x1 - x0, height: yBot - yTop, fill: '#f0ead8' }, g);
    const step = 14 * scale, r = 6 * scale, tail = 12 * scale;
    for (let x = x0 + step / 2; x < x1; x += step) {
      if (holes.some(([a, b]) => x > a && x < b)) continue;
      for (const [cy, dir] of [[yTop + r + 1, 1], [yBot - r - 1, -1]]) {
        svgEl('circle', { cx: x, cy, r, fill: '#c9b98f', stroke: '#8a7a50', 'stroke-width': 1 }, g);
        svgEl('path', { d: `M${x - r / 2},${cy + dir * r} l0,${dir * tail} M${x + r / 2},${cy + dir * r} l0,${dir * tail}`, stroke: '#8a7a50', 'stroke-width': 1.5, fill: 'none' }, g);
      }
    }
    return g;
  }

  function drawChargeRow(parent, x0, x1, y, sign, color, size) {
    size = size || 18;
    const g = svgEl('g', { 'font-size': size, 'font-weight': 700, fill: color, 'text-anchor': 'middle', 'pointer-events': 'none' }, parent);
    for (let x = x0 + 20; x < x1; x += size * 2.6) svgEl('text', { x, y, text: sign }, g);

  // ---------------------------------------------------------------- narration helpers
  const chip = (k) => `<span class="ion ${k.toLowerCase()}">${ION_LABEL[k]}</span>`;
  const IN = '<span class="dir">IN</span>', OUT = '<span class="dir">OUT</span>';
  const I = chip;
  const FB_GRADIENT = 'Ions move down their concentration gradient (from where they are concentrated to where they are scarce) and toward the side whose charge attracts them.';
  function spikeIn(events, name) { return events.some(e => e.type === 'spike' && e.name === name); }
  function anySpike(events) { return events.some(e => e.type === 'spike'); }

  const LOOP_HTML = `<div class="loop-diagram">
      <div class="node" data-loop="depol">membrane depolarizes</div><div class="arrow">↓</div>
      <div class="node" data-loop="open">voltage-gated Na⁺ channels open</div><div class="arrow">↓</div>
      <div class="node" data-loop="in">Na⁺ rushes in</div><div class="arrow">↓ (and back to the top)</div>
      <div class="node" data-loop="more">more depolarization → more Na⁺ channels open</div>
    </div>`;

  // Step keys inherited by later steps of the same scene (see gotoStep).
  const STEP_KEYS = ['view', 'viewOpts', 'record', 'electrode', 'labels', 'showG', 'gComp', 'extra', 'speed', 'bands', 'historyMs', 'window'];

  // =========================================================================
  // init(config): build the app for one page
  // =========================================================================
  function init(config) {
    const sim = config.model;

    // Voltage → colour (blue = hyperpolarized, slate = rest, orange/red = depolarized), relative to rest.
    const V_STOPS = [[REST - 25, [59, 111, 214]], [REST, [125, 138, 165]], [REST + 15, [190, 165, 110]], [REST + 50, [240, 160, 48]], [REST + 115, [229, 72, 46]]];
    function vColor(V) {
      V = clamp(V, REST - 25, REST + 115);
      for (let i = 0; i < V_STOPS.length - 1; i++) {
        const [v0, c0] = V_STOPS[i], [v1, c1] = V_STOPS[i + 1];
        if (V <= v1) {
          const t = (V - v0) / (v1 - v0);
          return `rgb(${Math.round(lerp(c0[0], c1[0], t))},${Math.round(lerp(c0[1], c1[1], t))},${Math.round(lerp(c0[2], c1[2], t))})`;

      return `rgb(${Math.round(lerp(base[0], target[0], f))},${Math.round(lerp(base[1], target[1], f))},${Math.round(lerp(base[2], target[2], f))})`;

    // =======================================================================

    // =======================================================================
    const app = {

    // ---------------------------------------------------------------- whole-cell inset

    function drawInset(parent, region) {

      const g = svgEl('g', { transform: fr.transform }, parent);

    // Voltage ladder: where Vm is, and who is pulling it (Na⁺ up toward E_Na, K⁺ down toward E_K).
    function drawLadder(parent, x, y) {
      const g = svgEl('g', { transform: `translate(${x},${y})`, 'font-size': 12.5, fill: '#3a3f4a' }, parent);
      const H = 196, yOf = (V) => H - (clamp(V, -100, 70) + 100) * (H / 170);

      svgEl('rect', { x: 0, y: 0, width: 14, height: H, rx: 4, fill: '#e9e6dc', stroke: '#c9c4b4' }, g);

      };

        tk.V = V; tk.line.setAttribute('y1', yOf(V)); tk.line.setAttribute('y2', yOf(V)); tk.text.setAttribute('y', yOf(V) + 4); tk.text.textContent = label;
      };
      const E0 = sim.E;

      tick(0, '0 mV', '#6b7280', 'zero');

      const naArrow = svgEl('path', { d: '', stroke: ION_COLOR.Na, 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round' }, g);
      const naHead = svgEl('path', { d: '', fill: ION_COLOR.Na }, g);
      const kArrow = svgEl('path', { d: '', stroke: ION_COLOR.K, 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round' }, g);
      const kHead = svgEl('path', { d: '', fill: ION_COLOR.K }, g);
      const pointer = svgEl('path', { d: '', fill: '#1f2430' }, g);
      const pline = svgEl('line', { x1: 0, y1: 0, x2: 14, y2: 0, stroke: '#1f2430', 'stroke-width': 3 }, g);
      const ptext = svgEl('text', { x: -8, y: 0, 'text-anchor': 'end', 'font-weight': 700, 'font-size': 14, fill: '#1f2430', text: '' }, g);
      return {
        update(V, gNaPull, gKPull) {

          pointer.setAttribute('d', `M-8,${y} l-7,-5 l0,10 z`);
          ptext.setAttribute('y', y + 4); ptext.textContent = fmtV(V);
          const na = Math.min(y - 8, gNaPull * 104), k = Math.min(H - y - 8, gKPull * 104);

          naHead.setAttribute('d', na > 3 ? `M7,${y - na - 7} l-6,8 l12,0 z` : '');
          kArrow.setAttribute('d', k > 3 ? `M7,${y + 2} L7,${y + k}` : '');
          kHead.setAttribute('d', k > 3 ? `M7,${y + k + 7} l-6,-8 l12,0 z` : '');
          thr.setAttribute('opacity', app.showThreshold ? 1 : 0);

    }

    // Compact concentration / Nernst table.
    function drawConcTable(parent, x, y) {
      const lg = svgEl('g', { transform: `translate(${x},${y})`, 'font-size': 12.5, fill: '#3a3f4a' }, parent);
      svgEl('text', { x: 0, y: 0, 'font-weight': 700, 'font-size': 14, text: 'Concentrations (mM)' }, lg);
      svgEl('text', { x: 66, y: 20, 'font-weight': 700, text: 'out' }, lg); svgEl('text', { x: 114, y: 20, 'font-weight': 700, text: 'in' }, lg); svgEl('text', { x: 162, y: 20, 'font-weight': 700, text: 'E (mV)' }, lg);
      const rows = [['Na', 'Na⁺'], ['K', 'K⁺'], ['Cl', 'Cl⁻'], ['Ca', 'Ca²⁺']].filter(([k]) => sim.conc[k]).map(([k, lab], i) => {
        const yy = 40 + i * 19;

      });

    // ---------------------------------------------------------------- membrane strip (generic)
    // opts: { comp, channels: ['K_leak', ...], inset, ions: {outside:{}, inside:{}}, caption }
    views.membrane = function (opts) {
      // A thicker membrane in a wider strip: the channels and their labels are what students
      // are reading here, so the strip takes the space and the side panels are pushed right.
      const X0 = 18, X1 = 644, Y_TOP = 212, Y_BOT = 300, CH_SCALE = 1.3;
      let svg, chans = [], pool, particles, chargePlus, chargeMinus, chargeFlipPlus, chargeFlipMinus, insideRect, inset, electrodeTip, pumpPhase = 0, ladder, table;
      const counters = [], typeCount = {};
      const comp = () => sim.byName[opts.comp || profile.comp];
      const channelTypes = opts.channels || ['K_leak', 'Na_leak', 'pump'];
      channelTypes.forEach(t => { typeCount[t] = (typeCount[t] || 0) + 1; });
      const isManualComp = (c) => c.name === profile.comp;
      function layout() {
        const n = channelTypes.length, spanX0 = X0 + 76, spanX1 = X1 - 78;
        return channelTypes.map((t, i) => n === 1 ? (spanX0 + spanX1) / 2 : lerp(spanX0, spanX1, i / (n - 1)));
      }
      // current through one drawn channel of a given type (nA; negative = inward)
      function channelCurrent(t, c, V, E) {
        const share = 1 / typeCount[t];
        const spec = CH[t];
        if (spec && spec.current) return spec.current(c, V, E, sim) * share;
        if (t === 'K_leak') return c.gKLeak * (V - E.K) * share;
        if (t === 'Na_leak') return c.gNaLeak * (V - E.Na) * share;
        if (t === 'Na_v') return c.gNa * (V - E.Na) * share;
        if (t === 'K_v') return c.gK * (V - E.K) * share;
        if (t === 'Na_manual') return sim.manual.gNa * (V - E.Na);
        if (t === 'K_manual') return sim.manual.gK * (V - E.K);
        if (t === 'Cl_manual') return sim.manual.gCl * (V - E.Cl);
        if (t === 'Ca_v') return sim.terminal ? sim.terminal.iCa : 0;
        return 0;
      }
      function channelState(t, c) {
        const spec = CH[t];
        if (spec && spec.state) return spec.state(c, sim);
        if (t === 'K_leak' || t === 'Na_leak') return 'open';
        if (t === 'Na_v') return sim.naState(c);
        if (t === 'K_v') return sim.kState(c);
        if (t === 'Na_manual') return sim.manual.gNa > 0 ? 'open' : 'closed';
        if (t === 'K_manual') return sim.manual.gK > 0 ? 'open' : 'closed';
        if (t === 'Cl_manual') return sim.manual.gCl > 0 ? 'open' : 'closed';
        if (t === 'Ca_v') return sim.terminal ? sim.caState(sim.terminal) : 'closed';
        return 'closed';
      }
      return {
        mount(el) {
          svg = svgEl('svg', { viewBox: '0 0 900 520' });
          el.appendChild(svg);
          svgEl('rect', { x: 0, y: 0, width: 900, height: 520, fill: '#f6f5f0' }, svg);
          svgEl('rect', { x: X0, y: 20, width: X1 - X0, height: Y_TOP - 20, fill: '#eef2fa', rx: 10 }, svg);
          insideRect = svgEl('rect', { x: X0, y: Y_BOT, width: X1 - X0, height: 500 - Y_BOT, fill: '#fbf3e6', rx: 10 }, svg);
          svgEl('text', { x: X0 + 12, y: 42, 'font-size': 16, fill: '#4a5468', 'font-weight': 600, text: 'OUTSIDE the cell' }, svg);
          svgEl('text', { x: X0 + 12, y: 494, 'font-size': 16, fill: '#6b5a3a', 'font-weight': 600, text: 'INSIDE the cell' }, svg);
          const xs = layout();
          const hole = 28 * CH_SCALE + 5;
          drawBilayer(svg, X0, X1, Y_TOP, Y_BOT, xs.map(x => [x - hole, x + hole]), CH_SCALE);
          const chLayer = svgEl('g', {}, svg);
          const dense = channelTypes.length > 5;
          chans = channelTypes.map((t, i) => {
            const ch = drawChannel(chLayer, xs[i], Y_TOP, Y_BOT, t, CH_SCALE);
            const label = dense ? CH[t].label.replace('voltage-gated ', 'V-gated ').replace(' (yours)', '') : CH[t].label;
            svgEl('text', { x: xs[i], y: Y_BOT + 24 + (dense && i % 2 ? 16 : 0), 'font-size': dense ? 12 : 14, 'text-anchor': 'middle', fill: '#4a4f5a', text: label }, chLayer);
            counters.push(fluxCounter(t.endsWith('leak') ? 9 : (t === 'pump' ? 0 : 2.2)));
            return ch;
          });
          chargePlus = drawChargeRow(svg, X0, X1, Y_TOP - 14, '+', '#b45309', 21);
          chargeMinus = drawChargeRow(svg, X0, X1, Y_BOT + 52, '−', '#1d4ed8', 21);
          chargeFlipPlus = drawChargeRow(svg, X0, X1, Y_BOT + 52, '+', '#b45309', 21);
          chargeFlipMinus = drawChargeRow(svg, X0, X1, Y_TOP - 14, '−', '#1d4ed8', 21);
          const ionLayer = svgEl('g', {}, svg);
          const ions = opts.ions || {};
          const out = Object.assign({ Na: 22, K: 3, Cl: 14, Ca: 6 }, ions.outside || {});
          const inn = Object.assign({ K: 22, Na: 3, Cl: 2, A: 14 }, ions.inside || {});
          pool = { outside: makeIonPool(ionLayer, { x0: X0, x1: X1, y0: 52, y1: Y_TOP - 26 }, out, { r: 10 }), inside: makeIonPool(ionLayer, { x0: X0, x1: X1, y0: Y_BOT + 62, y1: 480 }, inn, { r: 10 }) };
          particles = makeParticles(svgEl('g', {}, svg));
          electrodeTip = svgEl('g', { opacity: 0 }, svg);
          svgEl('path', { d: `M${X1 - 14},${Y_BOT + 100} L${X1 - 38},24 L${X1 - 26},24 L${X1 - 6},${Y_BOT + 98} Z`, fill: '#dfe6f2', stroke: '#2a2f3a', 'stroke-width': 1.5 }, electrodeTip);
          svgEl('text', { x: X1 - 42, y: 16, 'font-size': 13, fill: '#4a4f5a', 'text-anchor': 'end', text: 'recording electrode' }, electrodeTip);
          inset = drawInset(svg, opts.inset || opts.comp || profile.comp);
          ladder = drawLadder(svg, 706, 160);
          table = drawConcTable(svg, 682, 372);
          setCaption(opts.caption || '');
        },
        update(dtReal, dtSim) {
          const c = comp(), V = c.V, E = sim.E;
          insideRect.setAttribute('fill', insideFill(V));
          const neg = clamp(V / REST, 0, 1), pos = clamp(V / 35, 0, 1);
          chargePlus.setAttribute('opacity', neg); chargeMinus.setAttribute('opacity', neg);
          chargeFlipPlus.setAttribute('opacity', pos); chargeFlipMinus.setAttribute('opacity', pos);
          chans.forEach((ch, i) => {
            const t = channelTypes[i];
            if (t === 'pump') {
              if (sim.pumpOn && !app.paused) {
                pumpPhase += dtReal / 1400;
                if (pumpPhase >= 1) {
                  pumpPhase = 0;
                  for (let k = 0; k < 3; k++) particles.spawn('Na', ch.x + rand(-8, 8), Y_BOT + 40 + k * 10, ch.x + rand(-40, 40), Y_TOP - 40 - k * 8, 1100, { linger: 300 });
                  for (let k = 0; k < 2; k++) particles.spawn('K', ch.x + rand(-8, 8), Y_TOP - 40 - k * 10, ch.x + rand(-40, 40), Y_BOT + 40 + k * 8, 1100, { linger: 300 });

              }
              return;
            }

            if (state === 'open' && !app.paused) {
              const I = channelCurrent(t, c, V, E) * (profile.fluxScale || 1);   // profile.fluxScale: per-page particle density (a fibre segment carries ~100× a soma's current)
              const n = Math.min(3, counters[i](I, dtSim));

                const ion = ch.spec.ion, jitter = rand(-6, 6), dur = rand(650, 1000);

                else particles.spawn(ion, ch.x + jitter, Y_BOT + 30 + rand(0, 40), ch.x + rand(-80, 80), Y_TOP - 50 - rand(0, 60), dur);
              }
            }
          });
          if (!app.paused) { pool.outside.update(dtReal); pool.inside.update(dtReal); }
          particles.update(dtReal);
          // ladder: pulls are conductance shares
          const manual = isManualComp(c) ? sim.manual : { gNa: 0, gK: 0, gCl: 0 };
          const gNaTot = c.gNa + manual.gNa + c.gNaLeak;
          const gKTot = c.gK + manual.gK + c.gKLeak;
          const gAll = gNaTot + gKTot + (c.gL - c.gKLeak - c.gNaLeak) + manual.gCl + 1e-9;
          ladder.update(V, gNaTot / gAll, gKTot / gAll);
          table.update();
          electrodeTip.setAttribute('opacity', app.electrode ? 1 : 0);
          inset.update({ hideLabels: true });
        },
        narrate() {
          const c = comp(), V = c.V, d = c.dVdt, na = sim.naState(c), k = sim.kState(c), E = sim.E;
          const hasNaV = channelTypes.includes('Na_v');
          if (sim.manual.gNa > 0) return `You opened ${chip('Na')} channels → Na⁺ flows ${IN} (high outside, and the negative inside attracts it) → the inside gains positive charge → <b>Vm rises</b> toward E_Na.`;
          if (sim.manual.gK > 0) return `You opened extra ${chip('K')} channels → K⁺ flows ${OUT} (high inside) → the inside loses positive charge → <b>Vm falls</b> toward E_K.`;
          if (sim.manual.gCl > 0) return `You opened ${chip('Cl')} channels → Cl⁻ flows ${IN} → Vm is pulled toward E_Cl and <b>held near rest</b>.`;
          if (hasNaV && na === 'open' && d > 5 && V < 30) return `Voltage-gated ${chip('Na')} channels <b>OPEN</b> → Na⁺ rushes ${IN} → Vm shoots up toward E_Na (${fmtE(E.Na)}). Each bit of depolarization opens more Na⁺ channels.`;
          if (hasNaV && V > 0) return `<b>At the peak (${fmtV(V)} mV):</b> ${chip('Na')} channels are <b>inactivating</b> (plugs swing in) and the slower ${chip('K')} channels are opening. Na⁺ entry stops; K⁺ exit begins. Vm never reaches E_Na.`;
          if (hasNaV && (na === 'inactivated' || k === 'open') && d < -5) return `${chip('Na')} channels <b>INACTIVATED</b> (plugged, no more Na⁺ can enter). ${chip('K')} channels <b>OPEN</b> → K⁺ flows ${OUT} → Vm falls toward E_K (${fmtE(E.K)}).`;
          if (hasNaV && k === 'open' && V < REST - 2) return `<b>Undershoot:</b> ${chip('K')} channels are still open, so Vm sits below rest, close to E_K. ${chip('Na')} channels are recovering from inactivation.`;
          if (hasNaV && na === 'inactivated' && V > REST + 10) return `${chip('Na')} channels are inactivated; ${chip('K')} channels are opening. Na⁺ entry has stopped, K⁺ exit begins.`;
          if (d > 1 && V > REST + 2) return `Positive charge is entering (from the rest of the cell) → <b>depolarizing</b>: Vm = ${fmtV(V)} mV.`;
          if (d < -1 && V < REST + 4) return `Positive charge is leaving → <b>repolarizing</b> toward rest.`;
          if (V < REST - 2) return `Below rest: more ${chip('K')} is leaving than usual; Vm will drift back to ${fmtE(REST)} as K⁺ channels close.`;
          return `<b>At rest (≈ ${fmtE(REST)} mV):</b> ${chip('K')} trickles ${OUT} through leak channels (that is what makes the inside negative); a little ${chip('Na')} leaks ${IN}; the pump quietly restores the gradients.`;
        },
        channels: () => chans,
      };
    };

    // =======================================================================
    // Voltage trace
    // =======================================================================
    const TRACE_COLORS = profile.traceColors || {};
    const traceTitle = (comp, extras) => profile.traceTitle ? profile.traceTitle(comp, extras || []) : `Membrane potential recorded inside the ${comp}`;
    // Legend entries name the recording site, not the compartment's internal id.
    const traceLabel = (comp) => (profile.traceLabel ? profile.traceLabel(comp) : comp);
    function recordSample() {
      const s = { t: sim.t, V: {}, gNa: {}, gK: {}, x: sim.sampleExtras ? sim.sampleExtras() : {} };
      for (const c of sim.comps) { s.V[c.name] = c.V; s.gNa[c.name] = c.gNa; s.gK[c.name] = c.gK; }
      if (profile.extraVoltages) Object.assign(s.V, profile.extraVoltages(sim));
      app.history.push(s);
      const tmin = sim.t - app.historyMs;
      while (app.history.length && app.history[0].t < tmin) app.history.shift();
    }
    function gCompName() {
      let gc = app.gComp || app.recordComp;
      const c = sim.byName[gc];
      if (!c || !(c.gNaMax > 0)) gc = profile.apComp;
      return gc;
    }
    function drawTrace() {
      const dpr = window.devicePixelRatio || 1;
      const w = traceCanvas.clientWidth, h = traceCanvas.clientHeight;
      if (traceCanvas.width !== Math.round(w * dpr) || traceCanvas.height !== Math.round(h * dpr)) { traceCanvas.width = Math.round(w * dpr); traceCanvas.height = Math.round(h * dpr); }
      const ctx = traceCanvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      const padL = 74, padR = 14, padT = 8, padB = 20;
      const vmin = -100, vmax = 50;
      const BAND_H = 50;
      const gBand = app.showG ? 62 : 0, bandsH = app.bands.length * BAND_H, plotBottom = h - padB - gBand - bandsH;
      const W = app.historyWindow, t1 = Math.max(sim.t, W), t0 = t1 - W;
      const X = (t) => padL + (t - t0) / W * (w - padL - padR);
      const Y = (v) => padT + (vmax - v) / (vmax - vmin) * (plotBottom - padT);
      // grid
      ctx.font = '11px system-ui, sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      const grid = [
        { v: 50, lab: '+50', color: '#9ca3af', dash: [] },
        { v: 0, lab: '0', color: '#6b7280', dash: [] },
        { v: THR, lab: 'threshold', color: '#d97706', dash: [4, 4], thr: true },
        { v: REST, lab: `rest ${fmtE(REST)}`, color: '#2563eb', dash: [2, 4] },
        { v: -100, lab: '−100', color: '#9ca3af', dash: [] },
      ];
      for (const { v, lab, color, dash, thr } of grid) {
        if (thr && !app.showThreshold) continue;
        ctx.strokeStyle = color; ctx.setLineDash(dash); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(padL, Y(v)); ctx.lineTo(w - padR, Y(v)); ctx.stroke();
        ctx.fillStyle = color; ctx.fillText(lab, padL - 4, Y(v));
      }
      ctx.setLineDash([]);
      ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = '#6b7280';
      const tickMs = W <= 100 ? 10 : (W <= 400 ? 50 : (W <= 1000 ? 100 : 200));
      for (let t = Math.ceil(t0 / tickMs) * tickMs; t <= t1 + 1e-6; t += tickMs) { ctx.fillText(t.toFixed(0), X(t), h - padB + 4); ctx.strokeStyle = '#eee'; ctx.beginPath(); ctx.moveTo(X(t), padT); ctx.lineTo(X(t), plotBottom); ctx.stroke(); }
      ctx.textAlign = 'left'; ctx.fillText('time (ms)', 4, h - padB + 4);
      // conductance sub-plot: how many Na⁺ / K⁺ channels are open
      if (app.showG) {
        const gc = gCompName();
        const gmax = Math.max(sim.byName[gc] ? sim.byName[gc].gNaMax : 0, 1e-9);
        const top = plotBottom + 10, bh = gBand - 16, base = top + bh;
        ctx.strokeStyle = '#d1d5db'; ctx.beginPath(); ctx.moveTo(padL, base); ctx.lineTo(w - padR, base); ctx.stroke();
        ctx.fillStyle = '#6b7280'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText('open', padL - 4, top + 4); ctx.fillText('channels', padL - 4, top + 16); ctx.fillText('none', padL - 4, base);
        for (const [key, color] of [['gNa', '#e8772e'], ['gK', '#8e5cf0']]) {
          ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); let first = true;
          for (const s of app.history) { if (s.t < t0 || s[key][gc] == null) continue; const y = base - clamp(s[key][gc] / gmax, 0, 1) * bh; if (first) { ctx.moveTo(X(s.t), y); first = false; } else ctx.lineTo(X(s.t), y); }
          ctx.stroke();
        }
      }
      // extra bands: model-specific scalar series recorded in s.x[key]
      app.bands.forEach((b, j) => {
        const top = plotBottom + gBand + 10 + j * BAND_H, bh = BAND_H - 16, base = top + bh;
        const lo = b.min || 0, hi = b.max == null ? 1 : b.max;
        ctx.strokeStyle = '#d1d5db'; ctx.beginPath(); ctx.moveTo(padL, base); ctx.lineTo(w - padR, base); ctx.stroke();
        ctx.fillStyle = '#6b7280'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        const lines = String(b.label || b.key).split('\n');
        lines.forEach((ln, i) => ctx.fillText(ln, padL - 4, top + 4 + i * 12));
        ctx.strokeStyle = b.color || '#1f2430'; ctx.lineWidth = 2; ctx.beginPath(); let first = true;
        for (const s of app.history) { const v = s.x && s.x[b.key]; if (s.t < t0 || v == null) continue; const y = base - clamp((v - lo) / (hi - lo || 1), 0, 1) * bh; if (first) { ctx.moveTo(X(s.t), y); first = false; } else ctx.lineTo(X(s.t), y); }
        ctx.stroke();
      });
      // traces
      const series = [[app.recordComp, TRACE_COLORS[app.recordComp] || '#1f2430', 2.2]].concat(app.extraTraces.map(c => [c, TRACE_COLORS[c] || '#0f766e', 1.6]));
      for (const [comp, color, lw] of series) {
        ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath(); let first = true;
        for (const s of app.history) { if (s.t < t0 || s.V[comp] == null) continue; const x = X(s.t), y = Y(clamp(s.V[comp], vmin, vmax)); if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y); }

    function applyTraceLayout() {

    }

    // =======================================================================
    // Side panel / lesson runner
    // =======================================================================
    const ctx = {
      sim, app, profile,
      view: () => app.view,
      complete() { if (runner.state && !runner.state.done) { runner.state.done = true; refreshNav(); } },
      status(msg, ok) { const s = panel.querySelector('.status'); if (s) { s.innerHTML = msg; s.classList.toggle('ok', !!ok); } },
      pause() { setPaused(true); },
      resume() { setPaused(false); },
      next() { gotoStep(runner.scene, runner.step + 1); },
      mark(label) { app.markers.push({ t: sim.t, label }); },
      stepState: () => runner.state,
      refresh() { renderPanel(); },
    };

    function setPaused(p) {
      app.paused = p;
      $('#btn-pause').textContent = p ? 'Resume' : 'Pause';
      $('#paused-badge').style.display = p ? 'block' : 'none';
    }
    function setSpeed(s) { app.speed = s; const sel = $('#speed'); sel.value = String(s); if (sel.value !== String(s)) { const o = document.createElement('option'); o.value = String(s); o.textContent = `1 s = ${(s * 1000) % 1 === 0 ? (s * 1000).toFixed(0) : (s * 1000).toFixed(1)} ms`; sel.appendChild(o); sel.value = String(s); } }

    function currentStep() { return LESSON[runner.scene].steps[runner.step]; }

    function gotoStep(si, ki) {
      if (si >= LESSON.length) si = LESSON.length - 1;
      if (ki >= LESSON[si].steps.length) { if (si + 1 < LESSON.length) { si++; ki = 0; } else { ki = LESSON[si].steps.length - 1; } }
      if (ki < 0) { if (si > 0) { si--; ki = LESSON[si].steps.length - 1; } else ki = 0; }
      runner.labMode = false;
      const sceneChanged = si !== runner.scene || runner.state == null;
      runner.scene = si; runner.step = ki;
      const scene = LESSON[si], step = scene.steps[ki];
      runner.state = { done: !step.waitFor, answered: !step.question, attempts: 0, data: {} };
      // Steps inherit view configuration from earlier steps of the same scene, so jumping
      // into the middle of a scene (or stepping back into it) shows the right picture.
      const eff = {};

      if (needView) mountView(eff.view, eff.viewOpts || {});

    function renderProgress() {
      const p = $('#progress'); p.innerHTML = '';
      LESSON.forEach((s, i) => {
        const b = document.createElement('button');
        b.textContent = i + 1; b.title = s.title;
        b.className = runner.labMode ? '' : (i < runner.scene ? 'done' : i === runner.scene ? 'current' : '');
        b.addEventListener('click', () => gotoStep(i, 0));
        p.appendChild(b);
      });
    }

    function renderPanel() {
      const scene = LESSON[runner.scene], step = currentStep(), st = runner.state;
      panel.innerHTML = '';
      panel.appendChild(htmlEl('div', { class: 'scene-label' }, `Scene ${runner.scene + 1} of ${LESSON.length} · ${scene.title}`));
      panel.appendChild(htmlEl('h2', {}, step.title || scene.title));
      const text = typeof step.text === 'function' ? step.text(ctx) : step.text;
      if (text) panel.appendChild(htmlEl('div', { class: 'text' }, text));
      if (step.question) panel.appendChild(renderQuestion(step.question, st));
      if (step.actions && step.actions.length) {
        const a = htmlEl('div', { class: 'actions' });
        for (const act of step.actions) {
          const b = htmlEl('button', { class: act.cls || '' }, act.label);
          if (act.hold) {
            const down = (e) => { e.preventDefault(); act.down(ctx); b.classList.add('held'); };
            const up = () => { act.up(ctx); b.classList.remove('held'); };

      if (step.extraHtml) panel.appendChild(htmlEl('div', { class: 'extra' }, typeof step.extraHtml === 'function' ? step.extraHtml(ctx) : step.extraHtml));
      const nav = htmlEl('div', { class: 'nav' });

      const hint = htmlEl('span', { class: 'hint' }, '');

      cont.addEventListener('click', () => { if (step.onContinue) step.onContinue(ctx); if (step.continueTo) step.continueTo(ctx); else gotoStep(runner.scene, runner.step + 1); });

    function refreshNav() {
      const st = runner.state, step = currentStep(), b = $('#btn-continue'), hint = panel.querySelector('.nav .hint');
      if (!b) return;
      const ok = st.answered && st.done;
      b.disabled = !ok;
      if (hint) hint.textContent = ok ? '' : (!st.answered ? 'Answer the question to continue' : (step.waitHint || 'Complete the activity to continue'));
    }

    function renderQuestion(q, st) {
      const box = htmlEl('div', { class: 'question' });
      box.appendChild(htmlEl('div', { class: 'prompt' }, q.prompt));
      const opts = htmlEl('div', { class: 'options' });
      const fb = htmlEl('div', { class: 'feedback', style: 'display:none' });
      questionOrder(q).map(i => q.options[i]).forEach((o) => {
        const b = htmlEl('button', {}, o.t);
        b.addEventListener('click', () => {
          st.attempts++;

          }
